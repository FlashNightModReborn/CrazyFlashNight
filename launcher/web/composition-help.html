<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CF7:ME Help</title>
<!-- 只读 Help 试点页：复用生产 panel 体系，不引 bootstrap-main / 全量 lazy 注册表。 -->
<!-- help-panel 样式在 panels.css 的 panels/features.css 内；help/*.md 相对本页（web 根）解析。 -->
<link rel="stylesheet" href="css/game-ui-behavior.css">
<link rel="stylesheet" href="css/overlay.css">
<link rel="stylesheet" href="css/panels.css">
</head>
<body>

<!-- Panel system（与 overlay.html 同结构，Panels.init 依赖这三个 id） -->
<div id="panel-container" style="display:none">
  <div id="panel-backdrop"></div>
  <div id="panel-content"></div>
</div>
<div id="panel-tooltip"></div>

<!-- 加载顺序有约束：
     1. bridge.js 提供 Bridge；
     2. composition-help.js 必须在 panels.js 之前执行——它要先注册 panel_cmd 监听
        （记录 open 的 initData.panelInstanceId）并装好出站过滤，再让 Panels 绑自己的 handler；
     3. help-panel.js 在 boot 直接 Panels.register('help')，不走 LazyLoader/registry。 -->
<script src="lib/marked.min.js"></script>
<script src="generated/font-catalog.js"></script>
<script src="modules/bridge.js"></script>
<script src="modules/composition-help.js"></script>
<script src="modules/panels.js"></script>
<script src="modules/panel-scale.js"></script>
<script src="modules/help-panel.js"></script>
</body>
</html>
