<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Panel Harness</title>
    <link rel="stylesheet" href="../../../css/panels.css">
    <link rel="stylesheet" href="../../minigames/shared/dev/harness-base.css">
    <style>
        /* harness 专属样式 */
        :root {
            --arena-harness-line: #474b55;
            --arena-harness-line-bright: #6b7079;
            --arena-harness-accent: #ef9442;
            --arena-harness-accent-2: #ffb65a;
            --arena-harness-text: #d6d9de;
            --arena-harness-dim: #8b8f98;
            --arena-harness-muted: #686c75;
            --arena-harness-control:
                linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.018)),
                rgba(10,12,17,0.84);
            --arena-harness-control-hover:
                linear-gradient(180deg, rgba(239,148,66,0.14), rgba(239,148,66,0.055)),
                rgba(12,13,17,0.90);
        }
        body {
            margin: 0;
            padding: 0;
            background:
                radial-gradient(110% 90% at 50% -12%, rgba(239,148,66,0.10), transparent 58%),
                linear-gradient(180deg, #191b21 0%, #0c0d11 100%);
            font-family: system-ui, "Microsoft YaHei", sans-serif;
            color: var(--arena-harness-text);
        }
        #harness-toolbar {
            min-height: 48px;
            padding: 8px 14px;
            background: linear-gradient(180deg, rgba(239,148,66,0.08), rgba(12,13,17,0.92));
            border-bottom: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 12px 28px rgba(0,0,0,0.28);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            position: relative;
            z-index: 2;
        }
        #harness-toolbar::after {
            content: '';
            position: absolute;
            left: 14px;
            right: 14px;
            bottom: -1px;
            height: 1px;
            background: linear-gradient(90deg, var(--arena-harness-accent), transparent 70%);
            opacity: 0.55;
            pointer-events: none;
        }
        #harness-toolbar label {
            font-size: 11px;
            line-height: 30px;
            color: var(--arena-harness-muted);
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        #harness-toolbar select,
        #harness-toolbar button {
            height: 30px;
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 4px;
            color: var(--arena-harness-dim);
            font: 700 12px/1 system-ui, "Microsoft YaHei", sans-serif;
            letter-spacing: 0.6px;
            outline: none;
            cursor: pointer;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.14);
            transition: border-color 0.14s, background 0.14s, color 0.14s, box-shadow 0.14s, transform 0.08s;
        }
        #harness-toolbar select {
            min-width: 132px;
            padding: 0 30px 0 10px;
            -webkit-appearance: none;
            appearance: none;
            background:
                linear-gradient(45deg, transparent 50%, var(--arena-harness-accent-2) 50%) calc(100% - 15px) 12px / 5px 5px no-repeat,
                linear-gradient(135deg, var(--arena-harness-accent-2) 50%, transparent 50%) calc(100% - 10px) 12px / 5px 5px no-repeat,
                linear-gradient(90deg, transparent calc(100% - 31px), rgba(239,148,66,0.12) calc(100% - 31px)),
                var(--arena-harness-control);
        }
        #harness-toolbar select::-ms-expand {
            display: none;
        }
        #harness-toolbar button {
            min-width: 92px;
            padding: 0 12px;
            background: var(--arena-harness-control);
        }
        #harness-toolbar select:hover,
        #harness-toolbar select:focus,
        #harness-toolbar button:hover,
        #harness-toolbar button:focus-visible {
            color: var(--arena-harness-accent-2);
            border-color: rgba(239,148,66,0.60);
            background: var(--arena-harness-control-hover);
            box-shadow: 0 0 0 1px rgba(239,148,66,0.16), inset 0 0 0 1px rgba(0,0,0,0.18);
        }
        #harness-toolbar button:active {
            transform: translateY(1px);
        }
        #harness-status {
            min-height: 24px;
            padding: 4px 14px;
            background: rgba(8,9,12,0.92);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 12px;
            color: var(--arena-harness-muted);
            font-family: "Consolas", "Microsoft YaHei", monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #qa-panel,
        #debug-log {
            background: rgba(10,12,17,0.90);
            border: 1px solid rgba(239,148,66,0.30);
            border-radius: 4px;
            color: var(--arena-harness-text);
            box-shadow: 0 14px 34px rgba(0,0,0,0.36), inset 0 0 0 1px rgba(255,255,255,0.035);
            font-family: "Consolas", "Microsoft YaHei", monospace;
        }
        #qa-panel {
            width: min(440px, calc(100vw - 28px));
        }
        .qa-title {
            color: var(--arena-harness-accent-2);
            letter-spacing: 1px;
        }
        #qa-run {
            height: 26px;
            padding: 0 10px;
            background: var(--arena-harness-control);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 4px;
            color: var(--arena-harness-dim);
            font: 700 12px/1 system-ui, "Microsoft YaHei", sans-serif;
            cursor: pointer;
        }
        #qa-run:hover,
        #qa-run:focus-visible {
            outline: none;
            color: var(--arena-harness-accent-2);
            border-color: rgba(239,148,66,0.60);
            background: var(--arena-harness-control-hover);
        }
        #qa-summary,
        #qa-list .detail {
            color: var(--arena-harness-muted);
        }
        #qa-list .pass {
            color: #a9e6b2;
        }
        #qa-list .fail {
            color: #ffaaa0;
        }
        #debug-log {
            left: 14px;
            bottom: 14px;
            max-width: 300px;
            max-height: 150px;
            padding: 10px 12px;
            opacity: 0.78;
            transition: opacity 0.14s, border-color 0.14s;
        }
        #debug-log:hover {
            opacity: 1;
            border-color: rgba(239,148,66,0.52);
        }
        #viewport-shell {
            margin: 14px auto 0;
            border: 1px solid rgba(107,112,121,0.68);
            background: #000;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 18px 48px rgba(0,0,0,0.42),
                0 0 0 1px rgba(255,255,255,0.035),
                inset 0 0 0 1px rgba(255,255,255,0.035);
            /* 默认 1024x576（Flash 设计分辨率） */
            width: 1024px;
            height: 576px;
        }
        /* QA 模式全屏 */
        body.arena-qa { overflow: hidden; }
        body.arena-qa #harness-toolbar,
        body.arena-qa #harness-status { display: none; }
        body.arena-qa #viewport-shell {
            margin: 0;
            border: 0;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="harness-toolbar">
        <label>视口:</label>
        <select id="viewport-select">
            <option value="1024x576">1024×576 (原始)</option>
            <option value="1024x720">1024×720 (launcher)</option>
            <option value="1366x768">1366×768</option>
            <option value="1600x900" selected>1600×900</option>
            <option value="1920x1080">1920×1080</option>
        </select>
        <label>金钱:</label>
        <select id="money-fixture">
            <option value="rich">富裕 (10,000,000)</option>
            <option value="normal" selected>正常 (5,717,348)</option>
            <option value="poor">贫穷 (1,000)</option>
            <option value="broke">破产 (0)</option>
        </select>
        <button id="btn-open" type="button">Open Panel</button>
        <button id="btn-close" type="button">Close Panel</button>
        <button id="btn-force-close" type="button">Force Close</button>
        <button id="btn-dump" type="button">Dump State</button>
    </div>
    <div id="harness-status">就绪</div>
    <div id="viewport-shell">
        <div id="panel-container" style="display:none">
            <div id="panel-backdrop"></div>
            <div id="panel-content"></div>
        </div>
    </div>

    <!-- chrome.webview mock 必须在 bridge.js 之前定义 -->
    <script>
    (function() {
        var listeners = [];
        window.chrome = window.chrome || {};
        window.chrome.webview = {
            addEventListener: function(type, handler) {
                if (type === 'message') listeners.push(handler);
            },
            postMessage: function(message) {
                if (window.ArenaHarnessHost) {
                    window.ArenaHarnessHost.sentMessages.push(message);
                    if (window.ArenaHarnessHost.handleMessage)
                        window.ArenaHarnessHost.handleMessage(message);
                }
            },
            __dispatch: function(data) {
                var event = { data: data };
                listeners.forEach(function(l) { l(event); });
            }
        };
    })();
    </script>

    <!-- 共享基础设施 -->
    <script src="../../bridge.js"></script>
    <script src="../../panels.js"></script>
    <script src="../../panel-scale.js"></script>
    <script src="../../tooltip.js"></script>
    <script src="../../asset-timeline.js"></script>
    <script>window.CF7_ICON_ROOT = '../../../icons/';</script>

    <!-- PanelTooltip 容器（生产环境由 overlay.html 提供） -->
    <div id="panel-tooltip" style="display:none;position:fixed;background:#1a1a1a;border:1px solid #444;padding:8px;font-size:11px;color:#ddd;z-index:9999;pointer-events:none;border-radius:3px;"></div>

    <!-- 面板业务逻辑 -->
    <script src="../../arena-meta-rosters.js"></script>

    <!-- Harness 初始化 -->
    <script>
    (function() {
        'use strict';

        // ── 解析 URL query ──
        var query = {};
        var search = window.location.search;
        if (search) {
            var pairs = search.substring(1).split('&');
            for (var i = 0; i < pairs.length; i++) {
                var kv = pairs[i].split('=');
                if (kv.length === 2) query[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1]);
            }
        }

        // ── QA 模式 CSS ──
        if (query.qa === '1' || query.case) {
            document.body.classList.add('arena-qa');
        }

        // ── Fixture 数据 ──
        var FIXTURES = {
            rich:   { money: 10000000, playerLevel: 32, reuseCount: 0, reuseLimit: 2 },
            normal: { money: 5717348,  playerLevel: 28, reuseCount: 1, reuseLimit: 2 },
            poor:   { money: 1000,     playerLevel: 12, reuseCount: 2, reuseLimit: 4 },
            broke:  { money: 0,        playerLevel: 8,  reuseCount: 0, reuseLimit: 2 }
        };
        var DEFAULT_KNOWN_ENEMIES = [
            '敌人-终结者T800',
            '敌人-玩具机器人',
            '敌人-诺艾尔',
            '主角-男',
            '主角-尾上世莉架'
        ];
        // ── Host 对象 ──
        var host = window.ArenaHarnessHost = {
            sentMessages: [],
            enterMessages: [],
            previewMessages: [],
            nextEnterError: '',
            // QA 用：单卡 preview 失败注入。{cardIdx → errString} — preview mock 命中即返失败，单次有效
            failNextPreviewByCardIdx: {},
            // mock 端按 cardIndex 缓存 lineup（供 QA 验"web 收到的回包确实带了 cardIndex" + "lineup 一致性"）
            _previewCache: {},
            _customBatch: null,
            _customStatusPolls: 0,
            _customResultOpens: 0,
            _fixture: 'normal',
            _knownEnemies: DEFAULT_KNOWN_ENEMIES.slice(),

            setViewport: function(value) {
                var shell = document.getElementById('viewport-shell');
                if (!shell) return;
                if (value === 'fullscreen') {
                    shell.style.width = '100vw';
                    shell.style.height = '100vh';
                } else {
                    var wh = value.split('x');
                    shell.style.width = wh[0] + 'px';
                    shell.style.height = wh[1] + 'px';
                }
            },

            setFixture: function(name) {
                this._fixture = name;
            },

            setKnownEnemies: function(list) {
                this._knownEnemies = (list || []).slice();
            },

            getSnapshot: function() {
                var f = FIXTURES[this._fixture] || FIXTURES.normal;
                return {
                    money: f.money,
                    playerLevel: f.playerLevel,
                    reuseCount: f.reuseCount,
                    reuseLimit: f.reuseLimit,
                    knownEnemies: this._knownEnemies.slice()
                };
            },

            open: function(options) {
                chrome.webview.__dispatch({
                    type: 'panel_cmd',
                    cmd: 'open',
                    panel: 'arena',
                    initData: options || {}
                });
            },

            close: function() {
                chrome.webview.__dispatch({ type: 'panel_cmd', cmd: 'close' });
            },

            forceClose: function() {
                chrome.webview.__dispatch({ type: 'panel_cmd', cmd: 'force_close' });
            },

            // QA helper：让 next preview 命中此 cardIdx 时返回失败（模拟 stock_insufficient / network err）
            failNextPreviewForCard: function(cardIdx, errString) {
                this.failNextPreviewByCardIdx[cardIdx] = errString || 'stock_insufficient';
            },

            getPreviewCache: function() {
                return this._previewCache;
            },

            resetPreviewState: function() {
                this.previewMessages = [];
                this._previewCache = {};
                this.failNextPreviewByCardIdx = {};
            },

            resetCustomState: function() {
                this._customBatch = null;
                this._customStatusPolls = 0;
                this._customResultOpens = 0;
                try { window.localStorage.removeItem('cf7.arena.custom.savedRosters.v1'); } catch (e) {}
            },

            handleMessage: function(message) {
                var status = document.getElementById('harness-status');
                if (status) status.textContent = '→ ' + JSON.stringify(message).substring(0, 200);

                if (message.cmd === 'snapshot') {
                    setTimeout(function() {
                        chrome.webview.__dispatch({
                            type: 'panel_resp',
                            panel: 'arena',
                            cmd: 'snapshot',
                            callId: message.callId,
                            success: true,
                            snapshot: host.getSnapshot()
                        });
                    }, 50);
                }
                else if (message.cmd === 'enter') {
                    host.enterMessages.push(message);
                    setTimeout(function() {
                        if (host.nextEnterError) {
                            chrome.webview.__dispatch({
                                type: 'panel_resp',
                                panel: 'arena',
                                cmd: 'enter',
                                callId: message.callId,
                                cardIndex: message.cardIndex,
                                success: false,
                                error: host.nextEnterError
                            });
                            host.nextEnterError = '';
                        } else {
                            chrome.webview.__dispatch({
                                type: 'panel_resp',
                                panel: 'arena',
                                cmd: 'enter',
                                callId: message.callId,
                                cardIndex: message.cardIndex,
                                success: true,
                                closePanel: true
                            });
                        }
                    }, 100);
                }
                else if (message.cmd === 'preview') {
                    host.previewMessages.push(message);
                    var cardIdx = message.cardIndex;
                    setTimeout(function() {
                        // 失败注入（QA case grid-single-fail-retry 用）：单次有效，回包后清掉
                        if (cardIdx !== undefined && host.failNextPreviewByCardIdx[cardIdx] !== undefined) {
                            var errString = host.failNextPreviewByCardIdx[cardIdx];
                            delete host.failNextPreviewByCardIdx[cardIdx];
                            chrome.webview.__dispatch({
                                type: 'panel_resp',
                                panel: 'arena',
                                cmd: 'preview',
                                callId: message.callId,
                                cardIndex: cardIdx,
                                success: false,
                                error: errString
                            });
                            return;
                        }
                        // 简化 fixture：根据 expr 解析等级范围 / 人数，生成 placeholder 对手数据
                        var m = String(message.expr || '').match(/@(\d+)-(\d+)%(\d+)/);
                        var lo = m ? Number(m[1]) : 1;
                        var hi = m ? Number(m[2]) : 10;
                        var count = m ? Number(m[3]) : 1;
                        var opponents = [];
                        for (var i = 0; i < count; i++) {
                            var lvl = lo + Math.floor((hi - lo) * (i + 1) / (count + 1));
                            var eLvl = Math.max(1, Math.floor(lvl/5));
                            // 名字带 cardIdx 让 QA 能验"摘要文本与回包数据一致"且区分卡片
                            var oppName = (cardIdx !== undefined ? 'C' + cardIdx + '-' : '') + 'Mock-' + (i + 1);
                            opponents.push({
                                name: oppName,
                                level: lvl,
                                equips: [
                                    { slot: 6,  raw: '铁盔',         name: '铁盔', icon: '铁盔', displayname: '铁盔',         level: eLvl },
                                    { slot: 8,  raw: '铁甲##二阶',    name: '铁甲', icon: '铁甲', displayname: '铁甲 二阶',     level: eLvl },
                                    { slot: 10, raw: '铁靴',         name: '铁靴', icon: '铁靴', displayname: '铁靴',         level: eLvl },
                                    { slot: 12, raw: 'M14',          name: 'M14',  icon: 'M14',  displayname: 'M14',          level: eLvl }
                                ],
                                // 技能 mock（AS2 端由 MercPanelService.buildSkills 回传 {name,level,type,trait,cooldown,cost}）
                                skills: [
                                    { name: '瞬步',   level: 1 + (i % 5),       type: '位移', trait: '闪避', cooldown: 8,  cost: 20 },
                                    { name: '蓄力斩', level: 1 + ((i + 1) % 6), type: '近战', trait: '爆发', cooldown: 12, cost: 35 },
                                    { name: '战吼',   level: 1 + (i % 3),       type: '增益', trait: '团队', cooldown: 20, cost: 15 }
                                ]
                            });
                        }
                        if (cardIdx !== undefined) {
                            host._previewCache[cardIdx] = opponents;
                        }
                        chrome.webview.__dispatch({
                            type: 'panel_resp',
                            panel: 'arena',
                            cmd: 'preview',
                            callId: message.callId,
                            cardIndex: cardIdx,
                            success: true,
                            expr: message.expr,
                            opponents: opponents
                        });
                    }, 80);
                }
                else if (message.cmd === 'equip_tooltip') {
                    setTimeout(function() {
                        var raw = message.raw || message.name || '';
                        chrome.webview.__dispatch({
                            type: 'panel_resp',
                            panel: 'arena',
                            cmd: 'equip_tooltip',
                            callId: message.callId,
                            success: true,
                            itemName: raw,
                            displayname: raw + ' Lv.' + message.level,
                            descHTML: '基础属性: 攻击 +' + (message.level * 10),
                            introHTML: '<FONT COLOR=\'#FFCC00\'>强化 ' + message.level + ' 级</FONT>'
                        });
                    }, 50);
                }
                else if (message.cmd === 'custom_start') {
                    host._customStatusPolls = 0;
                    host._customBatch = {
                        batchId: 'custom-harness-001',
                        state: 'running',
                        matchCode: message.matchCode || '',
                        totalRuns: 1,
                        completedRuns: 0,
                        resultPath: 'logs/arena-custom/custom-harness-001-results.jsonl',
                        manifestPath: 'tmp/arena-calibration/batches/custom-harness-001/case_manifest.json',
                        lastResult: {
                            schema: 'arena-calibration.result.v1',
                            batchId: 'custom-harness-001',
                            caseId: message.calibrationCase ? message.calibrationCase.caseId : 'arena-custom-p3',
                            runId: 'arena-custom-p3-r001',
                            status: 'finished',
                            winner: 'blue',
                            frames: 96
                        }
                    };
                    setTimeout(function() {
                        chrome.webview.__dispatch({
                            type: 'panel_resp',
                            panel: 'arena',
                            cmd: 'custom_start',
                            callId: message.callId,
                            success: true,
                            state: host._customBatch.state,
                            batchId: host._customBatch.batchId,
                            totalRuns: host._customBatch.totalRuns,
                            completedRuns: host._customBatch.completedRuns,
                            resultPath: host._customBatch.resultPath,
                            manifestPath: host._customBatch.manifestPath,
                            closePanel: true
                        });
                    }, 40);
                    setTimeout(function() {
                        if (!host._customBatch || host._customBatch.state !== 'running') return;
                        host._customBatch.state = 'completed';
                        host._customBatch.completedRuns = 1;
                        host._customResultOpens += 1;
                        chrome.webview.__dispatch({
                            type: 'panel_cmd',
                            cmd: 'open',
                            panel: 'arena',
                            initData: {
                                mode: 'custom_result',
                                source: 'arena_custom_match_result_harness',
                                debug: true,
                                matchCode: host._customBatch.matchCode,
                                state: host._customBatch.state,
                                batchId: host._customBatch.batchId,
                                totalRuns: host._customBatch.totalRuns,
                                completedRuns: host._customBatch.completedRuns,
                                resultPath: host._customBatch.resultPath,
                                manifestPath: host._customBatch.manifestPath,
                                lastResult: host._customBatch.lastResult
                            }
                        });
                    }, 180);
                }
                else if (message.cmd === 'custom_status') {
                    if (!host._customBatch) host.resetCustomState();
                    host._customStatusPolls += 1;
                    if (host._customBatch && host._customStatusPolls >= 1 && host._customBatch.state === 'running') {
                        host._customBatch.state = 'completed';
                        host._customBatch.completedRuns = 1;
                    }
                    setTimeout(function() {
                        chrome.webview.__dispatch({
                            type: 'panel_resp',
                            panel: 'arena',
                            cmd: 'custom_status',
                            callId: message.callId,
                            success: true,
                            state: host._customBatch ? host._customBatch.state : 'idle',
                            batchId: host._customBatch ? host._customBatch.batchId : '',
                            totalRuns: host._customBatch ? host._customBatch.totalRuns : 0,
                            completedRuns: host._customBatch ? host._customBatch.completedRuns : 0,
                            resultPath: host._customBatch ? host._customBatch.resultPath : ''
                        });
                    }, 40);
                }
                else if (message.cmd === 'custom_abort') {
                    if (!host._customBatch) {
                        host._customBatch = { batchId: message.batchId || 'custom-harness-001', state: 'aborted', totalRuns: 1, completedRuns: 1 };
                    } else {
                        host._customBatch.state = 'aborted';
                        host._customBatch.completedRuns = 1;
                    }
                    setTimeout(function() {
                        chrome.webview.__dispatch({
                            type: 'panel_resp',
                            panel: 'arena',
                            cmd: 'custom_abort',
                            callId: message.callId,
                            success: true,
                            state: host._customBatch.state,
                            batchId: host._customBatch.batchId,
                            totalRuns: host._customBatch.totalRuns,
                            completedRuns: host._customBatch.completedRuns
                        });
                    }, 40);
                }
                else if (message.cmd === 'close') {
                    // Web 通知 C# 关闭；harness 中无需回包
                }
            }
        };

        // ── Toolbar 绑定 ──
        document.getElementById('viewport-select').addEventListener('change', function(e) {
            host.setViewport(e.target.value);
        });
        document.getElementById('money-fixture').addEventListener('change', function(e) {
            host.setFixture(e.target.value);
            if (Panels.getActive && Panels.getActive() === 'arena') {
                // 若 panel 已打开，模拟推一条 snapshot 更新
                chrome.webview.__dispatch({
                    type: 'panel_resp',
                    panel: 'arena',
                    cmd: 'snapshot',
                    callId: 'harness_push_' + Date.now(),
                    success: true,
                    snapshot: host.getSnapshot()
                });
            }
        });
        document.getElementById('btn-open').addEventListener('click', function() { host.open(); });
        document.getElementById('btn-close').addEventListener('click', function() { host.close(); });
        document.getElementById('btn-force-close').addEventListener('click', function() { host.forceClose(); });
        document.getElementById('btn-dump').addEventListener('click', function() {
            var st = window.ArenaPanel ? window.ArenaPanel.getState() : null;
            console.log('[Harness Dump]', st);
            var status = document.getElementById('harness-status');
            if (status) status.textContent = 'Dump: ' + JSON.stringify(st);
        });

        // ── MinigameHarness 启动 ──
        var api = MinigameHarness.create({
            panelId: 'arena',
            title: 'Arena Panel QA',
            openPanel: function() {
                host.setFixture(document.getElementById('money-fixture').value);
                host.open();
            },
            runSuite: function(api, onlyCase) {
                return ArenaHarnessQA.runSuite(api, host, onlyCase);
            },
            collectDump: function() {
                return Promise.resolve(window.ArenaPanel ? window.ArenaPanel.getState() : null);
            }
        });

        // 自动 boot（加载 panel + 按需跑 QA）
        api.boot();

        // 若 URL 带 ?open=1 自动打开
        if (query.open === '1') {
            setTimeout(function() { host.open(); }, 200);
        }
    })();
    </script>

    <!-- QA Suite -->
    <script src="./qa-suite.js"></script>
</body>
</html>
