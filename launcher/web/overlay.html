<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CF7:ME Overlay</title>
<link rel="stylesheet" href="css/game-ui-behavior.css">
<link rel="stylesheet" href="css/overlay.css">
<link rel="stylesheet" href="css/panels.css">
<link rel="stylesheet" href="css/terminal.css">
<link rel="stylesheet" href="css/settings-panel.css">
<link rel="stylesheet" href="modules/minigames/shared/minigame-shell.css">
<link rel="stylesheet" href="modules/minigames/lockbox/lockbox.css">
<link rel="stylesheet" href="modules/minigames/pinalign/pinalign.css">
<link rel="stylesheet" href="modules/minigames/gobang/gobang.css">
<link rel="stylesheet" href="modules/minigames/blackmarket/blackmarket.css">
</head>
<body>

<!-- 常驻 HUD（刘海/通知/toast/右上工具/地图/搓招/安全退出/点歌标题栏）已全部迁移到 C# NativeHud； -->
<!-- 本页面只承载 panel 体系 + cursor 反馈 + tooltip + 后台服务（doll-bake 等）。 -->
<!-- 面板模块的 Toast.add 经 panel-toast 桥接上送 Host，由 NativeHud ToastWidget 渲染。 -->

<!-- 游戏帮助已迁移至 Panel 系统 (help-panel.js) -->

<!-- Panel system -->
<div id="panel-container" style="display:none">
  <div id="panel-backdrop"></div>
  <div id="panel-content"></div>
</div>
<div id="panel-tooltip"></div>

<!-- ── Boot 同步加载（调度器 + 共享数据 + panel 基础设施） ── -->
<script src="modules/game-ui-behavior.js"></script>
<script src="lib/marked.min.js"></script>
<script src="modules/perf-frame-limiter.js"></script>
<script src="generated/font-catalog.js"></script>
<script src="modules/bridge.js"></script>
<script src="modules/uidata.js"></script>
<script src="modules/toast.js"></script>
<script src="modules/cursor-feedback.js"></script>
<!-- modules/jukebox.js 旧脚本已被 modules/jukebox/jukebox-panel.js 取代（lazy） -->
<script src="modules/lazy-loader.js"></script>
<!-- doll-bake：常驻后台烘焙（无 UI），dressup 渲染闭包按需 LazyLoader 注入 -->
<script src="modules/doll-bake.js"></script>
<script src="modules/panels.js"></script>
<script src="modules/panel-scale.js"></script>
<script src="modules/audio.js"></script>
<script src="modules/overlay-audio-bindings.js"></script>
<script src="modules/tooltip.js"></script>
<script src="modules/asset-timeline.js"></script>
<script src="modules/icons.js"></script>
<!-- map-panel-data.js / map-fit-presets.js 供 map panel 使用，仍 boot 加载 -->
<script src="modules/map-panel-data.js"></script>
<script src="modules/map-fit-presets.js"></script>
<!-- ── Lazy panel 注册（按 panel_cmd:open 触发时才加载实际模块） ── -->
<script src="modules/panels-lazy-registry.js"></script>
<script>
(function() {
    window.addEventListener('load', function() {
        Panels.init();
        if (window.OverlayViewportMetrics) OverlayViewportMetrics.report('load_before_ready');
        Bridge.send({ type: 'ready' });
        if (window.OverlayViewportMetrics) OverlayViewportMetrics.schedule('load_after_ready');

        // boot 完成后空闲时段预热地图首页 (base) 资产。用户首次开图时 <img> 命中 image cache, 跳过磁盘 IO + decode 阻塞。
        // 走 requestIdleCallback 不与其他 lazy panel 加载抢主线程; 5s timeout 兜底, 防止极端 idle starvation。
        var schedulePrewarm = window.requestIdleCallback || function(cb) { return setTimeout(cb, 1500); };
        schedulePrewarm(function() {
            if (window.MapPanelData && typeof MapPanelData.prewarmAssets === 'function') {
                MapPanelData.prewarmAssets('base');
            }
        }, { timeout: 5000 });
    });
})();
</script>
</body>
</html>
