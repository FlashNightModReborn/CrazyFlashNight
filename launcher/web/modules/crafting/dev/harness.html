    __resizeObserverStats.active===1&&__rafStats.active<=routeRafBaseline,
    JSON.stringify({resize:__resizeObserverStats,raf:__rafStats,baseline:routeRafBaseline}));
  Panels.close();await wait();
  ok('route cleanup releases every observer and animation frame',
    __resizeObserverStats.active===0&&__rafStats.active<=routeRafBaseline,
    JSON.stringify({resize:__resizeObserverStats,raf:__rafStats,baseline:routeRafBaseline}));
  var result={passed:checks.filter(function(x){return x.ok}).length,total:checks.length,checks:checks};window.__qaResult=result;window.__qaDone=true;document.getElementById('qa-output').textContent=JSON.stringify(result,null,2)
}catch(error){window.__qaError=error.stack||String(error);window.__qaDone=true;document.getElementById('qa-output').textContent=window.__qaError}})();
</script>
