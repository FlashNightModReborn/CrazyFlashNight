function inventorySnapshot(request){
  request=request||{};
  var containerId=String(request.containerId||''),capacity=containerId==='战备箱'?40:50;
  var requestedOffset=Math.max(0,Math.floor(Number(request.offset)||0));
  var requestedLimit=Math.max(1,Math.floor(Number(request.limit)||capacity));
  var offset=requestedOffset>=capacity?Math.floor((capacity-1)/requestedLimit)*requestedLimit:requestedOffset;
  var limit=Math.min(requestedLimit,Math.max(0,capacity-offset)),slots=[];
  for(var i=0;i<limit;i++){
    var physicalSlot=offset+i,item=inventoryFixtureItem(containerId,physicalSlot);
    var entry={physicalSlot:physicalSlot,occupied:!!item,slotLease:'craft.inv.'+(++inventoryLeaseSeq)};
    if(item){
      entry.item=JSON.parse(JSON.stringify(item));
      entry.confirmProjection={itemKind:item.itemKind,name:item.name,displayName:item.displayName,
        quantity:item.quantity,enhancementLevel:item.enhancementLevel,rarity:item.rarity,
        tier:'',modSignature:'',lastUpdate:0}
    }
    slots.push(entry)
  }
  var occupiedCount=slots.filter(function(slot){return slot.occupied}).length;
  var snapshot={containerId:containerId,capacity:capacity,accessibleCapacity:capacity,viewCapacity:capacity,
    filterKey:String(request.filterKey||'all'),pageSizeHint:Math.min(100,Math.max(1,requestedLimit)),locked:false,
    snapshotSeq:++inventorySnapshotSeq,containerEpoch:1,containerVersion:1,

}
