<script>
(function() {
    'use strict';
    var listeners = {};
    window.Bridge = {
        on: function(type, callback) { (listeners[type] || (listeners[type] = [])).push(callback); },
        off: function(type, callback) {
            var list = listeners[type] || [];
            var index = list.indexOf(callback);
            if (index >= 0) list.splice(index, 1);
        },
        send: function(message) { return window.KShopHarnessHost.handle(message); }
    };
    window.__emitBridge = function(type, data) {
        var list = (listeners[type] || []).slice();
        for (var i = 0; i < list.length; i++) list[i](data);
    };
})();

window.__KSHOP_RUNTIME_CONFIG__ = {
    sessionNonce: 'harness',
    requestTimeoutMs: 220,
    cartSaveDebounceMs: 45,
    dragTimeoutMs: 120
};
window.Notch = { reportRect: function() {} };
window.Toast = { messages: [], add: function(message) { this.messages.push(String(message)); } };
window.BootstrapAudio = {
    playSelect:function(){}, playConfirm:function(){}, playSuccess:function(){}, playError:function(){},
    playCancel:function(){}, playClick:function(){}, playModalOpen:function(){}
};
if (new URLSearchParams(location.search).get('visual') !== 'battlebox-real-icons') window.PanelTooltip = {
    visible:false,
    lastRichOptions:null,
    showAtMouse:function(){ this.visible=true; }, showAnchored:function(){ this.visible=true; }, showPinned:function(){ this.visible=true; }, followMouse:function(){}, hide:function(){ this.visible=false; }, hideHover:function(){ this.visible=false; },
    isVisible:function(){ return this.visible; }, updateContent:function(){}, inferLayoutType:function(){ return 'narrow'; },
    dynamicIconHtml:function(name){ return Icons.html(name,'tooltip-rich-icon'); },
    staticIconUrl:function(){ return null; },
    buildItemRichHtml:function(options){ this.lastRichOptions=options || {}; return '<div>'+(options && options.iconHtml || '')+'detail</div>'; },
    bindAsyncHover:function(node, options){
        var cache = options.cache || {};
        function resolveKey(e){
            if (typeof options.key === 'function') return String(options.key(e, node) || '');
            return String(options.key);
        }
        function onEnter(e){
            if (typeof options.isSuppressed === 'function' && options.isSuppressed(e)) return;
            var key = resolveKey(e);
            var item = options.item;
            var html = cache[key] && options.renderRich ? options.renderRich(item, cache[key]) : options.renderBasic(item);
            PanelTooltip.showAtMouse(html, e);
            if (cache[key] || typeof options.fetch !== 'function') return;
            options.fetch(item, function(response){
                if (!response || response.success !== true) return;
                cache[key] = response;
                if (PanelTooltip.isVisible()) PanelTooltip.updateContent(options.renderRich(item, response));
            });
        }
        function onMove(e){ PanelTooltip.followMouse(e); }
        function onLeave(){ PanelTooltip.hide(); }
        node.addEventListener('mouseenter', onEnter);
        node.addEventListener('mousemove', onMove);
        node.addEventListener('mouseleave', onLeave);
    }
};
if (new URLSearchParams(location.search).get('visual') !== 'battlebox-real-icons') window.Icons = {
    loaded:false,
    loadCalls:0,
    deferMs:0,
    load:function(callback){
        var self=this;
        this.loadCalls += 1;
        if (this.loaded) { if (callback) callback(); return; }
        var finish=function(){ self.loaded=true; if (callback) callback(); };
        if (this.deferMs > 0) setTimeout(finish,this.deferMs); else finish();
    },
    html:function(name, cls){
        if (!this.loaded) return '';
        return '<span class="'+(cls || 'kshop-icon')+'" data-icon="'+String(name)+'"></span>';
    }
};
if (window.Icons && typeof window.Icons.deferMs === 'number') window.Icons.deferMs = 35;

(function() {

                price:Number(item.price),displayname:String(item.displayname),majorType:String(item.majorType || ''),

                weaponType:String(item.weaponType || ''),setId:String(item.setId || ''),
                setName:String(item.setName || ''),setOrder:Number(item.setOrder || 0),
                level:Number(item.level || 0),icon:String(item.icon),maxQuantity:Number(item.maxQuantity)
            };
            if (item.balanceSummary && item.balanceSummary.state === 'confirmed') {
                clean.balanceSummary = clone(item.balanceSummary);
            }
            if (item.procurement) clean.procurement = clone(item.procurement);
            return clean;
        });
    }
    function strictKShopPurchased(value, catalog) {
        return (value || []).map(function(row,index) {
            var itemName=String(row[1]);
            var item=(catalog || []).find(function(entry){return entry.item===itemName;});
            return {purchasedIdx:index,item:itemName,displayname:String(item.displayname),
                icon:String(item.icon),quantity:Number(row[4])};
        });
    }
    function strictKShopCartSnapshot(value, catalog) {
        var cart=[],adjusted=false;
        (value || []).forEach(function(row) {
            var idx=Number(row&&row.idx),quantity=Number(row&&row.qty),item=null;
            for(var i=0;i<(catalog||[]).length;i++) {
                if(Number(catalog[i].idx)===idx){item=catalog[i];break;}
            }
            if(!Number.isInteger(idx)||!Number.isInteger(quantity)||quantity<=0||!item
                    ||!Number.isInteger(Number(item.maxQuantity))||Number(item.maxQuantity)<=0){
                adjusted=true;return;
            }
            var bounded=Math.min(quantity,Number(item.maxQuantity));
            if(bounded!==quantity)adjusted=true;
            cart.push({idx:idx,qty:bounded});
        });
        return {cart:cart,adjusted:adjusted};
    }
    function strictInventoryMod(value) {

        var enhancement = equipment ? Math.max(0, Math.floor(Number(value.enhancementLevel) || 0)) : 0;
        var maxEnhancement = equipment

        var mods = equipment && Array.isArray(value.modSlots)
            ? value.modSlots.slice(0, 3).map(strictInventoryMod) : [];
        var modUsed = equipment ? Math.max(mods.length, Math.floor(Number(value.modSlotUsed) || 0)) : 0;

        itemMatchesFilter: function(item, filterKey) {

            var use = String(item.use || '');
            if (filterKey === 'weapon') return type === '武器';
            if (filterKey === 'armor') return type === '防具';
            if (filterKey === 'consumable') return type === '消耗品';
            if (filterKey === 'material') return type === '材料' || (type === '收集品' && use === '材料');
            return type !== '武器' && type !== '防具' && type !== '消耗品'
                && type !== '材料' && !(type === '收集品' && use === '材料');
        },

        itemMatchesScope: function(item, scope) {
            if (scope !== 'equipment') return !!item;

                && (item.majorType === '武器' || item.majorType === '防具');
        },

        inventoryFacetTree: function(items, accessibleCapacity, scope) {
            var occupied = [];
            for (var i=0; i<accessibleCapacity; i++) {
                if (this.itemMatchesScope(items[i], scope)) occupied.push(items[i]);
            }
            return ItemFilter.build(occupied, function(item){ return ItemFilter.catalogPath(item); });
        },

        inventorySetTree: function(items, accessibleCapacity, scope) {
            var occupied = [];
            for (var i=0; i<accessibleCapacity; i++) {

            return ItemFilter.buildSetTree(occupied);

        itemMatchesFilterSpec: function(item, filterSpec) {

            var path = InventoryUI.filterPathFromSpec(filterSpec, 'all');

        },

        snapshotFor: function(request) {
            var containerId = String(request.containerId);
            var items = this.state.inventory[containerId];
            var offset = Number(request.offset);
            var limit = Number(request.limit);
            var filterKey = String(request.filterKey || 'all');
            var filterSpec = request.filterSpec ? clone(request.filterSpec) : null;
            var scope = String(request.scope || 'all');
            var accessibleCapacity = containerId === '战备箱' ? this.battleboxAccessibleCapacity : items.length;
            var physicalSlots = [];
            if (filterSpec && filterSpec.major !== 'all') {
                for (var structuredPhysical=0; structuredPhysical<accessibleCapacity; structuredPhysical++) {
                    if (this.itemMatchesScope(items[structuredPhysical],scope)
                            && this.itemMatchesFilterSpec(items[structuredPhysical],filterSpec)) physicalSlots.push(structuredPhysical);
                }
            } else if (filterKey === 'all') {
                for (var physical=0; physical<accessibleCapacity; physical++) {
                    if (scope !== 'equipment' || this.itemMatchesScope(items[physical],scope)) physicalSlots.push(physical);
                }
            } else {
                for (physical=0; physical<accessibleCapacity; physical++) {
                    if (this.itemMatchesScope(items[physical],scope)
                            && this.itemMatchesFilter(items[physical],filterKey)) physicalSlots.push(physical);
                }

            var facetTree = this.inventoryFacetTree(items, accessibleCapacity, scope);
            var setTree = this.inventorySetTree(items, accessibleCapacity, scope);
            var viewCapacity = physicalSlots.length;
            if (viewCapacity <= 0) offset = 0;
            else if (offset >= viewCapacity) offset = Math.floor((viewCapacity-1)/limit)*limit;
            var slots = [];
            for (var viewIndex=offset; viewIndex<Math.min(viewCapacity,offset+limit); viewIndex++) {
                var slot=physicalSlots[viewIndex];
                var item = items[slot] || null;
                var leaseKey = containerId + ':' + slot;
                var lease = this.leases[leaseKey];
                var version = this.inventoryVersions[containerId] || 1;
                if (!lease || lease.session !== this.inventorySession || lease.version !== version) {
                    this.leaseSeq += 1;
                    lease = {token:'invh.' + this.inventorySession + '.' + this.leaseSeq,
                        item:item,quantity:item ? item.quantity : 0,
                        session:this.inventorySession,version:version};
                    this.leases[leaseKey] = lease;
                }
                var token = lease.token;
                var entry = {physicalSlot:slot,occupied:!!item,slotLease:token};
                if (item) {
                    entry.item = strictInventoryItem(item);
                    entry.confirmProjection = strictInventoryConfirm(entry.item, item);
                }
                slots.push(entry);
            }
            this.inventorySnapshotSeq += 1;
            var snapshot = {containerId:containerId,capacity:items.length,accessibleCapacity:accessibleCapacity,
                viewCapacity:viewCapacity,filterKey:filterKey,
                filterFacets:facetTree.children.map(strictInventoryFacet),filterItemCount:facetTree.count,
                setFacets:setTree.children.map(strictInventoryFacet),setFilterItemCount:setTree.count,
                pageSizeHint:containerId === '战备箱' ? 40 : 50,locked:accessibleCapacity <= 0,
                snapshotSeq:this.inventorySnapshotSeq,containerEpoch:this.inventoryEpochs[containerId] || 1,
                containerVersion:this.inventoryVersions[containerId] || 1,
                offset:offset,limit:slots.length,slots:slots};
            if (filterSpec) snapshot.filterSpec = filterSpec;
            if (scope === 'equipment') snapshot.scope = scope;
            return snapshot;
        },

        inventorySnapshots: function(requests, rotate) {
            if (rotate) { this.inventorySession += 1; this.leases = {}; }
            return (requests || [
                {containerId:'背包',offset:0,limit:50},{containerId:'战备箱',offset:0,limit:40}
            ]).map(this.snapshotFor.bind(this));
        },

        respond: function(request, response, delay) {

            if (request.domain) {
                response.domain = request.domain;
            } else if (Object.prototype.hasOwnProperty.call(response, 'domain')) delete response.domain;
            setTimeout(function() { window.__emitBridge('panel_resp', response); }, delay || 0);
        },

        handle: function(message) {
            if (message.cmd === 'close' && this.failNextCloseTransport) {
                this.failNextCloseTransport = false;
                this.failedCloseTransportCount += 1;
                return false;
            }
            this.sent.push(clone(message));
            if (message.cmd === 'close') {
                if (this.activePanel && (message.panel !== this.activePanel
                        || message.panelInstanceId !== this.activePanelInstanceId)) {
                    this.rejectedCloseCount += 1;
                    return;
                }
                this.closeCount += 1;
                this.activePanel = null;
                this.activePanelInstanceId = '';
                return;
            }
            var delay = Number(this.delays[message.cmd]) || 0;
            if (message.domain === 'equipment_tuning') {
                var tuningPayload = message.payload || {};
                var tuningCommon = {
                    success:true,v:1,panel:'workbench',panelInstanceId:message.panelInstanceId,
                    viewSessionId:tuningPayload.viewSessionId,writeEpoch:1

                if (message.cmd === 'snapshot') {

                    var tuningLease = this.leases[tuningSource.containerId + ':' + tuningSource.slot];
                    var tuningItem = tuningLease && tuningLease.item;
                    if (!tuningItem || tuningLease.token !== tuningSource.expectedLease) {
                        tuningCommon.success = false;
                        tuningCommon.error = 'stale_state';
                    } else {
                        var tuningLevel = Math.max(1,
                            Number(tuningItem.enhancementLevel || 1));
                        var tuningMax = Math.max(tuningLevel, Math.min(13,
                            Number(tuningItem.maxEnhancementLevel || 13)));
                        tuningCommon.snapshot = {
                            gender:'女',source:clone(tuningSource),
                            equipment:{name:tuningItem.name,displayName:tuningItem.displayName,icon:tuningItem.icon,
                                type:tuningItem.majorType === '防具' ? '防具' : '武器',use:String(tuningItem.use || '长枪'),
                                level:tuningLevel,tier:'',mods:[],lastUpdate:1,
                                maxLevel:tuningMax,hardMaxLevel:13},
                            enhance:{currentLevel:tuningLevel,maxLevel:tuningMax,
                                availableMaxLevel:tuningMax,hardMaxLevel:13},
                            tierCandidates:[],modCandidates:[],materials:[],
                            materialRevision:1,inventoryRevision:1
                        };
                    }
                } else if (message.cmd === 'detach') {
                    tuningCommon.detached = true;
                } else {
                    tuningCommon.success = false;
                    tuningCommon.error = 'unsupported_harness_tuning_cmd';
                }
                this.respond(message, tuningCommon, delay);
                return;
            }
            if (message.domain === 'inventory') {
                var payload = message.payload || {};
                if (message.cmd === 'snapshot') {
                    this.respond(message, {success:true,v:1,
                        sessionNonce:'inv.harness.' + this.inventorySession,
                        snapshots:this.inventorySnapshots(payload.requests,false)}, delay);
                    return;
                }
                if (message.cmd === 'tooltip') {
                    var tooltipSource = payload.source || {};
                    var tooltipLease = this.leases[tooltipSource.containerId + ':' + tooltipSource.slot];
                    if (!tooltipLease || tooltipLease.token !== tooltipSource.expectedLease || !tooltipLease.item) {
                        this.respond(message, {success:false,error:'stale_state'}, delay);
                    } else {
                        this.lastTooltipDescHTML = '<FONT COLOR="#FF00FF">库存实例注释</FONT>'.split('"').join("'");
                        this.respond(message, {
                            success:true,v:1,itemName:tooltipLease.item.name,
                            displayname:tooltipLease.item.displayName,iconName:tooltipLease.item.icon,
                            itemType:tooltipLease.item.majorType || tooltipLease.item.itemKind,
                            introHTML:'<b>' + tooltipLease.item.displayName + '</b>',
                            descHTML:this.lastTooltipDescHTML
                        }, delay);
                    }
                    return;
                }
                if (message.cmd === 'sortAndMerge') {
                    var container = payload.container || {};
                    var methodName = String(payload.methodName || '');
                    var allowed = {byType:1,byUse:1,byPrice:1,byLevel:1,byID:1,byName:1,byValue:1,byTime:1};
                    var sortContainerId = String(container.containerId || '');
                    if (!this.state.inventory[sortContainerId]) {
                        this.respond(message, {success:false,error:'sort_forbidden'}, delay);
                        return;
                    }
                    if (!allowed[methodName]) {
                        this.respond(message, {success:false,error:'unsupported_sort_method'}, delay);
                        return;
                    }
                    var inventory = this.state.inventory[sortContainerId];
                    var sortCapacity = sortContainerId === '战备箱' ? this.battleboxAccessibleCapacity : inventory.length;
                    if (sortCapacity <= 0) {
                        this.respond(message, {success:false,error:'sort_forbidden'}, delay);
                        return;
                    }
                    var compact = inventory.slice(0,sortCapacity).filter(function(item){ return !!item; });
                    var stackIndex = {};
                    var merged = [];
                    compact.forEach(function(item) {
                        if (item.itemKind === 'stack') {
                            if (stackIndex[item.name] != null) merged[stackIndex[item.name]].quantity += Number(item.quantity || 0);
                            else { stackIndex[item.name] = merged.length; merged.push(item); }
                        } else merged.push(item);
                    });
                    if (methodName === 'byName') merged.sort(function(a,b){ return String(a.displayName).localeCompare(String(b.displayName),'zh-CN'); });
                    else if (methodName === 'byValue') merged.sort(function(a,b){ return Number(b.quantity || 1)-Number(a.quantity || 1); });
                    for (var clearIndex=0; clearIndex<sortCapacity; clearIndex++) inventory[clearIndex] = null;
                    for (var mi=0; mi<merged.length; mi++) inventory[mi] = merged[mi];
                    Object.keys(this.leases).forEach(function(key){ if (key.indexOf(sortContainerId + ':') === 0) delete Host.leases[key]; });
                    this.inventoryEpochs[sortContainerId] += 1;
                    this.inventoryVersions[sortContainerId] += 1;
                    this.respond(message, {success:true,v:1,operation:'sortAndMerge',methodName:methodName,
                        sortedCapacity:sortCapacity,snapshots:this.inventorySnapshots([{
                            containerId:sortContainerId,offset:Number(container.offset),limit:Number(container.limit),
                            filterKey:String(container.filterKey || 'all')
                        }],false)}, delay);
                    return;
                }
                if (message.cmd === 'autoTransfer') {
                    var autoSource = payload.source || {};
                    var autoSourceKey = autoSource.containerId + ':' + autoSource.slot;
                    var autoSourceLease = this.leases[autoSourceKey];
                    var autoTargetContainerId = String(payload.targetContainerId || '');
                    var autoPairAllowed = (autoSource.containerId === '背包'
                            && (autoTargetContainerId === '仓库' || autoTargetContainerId === '战备箱'))
                        || (autoTargetContainerId === '背包'
                            && (autoSource.containerId === '仓库' || autoSource.containerId === '战备箱'));

                    var autoSourceItems = this.state.inventory[autoSource.containerId];
                    var autoTargetItems = this.state.inventory[autoTargetContainerId];
                    var autoCapacity = autoTargetContainerId === '战备箱'
                        ? this.battleboxAccessibleCapacity : autoTargetItems.length;
                    if (autoCapacity <= 0) {
                        this.respond(message, {success:false,error:'slot_locked'}, delay);
                        return;
                    }
                    var autoTargetSlot = -1;
                    var autoFirstEmpty = -1;
                    var autoSourceItem = autoSourceItems[autoSource.slot];
                    for (var autoSlot=0; autoSlot<autoCapacity; autoSlot++) {
                        var autoCandidate = autoTargetItems[autoSlot];
                        if (!autoCandidate) {
                            if (autoFirstEmpty < 0) autoFirstEmpty = autoSlot;
                        } else if (autoSourceItem.itemKind === 'stack' && autoCandidate.itemKind === 'stack'
                                && autoSourceItem.name === autoCandidate.name) {
                            autoTargetSlot = autoSlot;
                            break;
                        }
                    }
                    var autoOperation = 'merge';
                    if (autoTargetSlot < 0) {
                        if (autoFirstEmpty < 0) {
                            this.respond(message, {success:false,error:'target_full'}, delay);
                            return;
                        }
                        autoTargetSlot = autoFirstEmpty;
                        autoOperation = 'move';
                    }
                    if (autoOperation === 'merge') autoTargetItems[autoTargetSlot].quantity += autoSourceItem.quantity;
                    else autoTargetItems[autoTargetSlot] = autoSourceItem;
                    autoSourceItems[autoSource.slot] = null;
                    delete this.leases[autoSourceKey];
                    delete this.leases[autoTargetContainerId + ':' + autoTargetSlot];
                    this.inventoryVersions[autoSource.containerId] += 1;
                    if (autoTargetContainerId !== autoSource.containerId) {
                        this.inventoryVersions[autoTargetContainerId] += 1;

                    this.respond(message, {success:true,v:1,operation:autoOperation,policy:'mergeThenEmpty',
                        destination:{containerId:autoTargetContainerId,slot:autoTargetSlot},
                        snapshots:this.inventorySnapshots(payload.windows,false)}, delay);
                    return;
                }
                var source = payload.source || {};
                var target = payload.target || {};
                var sourceKey = source.containerId + ':' + source.slot;
                var targetKey = target.containerId + ':' + target.slot;
                var sourceLease = this.leases[sourceKey];
                var targetLease = this.leases[targetKey];
                if (!sourceLease || sourceLease.token !== source.expectedLease
                        || (message.cmd !== 'discard' && (!targetLease || targetLease.token !== target.expectedLease))) {
                    this.respond(message, {success:false,error:'stale_state'}, delay);
                    return;
                }
                var sourceItems = this.state.inventory[source.containerId];
                if (message.cmd === 'discard') {
                    sourceItems[source.slot] = null;
                    this.inventoryVersions[source.containerId] += 1;

                }
                this.inventoryVersions[source.containerId] += 1;

                    this.inventoryVersions[target.containerId] += 1;
                }
                var sourcePageSize = source.containerId === '战备箱' ? 40 : 50;
                var targetPageSize = target.containerId === '战备箱' ? 40 : 50;
                var sourceWindow = {containerId:source.containerId,offset:Math.floor(Number(source.slot)/sourcePageSize)*sourcePageSize,limit:sourcePageSize};
                var targetWindow = {containerId:target.containerId,offset:Math.floor(Number(target.slot)/targetPageSize)*targetPageSize,limit:targetPageSize};
                var affectedWindows = [sourceWindow];
                if (sourceWindow.containerId !== targetWindow.containerId || sourceWindow.offset !== targetWindow.offset) {
                    affectedWindows.push(targetWindow);
                }
                this.respond(message, {success:true,operation:message.cmd,
                    snapshots:this.inventorySnapshots(affectedWindows,false)}, delay);
                return;
            }
            if (message.cmd === 'bulkQuery') {
                this.rotatePurchasedToken();
                var cartSnapshot=strictKShopCartSnapshot(this.state.cart,this.state.catalog);
                this.respond(message, {
                    success:true,
                    catalog:strictKShopCatalog(this.state.catalog), cart:cartSnapshot.cart,
                    cartAdjusted:cartSnapshot.adjusted,purchased:strictKShopPurchased(this.state.purchased,this.state.catalog),
                    purchasedToken:this.state.purchasedToken,
                    kpoints:this.state.kpoints, playerLevel:this.state.playerLevel, reverseLevel:this.state.reverseLevel
                }, delay);
                return;
            }
            if (message.cmd === 'tooltip') {
                var tooltipItem=this.state.catalog[Number(message.idx)];
                this.respond(message, {success:true,introHTML:'<b>测试</b>',descHTML:'说明',
                    itemName:tooltipItem.item,displayname:tooltipItem.displayname,iconName:tooltipItem.icon}, delay);
                return;
            }
            if (message.cmd === 'saveCart') {
                var savedCartSnapshot=strictKShopCartSnapshot(message.cart || [],this.state.catalog);
                this.state.cart = clone(savedCartSnapshot.cart);
                if (this.nextSaveAmbiguous) {
                    this.nextSaveAmbiguous = false;
                    this.respond(message, {success:false,error:'reconcile_required'}, delay);
                } else {
                    this.respond(message, {success:true,v:1,cart:clone(this.state.cart),
                        adjusted:savedCartSnapshot.adjusted}, delay);
                }
                return;
            }
            if (message.cmd === 'checkoutPreview') {
                var cart = clone(message.cart || []);
                var total = 0;
                var lines = [];
                var requiredSlots = 0;
                for (var i = 0; i < cart.length; i++) {
                    var item = this.state.catalog[cart[i].idx];
                    total += Number(item.price) * Number(cart[i].qty);
                    var equipment = item.majorType === '武器' || item.majorType === '防具';
                    var maxQuantity = Number(item.maxQuantity);
                    var maxAffordable = Math.max(0,Math.min(maxQuantity,Math.floor(this.state.kpoints / Number(item.price))));
                    var vacancyCount = 0;
                    for (var vacancyIndex=0;vacancyIndex<this.state.inventory.背包.length;vacancyIndex++) {
                        if (!this.state.inventory.背包[vacancyIndex]) vacancyCount++;
                    }
                    var maxByCapacity = equipment ? vacancyCount : maxQuantity;
                    if (equipment) requiredSlots += Number(cart[i].qty);
                    lines.push({catalogIndex:item.idx,itemName:item.item,displayName:item.displayname,icon:item.icon,
                        quantity:Number(cart[i].qty),unitPrice:Number(item.price),total:Number(item.price)*Number(cart[i].qty),
                        maxQuantity:maxQuantity,maxAffordable:maxAffordable,maxByCapacity:maxByCapacity,
                        maxPurchasable:Math.min(maxQuantity,maxAffordable,maxByCapacity),itemKind:equipment?'equipment':'stack'});
                }
                for(var boundIndex=0;boundIndex<lines.length;boundIndex++){
                    var boundLine=lines[boundIndex];
                    var remaining=Math.max(0,this.state.kpoints-(total-Number(boundLine.total)));
                    boundLine.maxAffordable=Number(boundLine.unitPrice)<=0
                        ? Number(boundLine.maxQuantity)
                        : Math.max(0,Math.min(Number(boundLine.maxQuantity),
                            Math.floor(remaining/Number(boundLine.unitPrice))));
                    boundLine.maxPurchasable=Math.min(Number(boundLine.maxQuantity),
                        Number(boundLine.maxAffordable),Number(boundLine.maxByCapacity));
                }
                var vacancies = 0;
                for (var countIndex=0;countIndex<this.state.inventory.背包.length;countIndex++) {
                    if (!this.state.inventory.背包[countIndex]) vacancies++;
                }
                var blocking = this.state.kpoints < total ? 'insufficient_kpoints' : (requiredSlots > vacancies ? 'inventory_full' : '');
                this.checkoutSeq += 1;
                var token = 'kcheckout.harness.' + this.checkoutSeq;
                this.checkoutPlan = {token:token,cart:cart,total:total,lines:lines,balance:this.state.kpoints};
                this.respond(message,{success:true,v:1,checkoutToken:token,purchaseLines:clone(lines),total:total,
                    balance:this.state.kpoints,projectedBalance:this.state.kpoints-total,canCommit:!blocking,blockingError:blocking},delay);
                return;
            }
            if (message.cmd === 'checkoutCommit') {
                var plan = this.checkoutPlan;
                if (!plan || String(message.expectedCheckoutToken) !== plan.token) {
                    this.respond(message,{success:false,error:'stale_state'},delay); return;
                }
                this.checkoutPlan = null;
                this.state.kpoints -= plan.total;
                for (var lineIndex=0;lineIndex<plan.lines.length;lineIndex++) {
                    var delivery=plan.lines[lineIndex];
                    var deliveredCatalogItem=this.state.catalog[delivery.catalogIndex];
                    if (deliveredCatalogItem && deliveredCatalogItem.dynamicCapacity) {
                        deliveredCatalogItem.maxQuantity=Math.max(0,Number(deliveredCatalogItem.maxQuantity)-Number(delivery.quantity));
                    }
                    var mergeSlot=this.state.inventory.背包.findIndex(function(entry){ return entry&&entry.name===delivery.itemName&&entry.itemKind==='stack'; });
                    if (delivery.itemKind==='stack'&&mergeSlot>=0) this.state.inventory.背包[mergeSlot].quantity+=delivery.quantity;
                    else {
                        var deliverySlot=this.state.inventory.背包.findIndex(function(entry){ return !entry; });
                        this.state.inventory.背包[deliverySlot]={name:delivery.itemName,displayName:delivery.displayName,icon:delivery.icon,
                            majorType:delivery.itemKind==='equipment'?'武器':'消耗品',itemKind:delivery.itemKind,quantity:delivery.quantity};
                    }
                }
                this.inventoryVersions.背包 += 1;
                this.state.cart = [];
                if (this.nextCheckoutMalformed) {
                    this.nextCheckoutMalformed = false;
                    this.respond(message, {success:true}, delay);
                } else if (this.nextCheckoutAmbiguous) {
                    this.nextCheckoutAmbiguous = false;
                    this.respond(message, {success:false,error:'reconcile_required'}, delay);
                } else {
                    this.respond(message, {success:true,v:1,newBalance:this.state.kpoints,delivered:clone(plan.lines),cart:[],
                        catalog:strictKShopCatalog(this.state.catalog),
                        purchased:strictKShopPurchased(this.state.purchased,this.state.catalog),
                        purchasedToken:this.state.purchasedToken}, delay);
                }
                return;
            }
            if (message.cmd === 'claim') {
                var index = Number(message.purchasedIdx);
                if (String(message.expectedPurchasedToken) !== this.state.purchasedToken) {
                    this.respond(message, {success:false,error:'stale_state',purchasedToken:this.state.purchasedToken}, delay);
                } else if (index < 0 || index >= this.state.purchased.length) {
                    this.respond(message, {success:false,error:'item_not_found',purchasedToken:this.state.purchasedToken}, delay);
                } else {
                    var receipt = this.state.purchased[index];
                    var vacancy = this.state.inventory.背包.findIndex(function(item){ return !item; });
                    if (vacancy < 0) { this.respond(message,{success:false,error:'inventory_full',purchasedToken:this.state.purchasedToken},delay); return; }
                    this.state.inventory.背包[vacancy] = {name:String(receipt[1]),displayName:String(receipt[1]),icon:String(receipt[1]),itemKind:'stack',quantity:Number(receipt[receipt.length-1])};
                    this.inventoryVersions.背包 += 1;
                    for (var catalogIndex=0;catalogIndex<this.state.catalog.length;catalogIndex++) {
                        var claimedCatalogItem=this.state.catalog[catalogIndex];
                        if (claimedCatalogItem.dynamicCapacity && claimedCatalogItem.item===String(receipt[1])) {
                            claimedCatalogItem.maxQuantity=Math.max(0,Number(claimedCatalogItem.maxQuantity)-Number(receipt[receipt.length-1]));
                        }
                    }
                    this.state.purchased.splice(index, 1);
                    this.respond(message, {success:true,catalog:strictKShopCatalog(this.state.catalog),
                        purchased:strictKShopPurchased(this.state.purchased,this.state.catalog),
                        purchasedToken:this.rotatePurchasedToken()}, delay);
                }
            }
        }
    };

                    detachedOwnerNotRestored:detachedOwnerNotRestored,
                    scopeCleanupComplete:scopeCleanupComplete,
                    placement:PanelTooltip.debugState().lastPlacement
                };
            }
            if (mode === 'battlebox-pages') click('.inventory-page-jump');
            if (mode === 'battlebox-help') click('.inventory-workbench-panel .workbench-help-btn');
            window.__visualReady = true;
            document.getElementById('qa-status').style.display = 'none';
            return;
        }
        await Host.open(mode === 'cart-overflow' ? function(visualState) {
            visualState.kpoints = 9999999;
            for (var visualCartIndex=5;visualCartIndex<13;visualCartIndex++) {
                visualState.catalog.push({
                    idx:visualCartIndex,id:'visual-cart-' + visualCartIndex,
                    item:'滚动条探针' + visualCartIndex,type:'压力测试补给',
                    price:10 + visualCartIndex,displayname:'滚动条探针 ' + visualCartIndex,
                    majorType:'消耗品',subType:'药剂',level:1,
                    icon:'图标-测试药剂',maxQuantity:999999
                });
            }
        } : null);
        if (mode === 'cart-overflow') {
            var visualCartButtons = document.querySelectorAll('.kshop-add-btn:not(:disabled)');
            for (var visualCartButtonIndex=0;visualCartButtonIndex<visualCartButtons.length;visualCartButtonIndex++) {
                visualCartButtons[visualCartButtonIndex].click();
            }
        } else {
            addEquipment();
            addStackable(3);
        }
        await wait(120);
        var firstCategory = document.querySelector('.kshop-category-navigator .item-filter-option');
        if (firstCategory) firstCategory.click();
        if (mode === 'compact') click('.item-grid-mode-option[data-layout-mode="compact"]');
        if (mode === 'knife') {
            click('.kshop-categories [data-filter-path="category"]');
            click('.kshop-categories [data-filter-path="category/weapon"]');
            click('.kshop-categories [data-filter-path="category/weapon/刀"]');
        }
        if (mode === 'curated') click('.kshop-categories [data-filter-path="curated"]');
        if (mode === 'help') click('.kshop-workbench .workbench-help-btn');
        if (mode === 'modal' || mode === 'settlement') {
            click('#kshop-checkout');
            await waitFor(function(){ var button=document.querySelector('[data-kshop-settlement-commit]'); return button && !button.disabled; },500);
        }
        if (mode === 'inventory' || mode === 'inventory-pages' || mode === 'inventory-compact') {
            click('.workbench-mode-btn[data-mode="inventory"]');
            await wait(160);
            if (mode === 'inventory-compact') click('.item-grid-mode-option[data-layout-mode="compact"]');
            if (mode === 'inventory-pages') click('.inventory-page-jump');
        }
        if (mode === 'cart-overflow') {
            var visualCartList = document.querySelector('.kshop-cart-list');
            var visualScrollbar = getComputedStyle(visualCartList,'::-webkit-scrollbar');
            var visualScrollbarTrack = getComputedStyle(visualCartList,'::-webkit-scrollbar-track');
            var visualScrollbarThumb = getComputedStyle(visualCartList,'::-webkit-scrollbar-thumb');
            var visualScrollbarButton = getComputedStyle(visualCartList,'::-webkit-scrollbar-button');
            visualCartList.scrollTop = Math.min(60,visualCartList.scrollHeight - visualCartList.clientHeight);
            window.__visualScrollbarState = {
                overflow:visualCartList.scrollHeight > visualCartList.clientHeight,
                scrollTop:visualCartList.scrollTop,
                width:visualScrollbar.width,
                track:visualScrollbarTrack.backgroundColor,
                thumb:visualScrollbarThumb.backgroundColor,
                thumbBorder:visualScrollbarThumb.borderTopWidth,
                buttonDisplay:visualScrollbarButton.display,
                buttonWidth:visualScrollbarButton.width
            };
        }
        window.__visualReady = true;
        document.getElementById('qa-status').style.display = 'none';
    }

    var visualMode = new URLSearchParams(location.search).get('visual');
    var execution = visualMode ? runVisualScenario(visualMode) : run();
    execution.catch(function(error) {
        window.__qaResult = {qa:{total:1,passed:0,failed:1,results:[{id:'fatal',title:'harness fatal',pass:false,detail:error && error.stack ? error.stack : String(error)}]}};
        document.getElementById('qa-status').textContent = 'fatal';
    });
})();
</script>
</body>
</html>
