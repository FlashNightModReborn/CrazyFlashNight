name: Runtime bundle integrity

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
    branches:
      - main

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: runtime-bundle-integrity-v1-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify-staged-bundle:
    name: verify-staged-bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/runtime-bundle-integrity.yml
            config/build/
            tools/classify-runtime-release-state.ps1
            tools/resolve-runtime-trusted-base.ps1
            tools/runtime-build-attestation-v2-common.ps1
            tools/runtime-build-common.ps1
            tools/runtime-build-queue-common.ps1
            tools/runtime-build-v2-common.ps1
            tools/verify-runtime-bundle.ps1
            tools/verify-runtime-bundle-v2.ps1
            tools/verify-runtime-consensus.ps1
            tools/verify-runtime-github-attestation.ps1
      - name: Classify runtime release state
        shell: powershell
        env:
          CF7_EVENT_NAME: ${{ github.event_name }}
          CF7_EVENT_BEFORE: ${{ github.event.before }}
          CF7_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CF7_PR_BASE_REF: ${{ github.base_ref }}
          CF7_MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          CF7_MERGE_BASE_REF: ${{ github.event.merge_group.base_ref }}
          CF7_CURRENT_REF: ${{ github.ref }}
          CF7_HEAD_SHA: ${{ github.sha }}
          CF7_REPOSITORY: ${{ github.repository }}
          CF7_TRUST_WORKFLOW_ID: '314853607'
          CF7_TRUST_WORKFLOW_PATH: '.github/workflows/runtime-bundle-integrity.yml'
          CF7_TRUST_CHECK_NAME: 'verify-staged-bundle'
          CF7_TRUST_CHECK_APP_ID: '15368'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          function Test-ProtectedRef([string]$Ref) {
            $name = ([string]$Ref) -replace '^refs/heads/', ''
            return $name -ceq 'main'
          }

          if ($env:CF7_EVENT_NAME -eq 'pull_request') {
            $baseRevision = $env:CF7_PR_BASE_SHA
            $policyRef = $env:CF7_PR_BASE_REF
          } elseif ($env:CF7_EVENT_NAME -eq 'merge_group') {
            $baseRevision = $env:CF7_MERGE_BASE_SHA
            $policyRef = $env:CF7_MERGE_BASE_REF
          } else {
            $baseRevision = $env:CF7_EVENT_BEFORE
            $policyRef = $env:CF7_CURRENT_REF
          }
          if (-not (Test-ProtectedRef $policyRef)) {
            throw "Runtime integrity required context may run only for a protected target ref: $policyRef"
          }
          $eventBaseWasAbsent = [string]::IsNullOrWhiteSpace($baseRevision) -or $baseRevision -match '^0+$'
          $resolverStartRevision = if ($eventBaseWasAbsent) { "$($env:CF7_HEAD_SHA)^" } else { $baseRevision }

          $resolverArguments = @(
            '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', '.\tools\resolve-runtime-trusted-base.ps1',
            '-ProjectRoot', $PWD.Path,
            '-Repository', $env:CF7_REPOSITORY,
            '-StartRevision', $resolverStartRevision,
            '-HeadRevision', $env:CF7_HEAD_SHA,
            '-WorkflowId', $env:CF7_TRUST_WORKFLOW_ID,
            '-WorkflowPath', $env:CF7_TRUST_WORKFLOW_PATH,
            '-CheckName', $env:CF7_TRUST_CHECK_NAME,
            '-CheckAppId', $env:CF7_TRUST_CHECK_APP_ID
          )
          $resolverOutput = @(& powershell.exe @resolverArguments 2>&1 | ForEach-Object { [string]$_ })
          $resolverExitCode = $LASTEXITCODE
          foreach ($line in $resolverOutput) { Write-Host $line }
          $anchorLines = if ($resolverExitCode -eq 0) {
            @($resolverOutput | Where-Object { $_ -match '^CF7_TRUSTED_BASE=[0-9a-f]{40,64}$' })
          } else { @() }
          $disableFastPath = $eventBaseWasAbsent -or $resolverExitCode -ne 0 -or $anchorLines.Count -ne 1
          $trustedBaseRevision = if ($disableFastPath) {
            Write-Warning 'No externally trusted green anchor is available; refusing a reusable success until the resolver/API recovers and the job is rerun.'
            $null
          } else {
            ([string]$anchorLines[0]).Substring('CF7_TRUSTED_BASE='.Length)
          }

          $classifierArguments = @(
            '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', '.\tools\classify-runtime-release-state.ps1',
            '-ProjectRoot', $PWD.Path, '-Mode', 'Protected',
            '-HeadRevision', $env:CF7_HEAD_SHA
          )
          if (-not [string]::IsNullOrWhiteSpace($baseRevision)) {
            $classifierArguments += @('-BaseRevision', $baseRevision)
          }
          if ($disableFastPath) { $classifierArguments += '-DisableFastPath' }
          else { $classifierArguments += @('-TrustedBaseRevision', $trustedBaseRevision) }
          & powershell.exe @classifierArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
