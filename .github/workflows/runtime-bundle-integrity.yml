name: Runtime native audit

on:
  pull_request:
    branches:
      - main
    paths: &native_runtime_paths
      - '**/*.a'
      - '**/*.c'
      - '**/*.cc'
      - '**/*.cpp'
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.cxx'
      - '**/*.def'
      - '**/*.dll'
      - '**/*.dylib'
      - '**/*.exe'
      - '**/*.exp'
      - '**/*.filters'
      - '**/*.fsproj'
      - '**/*.h'
      - '**/*.hh'
      - '**/*.hpp'
      - '**/*.hxx'
      - '**/*.inl'
      - '**/*.lib'
      - '**/*.manifest'
      - '**/*.node'
      - '**/*.o'
      - '**/*.obj'
      - '**/*.pdb'
      - '**/*.props'
      - '**/*.rc'
      - '**/*.res'
      - '**/*.resx'
      - '**/*.rs'
      - '**/*.sln'
      - '**/*.slnx'
      - '**/*.so'
      - '**/*.targets'
      - '**/*.vcxproj'
      - '**/*.wasm'
      - '**/*.xaml'
      - '**/Cargo.lock'
      - '**/Cargo.toml'
      - '**/CMakeLists.txt'
      - '**/Directory.Build.props'
      - '**/Directory.Build.targets'
      - '**/Directory.Packages.props'
      - '**/global.json'
      - '**/Makefile'
      - '**/meson.build'
      - '**/NuGet.Config'
      - '**/packages.lock.json'
      - '**/rust-toolchain.toml'
      - '**/vcpkg-configuration.json'
      - '**/vcpkg.json'
      - .gitattributes
      - .github/actions/**
      - .github/workflows/**
      - .github/workflows/runtime-bundle-integrity.yml
      - .github/workflows/runtime-cloud-builder.yml
      - config/build/**
      - config/build/main-branch-admission.v2.json
      - config/build/native-change-gate.v1.json
      - config/build/runtime-inputs.v2.json
      - config/build/runtime-toolchain.lock.json
      - CRAZYFLASHER7MercenaryEmpire.exe
      - global.json
      - launcher/app.ico
      - launcher/app.manifest
      - launcher/build**
      - launcher/build.ps1
      - launcher/build-runtime-candidate.ps1
      - launcher/CRAZYFLASHER7MercenaryEmpire.csproj
      - launcher/Directory.Packages.props
      - launcher/native/**
      - launcher/native/assert-pinned-tools.bat
      - launcher/native/bootstrap/build.bat
      - launcher/native/build.bat
      - launcher/native/sol_parser/**
      - launcher/native/sol_parser/.cargo/config.toml
      - launcher/native/sol_parser/build.bat
      - launcher/native/sol_parser/Cargo.lock
      - launcher/native/sol_parser/Cargo.toml
      - launcher/native/sol_parser/rust-toolchain.toml
      - launcher/packages.lock.json
      - launcher/src/**
      - runtime/**
      - tools/audit-main-branch-admission.ps1
      - tools/audit-native-cursor-assets.js
      - tools/bootstrap-runtime-**
      - tools/check-runtime-**
      - tools/check-runtime-build-env.ps1
      - tools/classify-runtime-**
      - tools/classify-runtime-release-state.ps1
      - tools/get-runtime-**
      - tools/invoke-runtime-**
      - tools/materialize-runtime-**
      - tools/new-runtime-**
      - tools/prepare-launcher-release-**
      - tools/prepare-launcher-release-assets.ps1
      - tools/promote-runtime-**
      - tools/register-runtime-**
      - tools/resolve-runtime-**
      - tools/resolve-runtime-trusted-base.ps1
      - tools/runtime-**
      - tools/runtime-build-v2-common.ps1
      - tools/test-invoke-runtime-**
      - tools/test-main-branch-**
      - tools/test-main-branch-admission.ps1
      - tools/test-resolve-runtime-**
      - tools/test-resolve-runtime-trusted-base.ps1
      - tools/test-runtime-**
      - tools/validate-launcher-release-**
      - tools/validate-launcher-release-policy.ps1
      - tools/verify-runtime-**
  push:
    branches:
      - main
    paths: *native_runtime_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-native-audit-v2-${{ github.sha }}
  cancel-in-progress: false

jobs:
  audit-native-runtime:
    name: audit-native-runtime
    if: >-
      github.run_attempt == 1 &&
      (github.event_name != 'workflow_dispatch' ||
      github.actor_id == '91271520' || github.actor_id == '138298913')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/runtime-bundle-integrity.yml
            config/build/
            tools/classify-runtime-release-state.ps1
            tools/runtime-build-attestation-v2-common.ps1
            tools/runtime-build-common.ps1
            tools/runtime-build-queue-common.ps1
            tools/runtime-build-v2-common.ps1
            tools/verify-runtime-bundle.ps1
            tools/verify-runtime-bundle-v2.ps1
            tools/verify-runtime-consensus.ps1
            tools/verify-runtime-github-attestation.ps1
      - name: Audit native/runtime release state
        shell: powershell
        env:
          CF7_EVENT_NAME: ${{ github.event_name }}
          CF7_EVENT_BEFORE: ${{ github.event.before }}
          CF7_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CF7_HEAD_SHA: ${{ github.sha }}
        run: |
          $baseRevision = if ($env:CF7_EVENT_NAME -eq 'pull_request') {
            $env:CF7_PR_BASE_SHA
          } elseif ($env:CF7_EVENT_NAME -eq 'push') {
            $env:CF7_EVENT_BEFORE
          } else {
            $null
          }

          $classifierArguments = @(
            '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', '.\tools\classify-runtime-release-state.ps1',
            '-ProjectRoot', $PWD.Path, '-Mode', 'Audit',
            '-HeadRevision', $env:CF7_HEAD_SHA
          )
          if (-not [string]::IsNullOrWhiteSpace($baseRevision) -and $baseRevision -notmatch '^0+$') {
            $classifierArguments += @('-BaseRevision', $baseRevision)
          }
          if ($env:CF7_EVENT_NAME -eq 'workflow_dispatch') {
            $classifierArguments += '-ForceDeploymentVerification'
          }
          & powershell.exe @classifierArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
