name: 美术校对回执

on:
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 校对单号
        required: true
        type: string
      revision:
        description: 指定轮次，可留空使用最新版本
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: art-review-summary-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  summary:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.body, '<!-- cf7-art-review-site -->')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 取已核验的汇总程序
        uses: actions/checkout@v4
        with:
          repository: FlashNightModReborn/cf7-evidence
          ref: c95bdac91a6e47d7e83e61513f2b837a61d9f7ba
          sparse-checkout-cone-mode: false
          sparse-checkout: /review/tools/round_summary.py
          persist-credentials: false
      - name: 更新本轮唯一的回执评论
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          REVISION: ${{ inputs.revision }}
        run: |
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]
          args=("$ISSUE_NUMBER" --post)
          if [[ "$GITHUB_EVENT_NAME" == "issues" ]]; then args+=(--skip-unregistered); fi
          if [[ -n "$REVISION" ]]; then
            [[ "$REVISION" =~ ^r[1-9][0-9]*$ ]]
            args+=(--revision "$REVISION")
          fi
          python3 review/tools/round_summary.py "${args[@]}"
