<script>
'use strict';
try{localStorage.removeItem('cf7.skills.loadoutConfirmationMode')}catch(error){}
window.__copiedDiagnostic='';
window.__SKILLS_CONFIG__={requestTimeoutMs:120,switchTimeoutMs:80,previewDebounceMs:8,previewTokenFreshMs:150,
  sessionNonce:'harness',copyText:function(value){window.__copiedDiagnostic=String(value)}};
window.__sent=[];window.__toasts=[];window.__handlers={};window.__iconKeys=[];
window.__host={instance:'inst-manage',view:'manage',trainerSession:'trainer-A',revision:7,writeEpoch:0,
  snapshotDelay:0,previewDelay:0,invalidTrainer:false,previewBlocked:false,unknownNextWrite:false,malformedNextWrite:false,
  expireNextSnapshot:false,expireNextPreview:false,expireNextWrite:false,writeDelay:8,pendingWriteUntil:0,switchSeq:0,
  failNextSwitchTransport:false,dropNextSwitch:false,undefinedNextSwitchReturn:false,
  canReturnTrainer:false,returnSession:null};

function copy(value){return JSON.parse(JSON.stringify(value))}
function learned(skillKey,orderIndex,options){options=options||{};return{
  skillKey:skillKey,orderIndex:orderIndex,level:options.level==null?1:options.level,maxLevel:options.maxLevel||10,
  type:options.type||'武术-内力',passive:!!options.passive,equippable:options.equippable!==false,
  enabled:options.enabled!==false,equippedSlots:options.equippedSlots||[],unlockLevel:options.unlockLevel||1,
  unlockSP:options.unlockSP||10,upgradeSP:options.upgradeSP||5,mp:options.mp==null?8:options.mp,
  cooldownMs:options.cooldownMs==null?1200:options.cooldownMs,iconKey:options.iconKey||skillKey,
  description:options.description||('技能说明：'+skillKey),stateHealth:options.stateHealth||'ok',writeBlocked:!!options.writeBlocked
}}
var learnedRows=[
  learned('闪现',2,{level:3,maxLevel:20,equippedSlots:[4],description:'跨越短距离。\n<font color="#fff">保持为普通文本</font> \\ 路径'}),
  learned('旋风斩',5,{level:2,type:'武术-兵器'}),
  learned('铁壁',8,{level:4,type:'被动',passive:true,equippable:false,enabled:true}),
  learned('缺图技能',10,{level:1,type:'科技',iconKey:'不存在的精确键'}),
  learned('重复技',12,{level:2,type:'超能力',stateHealth:'duplicate',writeBlocked:true})
];
var slotNames={1:'空格',2:'Q',3:'E',4:'R',5:'T',6:'Y',7:'F',8:'G',9:'H',10:'V',11:'B',12:'N'};
var loadout=[];for(var s=1;s<=12;s++)loadout.push({slot:s,skillKey:null,keyLabel:slotNames[s],stateHealth:'ok',writeBlocked:false});
loadout[1].skillKey='旧技能';loadout[1].level=null;loadout[1].iconKey=null;loadout[1].stateHealth='unknown';
loadout[2].skillKey='重复技';loadout[2].level=2;loadout[2].iconKey='重复技';loadout[2].stateHealth='duplicate';loadout[2].writeBlocked=true;
loadout[3].skillKey='闪现';loadout[3].level=3;loadout[3].iconKey='闪现';
loadout[11].skillKey='遗留未知技';loadout[11].level=null;loadout[11].iconKey=null;loadout[11].stateHealth='unknown';

function trainerEntries(){return[
  {skillKey:'闪现',currentLevel:3,maxLevel:20,type:'武术-内力',passive:false,equippable:true,unlockLevel:15,unlockSP:20,upgradeSP:20,mp:14,cooldownMs:1700,iconKey:'闪现',description:'教师提供的闪现说明',stateHealth:'ok',writeBlocked:false},
  {skillKey:'新手冲拳',currentLevel:0,maxLevel:10,type:'武术-拳法',passive:false,equippable:true,unlockLevel:1,unlockSP:5,upgradeSP:5,mp:3,cooldownMs:500,iconKey:'新手冲拳',description:'尚未学习，目标只能为 1。',stateHealth:'ok',writeBlocked:false},
  {skillKey:'重复技',currentLevel:2,maxLevel:10,type:'武术-异常',passive:false,equippable:true,unlockLevel:1,unlockSP:1,upgradeSP:1,mp:1,cooldownMs:100,iconKey:'重复技',description:'坏档展示',stateHealth:'duplicate',writeBlocked:true}
]}
function authoritativeSnapshot(view,revision){
  var result={success:true,v:1,revision:revision==null?__host.revision:revision,view:view,
    player:{level:35,skillPoints:240,easyMode:false},learned:copy(learnedRows),loadout:copy(loadout),trainer:null,
    diagnostics:[{code:'duplicate_skill_rows',skillKey:'重复技',rowCount:2}]};
  if(view==='trainer')result.trainer={session:__host.trainerSession,entries:__host.invalidTrainer?['闪现']:trainerEntries()};
  return result
}
function emit(data){(__handlers.panel_resp||[]).slice().forEach(function(fn){fn(data)})}
function responseBase(message,ctx){return{type:'panel_resp',panel:'skills',domain:'skills',cmd:message.cmd,callId:message.callId,panelInstanceId:ctx.instance,writeEpoch:ctx.writeEpoch}}
function applyWrite(message){var p=message.payload;
  if(message.cmd==='equip'){
    loadout.forEach(function(slot){if(slot.skillKey===p.skillKey){slot.skillKey=null;slot.level=null;slot.iconKey=null;slot.stateHealth='ok'}});
    var target=loadout[p.slot-1];target.skillKey=p.skillKey;target.level=learnedRows.find(function(x){return x.skillKey===p.skillKey}).level;target.iconKey=p.skillKey;target.stateHealth='ok';target.writeBlocked=false;
    learnedRows.forEach(function(row){row.equippedSlots=loadout.filter(function(x){return x.skillKey===row.skillKey}).map(function(x){return x.slot})})
  }else if(message.cmd==='unequip'){
    var clear=loadout[p.slot-1];clear.skillKey=null;clear.level=null;clear.iconKey=null;clear.stateHealth='ok';clear.writeBlocked=false;
    learnedRows.forEach(function(row){row.equippedSlots=loadout.filter(function(x){return x.skillKey===row.skillKey}).map(function(x){return x.slot})})
  }else if(message.cmd==='moveSlot'){
    var sourceSlot=loadout[p.sourceSlot-1],targetSlot=loadout[p.targetSlot-1];
    var fields=['skillKey','level','iconKey','stateHealth','writeBlocked'];
    fields.forEach(function(field){var value=sourceSlot[field];sourceSlot[field]=targetSlot[field];targetSlot[field]=value});
    learnedRows.forEach(function(row){row.equippedSlots=loadout.filter(function(x){return x.skillKey===row.skillKey}).map(function(x){return x.slot})})
  }else if(message.cmd==='setPassive'){
    var passive=learnedRows.find(function(x){return x.skillKey===p.skillKey});if(passive)passive.enabled=!!p.enabled
  }else if(message.cmd==='reorder'){
    var source=learnedRows.find(function(x){return x.skillKey===p.skillKey}),target=learnedRows.find(function(x){return x.orderIndex===p.targetIndex});
    if(source&&target){var old=source.orderIndex;source.orderIndex=target.orderIndex;target.orderIndex=old}
  }else if(message.cmd==='learnCommit'){
    var entry=learnedRows.find(function(x){return x.skillKey==='新手冲拳'});if(!entry)learnedRows.push(learned('新手冲拳',14,{level:1,type:'武术-拳法'}));else entry.level=Math.max(entry.level,4)
  }
  __host.revision++;__host.writeEpoch++
}
function respond(message,ctx){var base=responseBase(message,ctx),p=message.payload||{};
  if(message.cmd==='snapshot'){
    if(__host.expireNextSnapshot){__host.expireNextSnapshot=false;Object.assign(base,{success:false,v:1,error:'trainer_session_expired',revision:__host.revision});emit(base);return}
    if(p.reconcileId&&Date.now()<__host.pendingWriteUntil){setTimeout(function(){respond(message,{instance:ctx.instance,view:ctx.view,trainerSession:ctx.trainerSession,revision:__host.revision,writeEpoch:__host.writeEpoch})},__host.pendingWriteUntil-Date.now()+4);return}
    var snap=authoritativeSnapshot(ctx.view,ctx.revision);Object.assign(base,snap);
    if(p.reconcileId){base.reconciled=true;base.reconcileId=p.reconcileId;base.writeEpoch=__host.writeEpoch;base.revision=__host.revision;Object.assign(base,authoritativeSnapshot(ctx.view))}
    emit(base);return
  }
  if(message.cmd==='learnPreview'){
    if(__host.expireNextPreview){__host.expireNextPreview=false;Object.assign(base,{success:false,v:1,error:'trainer_session_expired',revision:__host.revision});emit(base);return}
    var blocked=__host.previewBlocked;Object.assign(base,{success:true,v:1,trainerSession:p.trainerSession,skillKey:p.skillKey,
      currentLevel:p.skillKey==='新手冲拳'?0:3,desiredLevel:p.desiredLevel,cost:p.skillKey==='新手冲拳'?5:(p.desiredLevel-3)*20,
      revision:__host.revision,canCommit:!blocked,blockingError:blocked?'insufficient_sp':null,learnToken:blocked?null:'learn.harness.token'});emit(base);return
  }
  if(__host.expireNextWrite){__host.expireNextWrite=false;Object.assign(base,{success:false,v:1,error:'trainer_session_expired',revision:__host.revision});emit(base);return}
  var resultCtx={instance:ctx.instance,view:ctx.view,writeEpoch:__host.writeEpoch,revision:__host.revision};
  applyWrite(message);base.writeEpoch=__host.writeEpoch;base.revision=__host.revision;
  if(__host.malformedNextWrite){__host.malformedNextWrite=false;Object.assign(base,{success:false,error:'malformed_response',requiresReconcile:true});emit(base);return}
  var success=Object.assign(base,{success:true,v:1,changed:true,snapshot:authoritativeSnapshot(ctx.view)});
  if(__host.unknownNextWrite){__host.unknownNextWrite=false;__host.pendingWriteUntil=Date.now()+175;setTimeout(function(){__host.pendingWriteUntil=0;emit(success)},175);return}
  setTimeout(function(){emit(success)},__host.writeDelay)
}
window.Bridge={
  on:function(type,fn){(__handlers[type]||(__handlers[type]=[])).push(fn)},
  off:function(type,fn){var list=__handlers[type]||[],i=list.indexOf(fn);if(i>=0)list.splice(i,1)},
  send:function(message){var switching=message.cmd==='switch_manage'||message.cmd==='switch_trainer';
    if(switching&&__host.failNextSwitchTransport){__host.failNextSwitchTransport=false;return false}
    __sent.push(copy(message));if(message.cmd==='close')return true;
    if(switching&&__host.dropNextSwitch){__host.dropNextSwitch=false;return true}
    var undefinedSwitchReturn=switching&&__host.undefinedNextSwitchReturn;
    if(undefinedSwitchReturn)__host.undefinedNextSwitchReturn=false;
    if(message.cmd==='switch_manage'){
      setTimeout(function(){__host.switchSeq++;__host.returnSession=__host.trainerSession;__host.canReturnTrainer=true;
        __host.instance='inst-manage-switch-'+__host.switchSeq;__host.view='manage';
        Panels.open('skills',{panelInstanceId:__host.instance,view:'manage',focusSkillKey:message.payload.focusSkillKey,canReturnTrainer:true})},0);return undefinedSwitchReturn?undefined:true
    }
    if(message.cmd==='switch_trainer'){
      setTimeout(function(){__host.switchSeq++;__host.instance='inst-trainer-return-'+__host.switchSeq;__host.view='trainer';
        __host.trainerSession=__host.returnSession;__host.canReturnTrainer=false;
        Panels.open('skills',{panelInstanceId:__host.instance,view:'trainer',trainerSession:__host.trainerSession,focusSkillKey:message.payload.focusSkillKey})},0);return undefinedSwitchReturn?undefined:true
    }
    var ctx={instance:__host.instance,view:__host.view,trainerSession:__host.trainerSession,revision:__host.revision,writeEpoch:__host.writeEpoch};
    var delay=message.cmd==='snapshot'?__host.snapshotDelay:message.cmd==='learnPreview'?__host.previewDelay:0;
    setTimeout(function(){respond(message,ctx)},delay);return true
  }
};
window.Toast={add:function(message){__toasts.push(message)}};
window.Notch={reportRect:function(){}};
window.Icons={
  load:function(callback){callback()},
  html:function(name,cls){__iconKeys.push(name);if(name==='不存在的精确键')return'';return'<span class="'+(cls||'')+'" data-icon-name="'+String(name).replace(/"/g,'')+'"></span>'}
};
</script>

<script>
(async function(){
  var checks=[];
  function ok(name,value,detail){checks.push({name:name,ok:!!value,detail:detail||''})}
  function wait(ms){return new Promise(function(resolve){setTimeout(resolve,ms==null?25:ms)})}
  async function until(test,timeout){var end=Date.now()+(timeout||1200);while(Date.now()<end){if(test())return true;await wait(15)}return false}
  function sent(cmd){return __sent.filter(function(item){return item.cmd===cmd})}
  function row(key){return Array.prototype.find.call(document.querySelectorAll('.skills-library-row'),function(node){return node.getAttribute('data-skill-key')===key})}
  function clickModalConfirm(){var node=document.querySelector('.workbench-modal-action.primary');if(node)node.click();return!!node}
  function setHost(init){Object.assign(__host,init);Panels.open('skills',{panelInstanceId:__host.instance,view:__host.view,
    trainerSession:__host.view==='trainer'?__host.trainerSession:undefined,canReturnTrainer:__host.view==='manage'&&__host.canReturnTrainer===true})}
  try{
    Panels.init();setHost({instance:'inst-manage',view:'manage',snapshotDelay:0,invalidTrainer:false,canReturnTrainer:false,returnSession:null});
    await until(function(){return document.querySelectorAll('.skills-slot').length===12});
    ok('manage mounts library plus action-strip workbench views',document.querySelector('[data-instance-key="skills:library"]')&&document.querySelector('[data-instance-key="skills:actions"]'));
    var skillFrames=document.querySelectorAll('.skills-panel .workbench-slot'),skillMarkers=document.querySelectorAll('.skills-panel .workbench-slot-marker');
    ok('redundant L/R marker bars are visually removed while slot semantics remain',skillMarkers.length===2
      &&Array.prototype.every.call(skillMarkers,function(node){return getComputedStyle(node).display==='none'})
      &&skillFrames[0].getAttribute('aria-label').indexOf('技能库')>=0
      &&skillFrames[1].getAttribute('aria-label').indexOf('快捷技能带')>=0);
    ok('manage removes routine technical chrome',document.querySelectorAll('.workbench-metric').length===0
      &&getComputedStyle(document.querySelector('.workbench-status')).display==='none'
      &&document.querySelector('.skills-refresh-btn').hidden
      &&document.querySelector('.skills-panel').textContent.indexOf('权威')<0
      &&document.querySelector('.skills-panel').textContent.indexOf('版本')<0);
    var confirmationToggle=document.querySelector('.skills-confirmation-toggle');
    var safeConfirmation=document.querySelector('[data-confirmation-mode="safe"]');
    var fastConfirmation=document.querySelector('[data-confirmation-mode="fast"]');
    ok('manage exposes the current loadout confirmation mode beside the density switch',confirmationToggle
      &&confirmationToggle.querySelector('.item-grid-mode-label').textContent==='快捷栏'
      &&confirmationToggle.getAttribute('aria-label')==='快捷栏操作确认'
      &&safeConfirmation.getAttribute('aria-pressed')==='true'&&fastConfirmation.getAttribute('aria-pressed')==='false');
    var densityHeaderRect=document.querySelector('.skills-density-toggle').getBoundingClientRect();
    var confirmationHeaderRect=confirmationToggle.getBoundingClientRect();
    var headerActionsRect=document.querySelector('.skills-panel .workbench-header-actions').getBoundingClientRect();
    ok('density and confirmation controls remain equal-width ordered groups inside the header',Math.abs(confirmationHeaderRect.width-densityHeaderRect.width)<=1
      &&confirmationHeaderRect.left>=densityHeaderRect.right-1
      &&confirmationHeaderRect.right<=headerActionsRect.right+1&&confirmationHeaderRect.top>=headerActionsRect.top-1
      &&confirmationHeaderRect.bottom<=headerActionsRect.bottom+1);
    var headerModeTypography=Array.prototype.map.call(document.querySelectorAll('.skills-density-toggle .item-grid-mode-option,.skills-confirmation-toggle .item-grid-mode-option'),function(node){
      var style=getComputedStyle(node);return [style.fontSize,style.fontWeight,style.fontFamily,style.lineHeight,style.letterSpacing].join('|');
    });
    ok('all four header mode options share one computed typography contract',headerModeTypography.length===4
      &&headerModeTypography.every(function(value){return value===headerModeTypography[0]})
      &&headerModeTypography[0].indexOf('11px|600|')===0,JSON.stringify(headerModeTypography));
    var skillScrollProbe=document.querySelector('.skills-library-list'),skillScrollStyle=skillScrollProbe.style.cssText;
    skillScrollProbe.style.cssText+=';height:48px!important;min-height:48px!important;max-height:48px!important;flex:0 0 48px!important;overflow:auto!important';skillScrollProbe.scrollTop=skillScrollProbe.scrollHeight;
    var skillScrollTarget=row('重复技');skillScrollTarget.focus({preventScroll:true});var skillScrollBefore=skillScrollProbe.scrollTop;skillScrollTarget.click();
    var skillScrollAfter=skillScrollProbe.scrollTop,skillScrollSelection=row('重复技');
    ok('skill selection patches the row in place while preserving overflowing library scroll and entity focus',skillScrollBefore>0&&Math.abs(skillScrollAfter-skillScrollBefore)<=1&&document.activeElement===skillScrollSelection&&skillScrollSelection===skillScrollTarget,
      JSON.stringify({before:skillScrollBefore,after:skillScrollAfter,focus:document.activeElement&&document.activeElement.getAttribute('data-skill-key')}));
    skillScrollProbe.style.cssText=skillScrollStyle;skillScrollProbe.scrollTop=0;row('闪现').click();
    var beforeHelp=__sent.length,manageHelpButton=document.querySelector('.skills-help-btn');manageHelpButton.focus();manageHelpButton.click();
    ok('manage help explains equip reorder keyboard fallback filters and search without transport',document.querySelector('.workbench-modal[data-modal-kind="skills-help"]')
      &&document.querySelector('.workbench-modal').getAttribute('aria-label')==='技能管理帮助'
      &&document.querySelector('.workbench-modal').textContent.indexOf('快捷槽可互相拖动')>=0
      &&document.querySelector('.workbench-modal').textContent.indexOf('Alt + ← / →')>=0
      &&document.querySelector('.workbench-modal').textContent.indexOf('拖到另一个技能格')>=0
      &&document.querySelector('.workbench-modal').textContent.indexOf('Alt + ↑ / ↓')>=0
      &&document.querySelector('.workbench-modal').textContent.indexOf('形态、配置和流派')>=0
      &&document.querySelector('.workbench-modal').textContent.indexOf('按 /')>=0
      &&document.querySelector('.workbench-modal').textContent.indexOf('当前：安全模式')>=0
      &&document.querySelector('.workbench-modal').textContent.indexOf('顶栏始终显示当前模式')>=0
      &&!document.querySelector('[data-action="confirmation-mode"]')&&__sent.length===beforeHelp);
    var helpRect=document.querySelector('.workbench-modal').getBoundingClientRect(),panelRect=document.querySelector('.skills-panel').getBoundingClientRect();
    ok('help modal stays inside the smallest scaled panel canvas',helpRect.top>=panelRect.top-1&&helpRect.left>=panelRect.left-1
      &&helpRect.right<=panelRect.right+1&&helpRect.bottom<=panelRect.bottom+1);
    document.querySelector('.workbench-modal-action.primary').click();
    ok('closing help restores the header help-button focus',document.activeElement===manageHelpButton&&!document.querySelector('.workbench-modal'));
    var wrongManageView=authoritativeSnapshot('trainer');
    ok('manage rejects a trainer-view snapshot',SkillsPanel.validateSnapshot(wrongManageView).ok===false);
    var leakedTrainer=authoritativeSnapshot('manage');leakedTrainer.trainer={session:'trainer-leak',entries:trainerEntries()};
    ok('manage rejects leaked trainer capability',SkillsPanel.validateSnapshot(leakedTrainer).ok===false);
    var envelope=sent('snapshot')[0];
    ok('business envelope uses exact nested payload and instance route metadata',envelope&&Object.keys(envelope).sort().join(',')==='callId,cmd,domain,panel,panelInstanceId,payload,type'&&envelope.panelInstanceId==='inst-manage'&&envelope.payload.v===1&&envelope.payload.view==='manage');
    ok('business fields never leak to top level',envelope&&!('v'in envelope)&&!('view'in envelope)&&!('expectedRevision'in envelope));
    ok('renders complete twelve-slot loadout',document.querySelectorAll('.skills-slot').length===12&&document.querySelector('[data-slot="12"]'));
    var slotTops=Array.prototype.map.call(document.querySelectorAll('.skills-slot'),function(node){return Math.round(node.getBoundingClientRect().top)});
    ok('manage presents the twelve shortcuts as one continuous skill band',Math.max.apply(Math,slotTops)-Math.min.apply(Math,slotTops)<=1);
    var densityToggle=document.querySelector('.skills-density-toggle');
    ok('density switch is explicitly scoped to the skill library',densityToggle.getAttribute('aria-label')==='技能库布局'
      &&densityToggle.querySelector('.item-grid-mode-label').textContent==='技能库'&&densityToggle.title.indexOf('快捷技能带保持固定')>=0);
    var firstSlot=document.querySelector('[data-slot="1"]'),firstSlotIcon=firstSlot.querySelector('.skills-slot-icon');
    var fixedSlotGeometry={width:firstSlot.offsetWidth,height:firstSlot.offsetHeight,icon:firstSlotIcon.offsetWidth};
    ok('hotbar uses fixed item-like square slots with larger readable icons',fixedSlotGeometry.width===64&&fixedSlotGeometry.height===64
      &&fixedSlotGeometry.icon===48&&document.querySelector('.skills-loadout-grid').offsetWidth===801);
    var bandRect=document.querySelector('.skills-loadout-section').getBoundingClientRect(),gridRect=document.querySelector('.skills-loadout-grid').getBoundingClientRect();
    ok('fixed twelve-slot rail stays centered without stretching cards',Math.abs((bandRect.left+bandRect.right-gridRect.left-gridRect.right)/2)<=1
      &&gridRect.left>=bandRect.left&&gridRect.right<=bandRect.right&&document.querySelector('.skills-loadout-section > .skills-section-title').textContent==='快捷技能');
    var idleClear=document.querySelector('[data-slot="2"] .skills-slot-clear'),idleClearStyle=getComputedStyle(idleClear);
    var clearHidden=idleClearStyle.opacity==='0'&&idleClearStyle.pointerEvents==='none';idleClear.focus();await wait(100);
    ok('unequip control stays quiet until hover or focus',clearHidden&&getComputedStyle(idleClear).opacity==='1'
      &&getComputedStyle(idleClear).pointerEvents==='auto');
    row('闪现').focus();
    var selectedSlot=document.querySelector('[data-slot="4"]'),selectedClear=selectedSlot.querySelector('.skills-slot-clear'),selectedLevel=selectedSlot.querySelector('.skills-slot-level');
    ok('selection keeps the level badge visible without a permanent clear-button collision',selectedSlot.classList.contains('selected')
      &&selectedLevel.textContent==='Lv.3'&&getComputedStyle(selectedLevel).opacity==='1'&&getComputedStyle(selectedClear).opacity==='0');
    selectedSlot.querySelector('.skills-slot-main').focus();
    ok('hover or focus explicitly swaps the level badge for the clear action',getComputedStyle(selectedLevel).opacity==='0'
      &&getComputedStyle(selectedClear).opacity==='1'&&getComputedStyle(selectedClear).pointerEvents==='auto');
    row('闪现').focus();
    ok('uses exact snapshot iconKey values',__iconKeys.indexOf('闪现')>=0&&__iconKeys.indexOf('不存在的精确键')>=0);
    ok('missing icon has visible fallback',document.querySelector('.skills-row-icon.missing .skills-icon-fallback'));
    ok('manage removes the permanent description hero',!document.querySelector('.skills-detail-hero')&&!document.querySelector('.skills-detail-copy'));
