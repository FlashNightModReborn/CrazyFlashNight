<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Character Build Editing Harness</title>
<base href="../../../">
<link rel="stylesheet" href="css/panels.css">
<style>
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#05070b; }
body { display:flex; align-items:center; justify-content:center; }
#character-build-stage { width:1024px; height:576px; flex:0 0 auto; }
#qa-state { position:fixed; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
body[data-character-stats-fixture] .character-build-stats-profile::before {
    position:absolute; z-index:2; top:5px; right:9px; content:"QA 测试夹具 · AS2 EXACT SHAPE";
    color:#8ea1a7; font:8px/1 Consolas,monospace; letter-spacing:.08em;
}
</style>
</head>
<body data-character-stats-fixture="true">
<div id="character-build-stage"></div>
<output id="qa-state">booting</output>

<script src="modules/character-build/dev/stats-fixture.js"></script>
<script src="modules/workbench-lifecycle.js"></script>
<script src="modules/workbench-focus.js"></script>
<script src="modules/workbench-primitives.js"></script>
<script src="modules/workbench.js"></script>
<script src="modules/workbench-components.js"></script>
<script src="modules/workbench-inspection-viewport.js"></script>
<script src="modules/inventory-ui.js"></script>
<script src="modules/character-build/character-build-action-view.js"></script>
<script src="modules/character-build/character-build-stats-view.js"></script>
<script src="modules/character-build/character-build-doll-preview.js"></script>
<script src="modules/character-build-view.js"></script>
<script>
(function() {
    'use strict';

    function clone(value) { return JSON.parse(JSON.stringify(value)); }
    function item(name, meta) {
        var quantity = /×\s*(\d+)/.exec(name);
        var level = /\+(\d+)/.exec(meta || '');
        return {
            name:name,
            meta:meta || '已装备 · 权威快照',
            presentation:{
                name:name, displayName:name, icon:name,
                itemKind:quantity ? 'stack' : 'equipment',
                quantity:quantity ? Number(quantity[1]) : 1,
                enhancementLevel:level ? Number(level[1]) : 0
            }
        };
    }
    function candidates(longText, blocked) {
        var names = [
            '镜之虎彻', '烈火吉他', '苍蓝脉冲步枪', '静默处决者', '暴雨散射器', '白夜长刀',
            '深空信标', '铁壁实验装甲', '夜行者披风', '荒原寻路器', '应急战术包', '旧时代纪念章'
        ];
        return names.map(function(name, index) {
            var displayName = longText && index === 1
                ? '超长中文候选名称用于验证在最窄栏位中不会制造横向滚动或遮挡主操作按钮'
                : name;
            return {
                key:'candidate-' + (index + 1),
                name:displayName,
                type:index % 3 === 0 ? '同槽位武器' : '背包候选',
                delta:index % 4 === 0 ? '+12' : index % 4 === 1 ? '+4' : index % 4 === 2 ? '±0' : '-3',
                summary:longText
                    ? '这是用于验证长中文摘要自动折行、截断且不会挤压直接操作区域的测试内容。'
                    : '伤害与机动的权威对比摘要；选择只更新临时预览。',
                presentation:{
                    name:displayName, displayName:displayName, icon:name,
                    itemKind:'equipment', enhancementLevel:index % 5,
                    tierSlotAvailable:true, tierSlotUsed:index % 2 === 0,
                    modSlotCapacity:3, modSlotUsed:index % 3
                },
                physicalSlot:index,
                blocked:!!blocked
            };
        });
    }

    var base = {
        playerName:'莱拉',
        level:35,
        equipment:{
            '头部装备':item('北境侦察盔','防护 18'),
            '上装装备':item('铁壁实验装甲','护甲 126'),
            '下装装备':item('荒原寻路护腿','机动 +5'),
            '手部装备':item('脉冲稳定手套','操控 +7'),
            '脚部装备':item('夜行者战靴','移速 +8%'),
            '颈部装备':item('战术围巾','静态图标回退'),
            '长枪':item('镜之虎彻','长枪 · +13'),
            '手枪':item('静默短铳','手枪 · +8'),
            '手枪2':item('苍蓝备用铳','手枪 2 · +6'),
            '刀':item('白夜长刀','刀 · +11'),
            '手雷':item('震荡手雷 × 3','堆叠数量 3')
        },
        drugs:{
            drug1:item('急救喷雾 × 3','生命恢复'),
            drug2:item('肾上腺素 × 2','短时机动'),
            drug3:item('护甲修复剂 × 1','护甲恢复'),
            drug4:item('解毒剂 × 4','异常清除')
        },
        candidates:candidates(false, false),
        stats:CharacterBuildStatsFixture.create()
    };

    var fixtures = {full:base};
    fixtures.empty = clone(base);
    fixtures.empty.playerName = '空槽校验';
    fixtures.empty.equipment['头部装备'] = null;
    fixtures.empty.equipment['颈部装备'] = null;
    fixtures.empty.equipment['手雷'] = null;
    fixtures.empty.drugs.drug3 = null;

    fixtures.blocked = clone(base);
    fixtures.blocked.playerName = '阻断态校验';
    fixtures.blocked.blocked = true;
    fixtures.blocked.blockedReason = '候选与当前槽位不兼容；当前装备不会改变。';
    fixtures.blocked.candidates = candidates(false, true);

    fixtures.long = clone(base);
    fixtures.long.playerName = '用于验证极长中文角色名称在标题和统计区域不会造成横向滚动的测试角色';
    fixtures.long.equipment['长枪'] = item(
        '经过多轮实验改装并附带很长来源说明的镜之虎彻最终验证型',
        '长枪 · 极长中文元数据仍保持单行收敛');
    fixtures.long.candidates = candidates(true, false);
    fixtures.long.stats.groups[0].rows[3].value =
        '跨越多个阵营档案来源且需要验证窄屏省略与完整明细并存的超长角色称号';
    fixtures.long.stats.groups[0].rows[3].spans = [{
        text:fixtures.long.stats.groups[0].rows[3].value,
        color:'#FFD700'
    }];

    var shell = new Workbench.DualPaneShell({
        title:'角色构筑',
        status:'已同步',
        leftLabel:'背包',
        rightLabel:'角色构筑'
    });
    var shellRoot = shell.getRoot();
    shellRoot.classList.add('kshop-workbench', 'inventory-workbench-panel', 'character-build-shell');
    shellRoot.setAttribute('data-workbench-view', 'build');
    shellRoot.setAttribute('data-workbench-skin', 'character');
    shellRoot.querySelector('.workbench-body').hidden = true;
    var buildHost = document.createElement('section');
    buildHost.className = 'character-build-host';
    shellRoot.insertBefore(buildHost, shellRoot.querySelector('.workbench-modal-layer'));
    document.getElementById('character-build-stage').appendChild(shellRoot);

    var header = shellRoot.querySelector('.workbench-header');
    header.classList.add('character-build-header');
    var actions = document.createElement('nav');
    actions.className = 'character-build-header-actions';
    actions.setAttribute('aria-label', '角色构筑视图');
    shell.addHeaderAction(actions);
    function headerButton(id, label, onClick) {
        var button = document.createElement('button');
        button.type = 'button';
        button.className = id === 'close' ? 'workbench-close-btn' : 'workbench-mode-btn';
        button.textContent = label;
        button.setAttribute('data-header-action', id);
        if (onClick) button.addEventListener('click', onClick);
        actions.appendChild(button);
        return button;
    }

    var scenario = 'full';
    var view = null;
    var actionLog = {commits:[], unequips:0, reconciles:0};
    var storageButton = headerButton('storage', '收纳');
    var statsButton = headerButton('stats', '个人信息', function() {
        view.setStats(fixtures[scenario].stats);
        view.openStats(statsButton);
    });
    var backButton = headerButton('back-build', '← 返回构筑', function() {
        view.closeStats('back');
    });
    backButton.hidden = true;
    headerButton('help', '?');
    headerButton('close', '×');

    view = new CharacterBuildView.CharacterBuildView({
        document:document,
        renderOwnedSlot:InventoryUI.renderOwnedSlot,
        iconHtml:function(name, className) {
            var safeName = String(name || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;');
            return '<img class="' + className + '" data-icon-name="' + safeName
                + '" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%233dd5ff%22/%3E%3Cpath d=%22M3 8h10M8 3v10%22 stroke=%22%2305090c%22/%3E%3C/svg%3E" alt="">';
        },
        onSlotSelect:function() { return clone(fixtures[scenario].candidates); },
        onCommitCandidate:function(candidate) {
            actionLog.commits.push(candidate && candidate.key);
            return !!candidate;
        },
        onUnequip:function() {
            actionLog.unequips++;
            return true;
        },
        onReconcile:function() {
            actionLog.reconciles++;
            return true;
        },
        onStatsModeChange:function(active, statsRoot, opener) {
            shellRoot.setAttribute('data-workbench-view', active ? 'stats' : 'build');
            storageButton.hidden = active;
            statsButton.hidden = active;
            backButton.hidden = !active;
            if (active) statsRoot.insertBefore(header, statsRoot.firstChild);
            else shellRoot.insertBefore(header, shellRoot.firstChild);
            return active ? backButton : opener;
        }
    });
    view.mount(buildHost);
    view.setInteractionState('idle');
    view.setSnapshot(fixtures.full);
    view.setStats(fixtures.full.stats);

    window.CharacterBuildHarness = {
        view:view,
        actionLog:actionLog,
        fixtures:fixtures,
        scenario:'full',
        setScenario:function(name) {
            if (!fixtures[name]) throw new Error('unknown scenario: ' + name);
            this.scenario = scenario = name;
            view.setSnapshot(fixtures[name]);
            return view.debugState();
        },
        setDensity:function(mode) {
            view.setDensity(mode);
            return view.debugState();
        },
        reset:function() {
            view.clearCandidateSelection();
            view.setDensity('full');
            view.setInteractionState('idle');
            actionLog.commits = [];
            actionLog.unequips = 0;
            actionLog.reconciles = 0;
            return this.setScenario('full');
        }
    };
    document.getElementById('qa-state').textContent = 'ready';
    window.__qaReady = true;
})();
</script>
</body>
</html>
