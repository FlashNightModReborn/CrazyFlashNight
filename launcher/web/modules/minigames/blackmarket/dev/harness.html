<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Black Market Anonymous Shadow QA</title>
<link rel="stylesheet" href="../../../../css/panels.css">
<link rel="stylesheet" href="../../shared/minigame-shell.css">
<link rel="stylesheet" href="../../shared/dev/harness-base.css">
<link rel="stylesheet" href="../blackmarket.css">
</head>
<body>
<div id="panel-container" data-panel="blackmarket">
    <div id="panel-backdrop"></div>
    <div id="panel-content"></div>
</div>

<script>
window.__minigameOverlayRoot = "../../../../";
window.__BLACKMARKET_REQUEST_URLS__ = [];
window.__CF7_PANEL_CLOSE_ACK_TIMEOUT_MS__ = 80;
(function(originalFetch) {
    window.fetch = function(input, init) {
        var url = input && input.url ? input.url : input;
        window.__BLACKMARKET_REQUEST_URLS__.push(String(url));
        return originalFetch(input, init);
    };
})(window.fetch.bind(window));
</script>
<script src="../../../bridge.js"></script>
<script src="../../../panels.js"></script>
<script src="../../../panel-scale.js"></script>
<script src="../../shared/host-bridge.js"></script>
<script src="../../shared/dev/harness-base.js"></script>
<script src="../core/index.js"></script>
<script src="../../../workbench-inspection-viewport.js"></script>
<script src="../visual/inspection-focus.js"></script>
<script src="../visual/item-surface.js"></script>
<script src="../blackmarket-panel.js"></script>
<script>
(function() {
    "use strict";

    var query = MinigameHarness.parseQuery(location.search);
    var productSession = null;

    var createProductSession = BlackMarketCore.createShadowSession;
    BlackMarketCore.createShadowSession = function(options) {
        productSession = createProductSession(options);
        return productSession;
    };

    function buildInit(overrides) {
        var out = {
            mode: "dev",
            source: "browser-harness",
            shadowOnly: true,
            debug: true,
            panelInstanceId: "panel.blackmarket.harness.1"
        };
        overrides = overrides || {};
        Object.keys(overrides).forEach(function(key) { out[key] = overrides[key]; });
        return out;
    }

    function bootSession(api, overrides) {
        var readyCount = api.getSessionEvents("ready").length;
        Panels.open("blackmarket", buildInit(overrides));
        return api.waitForNextSessionEvent("ready", readyCount, 4000).then(function() {
            return productSession && productSession.product.open();
        });
    }

    function waitForSurfaceReady(api, expected) {
        return api.waitFor(function() {
            var ready = document.querySelectorAll('.blackmarket-item-surface[data-surface-state="ready"]').length;
            return ready >= expected ? ready : null;
        }, 30000, expected + " generated anonymous surfaces");
    }

    function assertHistoricalExactResourcesUnavailable(api) {
        var paths = [
            "../../../../data/black-market-shadow-catalog.v1.json",
            "./exact-lab-core.js"
        ];
        return Promise.all(paths.map(function(resourcePath) {
            return fetch(resourcePath, { cache: "no-store" }).then(function(response) {
                api.assert(!response.ok,
                    "historical exact Web resource remained readable: " + resourcePath + " HTTP " + response.status);
                return resourcePath + "=HTTP " + response.status;
            }, function() {
                return resourcePath + "=network error";
            });
        }));
    }

    function purchaseAndResell(api) {
        return bootSession(api).then(function(opened) {
            api.assert(opened && opened.pairs.length === 3, "page did not expose three pairs");
            var offerButton = document.querySelector('[data-bm-action="select"]');
            api.assert(!!offerButton, "selectable offer missing");
            offerButton.click();
            var confirm = document.querySelector('[data-bm-action="confirm"]');
            api.assert(!!confirm && !confirm.disabled, "purchase confirmation missing");
            confirm.click();
            return api.waitFor(function() {
                var value = productSession && productSession.product.open();
                return value && value.pending ? value : null;
            }, 2500, "pending anonymous purchase");
        }).then(function(pending) {
            api.assert(!!pending.pending, "purchase did not create pending reveal");
            var settle = document.querySelector('[data-bm-action="settle"][data-settle="resell"]');
            api.assert(!!settle, "resell action missing");
            settle.click();
            return api.waitFor(function() {
                var value = productSession && productSession.product.open();
                return value && !value.pending && value.historyCount === 1 ? value : null;
            }, 2500, "settled anonymous purchase");
        }).then(function(settled) {
            api.assert(api.getSessionEvents("purchase").length > 0, "purchase session event missing");
            api.assert(api.getSessionEvents("settle").length > 0, "settle session event missing");
            return "anonymous purchase -> reveal -> resell, history=" + settled.historyCount;
        });
    }

    function browserCases() {
        return [
            {
                id: "bm-ui1",
                title: "匿名产品面启动三组六件货舱",
                run: function(api) {
                    return bootSession(api).then(function(snapshot) {
                        api.assert(snapshot && snapshot.identityBoundary === "anonymous-synthetic-no-catalog.v2",
                            "anonymous identity boundary missing");
                        api.assertEqual(snapshot.pairs.length, 3, "pair count");
                        api.assertEqual(document.querySelectorAll(".blackmarket-offer").length, 6, "offer count");
                        api.assert(snapshot.pairs.every(function(pair) {
                            return pair.category === "anonymous" && pair.subclass === "匿名影子货舱";
                        }), "real catalog taxonomy reached product snapshot");
                        return "3 pairs / 6 anonymous synthetic offers";
                    });
                }
            },
            {
                id: "bm-ui2",
                title: "普通产品面 DOM 与新请求不含真实目录",
                run: function(api) {
                    var requestStart = window.__BLACKMARKET_REQUEST_URLS__.length;
                    var resourceStart = window.performance && performance.now ? performance.now() : 0;
                    var opened;
                    return bootSession(api).then(function(snapshot) {
                        opened = snapshot;
                        return waitForSurfaceReady(api, 6);
                    }).then(function() {
                        var domHtml = document.querySelector(".blackmarket-machine").outerHTML;
                        var requests = window.__BLACKMARKET_REQUEST_URLS__.slice(requestStart);
                        if (window.performance && performance.getEntriesByType) {
                            requests = requests.concat(performance.getEntriesByType("resource")
                                .filter(function(entry) { return entry.startTime >= resourceStart; })
                                .map(function(entry) { return entry.name; }));
                        }
                        api.assertEqual(document.querySelectorAll(".blackmarket-offer img").length, 0,
                            "item image exists in product DOM");
                        api.assert(!document.querySelector('[data-bm-action="open-lab"]'),
                            "product panel exposed a Lab action");
                        api.assert(!/(?:assetUri|iconUri|itemId|iconKey|surfaceSeed|data\/items\/)/.test(JSON.stringify(opened)),
                            "product snapshot contains an identity/replay field");
                        requests.forEach(function(url) {
                            api.assert(!/black-market-shadow-catalog\.v1\.json/i.test(url),
                                "product boot requested the exact catalog " + url);
                            api.assert(!/(?:^|\/)icons\/[^?#]+(?:[?#]|$)/i.test(url),
                                "product boot requested an item icon " + url);
                        });
                        api.assert(!/(?:assetUri|iconUri|itemId|iconKey|saleValue|data\/items\/|icons\/)/.test(domHtml),
                            "product DOM contains an exact catalog field or asset path");
                        return assertHistoricalExactResourcesUnavailable(api).then(function(results) {
                            return "zero exact catalog/icon requests after product open; " + results.join(", ");
                        });
                    });
                }
            },
            {
                id: "bm-ui3",
                title: "影子购买、揭晓与回售闭环",
                run: purchaseAndResell
            },
            {
                id: "bm-ui4",
                title: "旧 marker 与 capability 不能提权产品面",
                run: function(api) {
                    window.__CF7_BLACKMARKET_DEV_LAB_BOOTSTRAP__ = "cf7-blackmarket-dev-lab-v1";
                    return bootSession(api, {
                        allowExactIdentityLab: "cf7-blackmarket-exact-identity-lab-v1",
                        seed: "attacker-controlled"
                    }).then(function(snapshot) {
                        api.assert(snapshot.identityBoundary === "anonymous-synthetic-no-catalog.v2",
                            "retired capability changed the product identity boundary");
                        api.assert(typeof BlackMarketCore.createDevelopmentSession === "undefined",
                            "product core acquired an exact session factory");
                        api.assert(!document.querySelector('[data-bm-action="open-lab"]'),
                            "retired capability opened a Lab control");
                        return "retired marker/capability ignored; product remains anonymous";
                    });
                }
            },
            {
                id: "bm-ui5",
                title: "三舱布局留在固定逻辑画布",
                run: function(api) {
                    return bootSession(api).then(function() {
                        var panel = document.querySelector(".blackmarket-panel");
                        var deck = document.querySelector(".blackmarket-deck");
                        api.assert(!!panel && !!deck, "panel/deck missing");
                        api.assertEqual(deck.querySelectorAll(".blackmarket-bay").length, 3, "bay count");
                        api.assertEqual(panel.offsetWidth, 1024, "design width");
                        api.assertEqual(panel.offsetHeight, 576, "design height");
                        return "fixed 1024x576 design surface / three bays";
                    });
                }
            },
            {
                id: "bm-ui6",
                title: "匿名安全表面可放大检视",
                run: function(api) {
                    return bootSession(api).then(function() { return waitForSurfaceReady(api, 6); }).then(function() {
                        var offer = document.querySelector('[data-bm-action="select"]');
                        offer.click();
                        return api.waitFor(function() {
                            var inspect = document.querySelector('[data-bm-action="inspect-selected"]');
                            return inspect && !inspect.disabled ? inspect : null;
                        }, 2500, "anonymous inspection enabled");
                    }).then(function(inspect) {
                        inspect.click();
                        var dialog = document.querySelector(".blackmarket-inspection-dialog");
                        api.assert(!!dialog, "inspection dialog missing");
                        api.assert(dialog.textContent.indexOf("匿名") >= 0 || dialog.textContent.indexOf("安全") >= 0,
                            "inspection shell did not identify the anonymous surface boundary");
                        api.assertEqual(dialog.querySelectorAll("img").length, 0,
                            "inspection dialog contains an item image");
                        return "same anonymous mud master inspected without exact source";
                    });
                }
            },
            {
                id: "bm-ui7",
                title: "缩小宿主仅改变 PanelScale",
                run: function(api) {
                    return bootSession(api).then(function() {
                        var shell = document.querySelector(".blackmarket-scale-shell");
                        var deck = document.querySelector(".blackmarket-deck");
                        var container = document.getElementById("panel-container");
                        container.style.width = "768px";
                        container.style.height = "432px";
                        window.dispatchEvent(new Event("resize"));
                        return api.waitFor(function() {
                            return shell && shell.style.transform.indexOf("scale(0.75") >= 0 ? shell : null;
                        }, 2500, "PanelScale 0.75").then(function() {
                            api.assertEqual(deck.querySelectorAll(".blackmarket-bay").length, 3,
                                "scaled surface lost a bay");
                            container.style.width = "";
                            container.style.height = "";
                            window.dispatchEvent(new Event("resize"));
                            return "1024x576 layout retained at 0.75 scale";
                        });
                    });
                }
            },
            {
                id: "bm-ui8",
                title: "exact close 确认丢失后恢复可重试",
                run: function(api) {
                    var originalSend = Bridge.send;
                    var closeMessages = [];
                    Bridge.send = function(payload) {
                        if (payload && payload.type === "panel" && payload.cmd === "close"
                                && payload.panel === "blackmarket") {
                            closeMessages.push(payload);
                            return true;
                        }
                        return originalSend.apply(this, arguments);
                    };
                    function restore() { Bridge.send = originalSend; }
                    var flow = bootSession(api, {
                        panelInstanceId: "panel.blackmarket.harness.close-retry"
                    }).then(function() {
                        var close = document.querySelector('[data-bm-action="close"]');
                        api.assert(!!close, "close control missing");
                        close.click();
                        api.assert(Panels.isOpen(), "panel closed before Host confirmation");
                        api.assertEqual(closeMessages.length, 1, "first close request count");
                        return api.waitFor(function() {
                            var status = document.querySelector(".blackmarket-error span");
                            return status && status.textContent.indexOf("尚未确认关闭，可再次尝试") >= 0
                                ? status : null;
                        }, 2000, "close retry unlocked");
                    }).then(function() {
                        api.assert(Panels.isOpen(), "panel closed after lost confirmation timeout");
                        document.querySelector('[data-bm-action="close"]').click();
                        api.assertEqual(closeMessages.length, 2, "retried close request count");
                        api.assert(closeMessages.every(function(message) {
                            return message.panelInstanceId === "panel.blackmarket.harness.close-retry";
                        }), "close retry changed panel instance capability");
                        Panels.close();
                        return "lost ack kept panel open; retry emitted the same exact instance";
                    });
                    return flow.then(function(detail) {
                        restore();
                        return detail;
                    }, function(error) {
                        restore();
                        throw error;
                    });
                }
            }
        ];
    }

    function runSuite(api, caseId) {
        var defs = browserCases();
        if (caseId) defs = defs.filter(function(item) { return item.id === caseId; });
        var results = [];
        var flow = Promise.resolve();
        defs.forEach(function(def) {
            flow = flow.then(function() {
                return api.runCase(def.id, def.title, function() { return def.run(api); });
            }).then(function(result) { results.push(result); });
        });
        return flow.then(function() { return MinigameHarness.normalizeBundle(results); });
    }

    function collectDump(api) {
        return {
            layout: api.captureLayout({ main: ".blackmarket-deck", side: ".blackmarket-bay" }),
            snapshot: productSession ? productSession.product.open() : null,
            surfaces: {
                ready: document.querySelectorAll('.blackmarket-item-surface[data-surface-state="ready"]').length,
                error: document.querySelectorAll('.blackmarket-item-surface[data-surface-state="error"]').length
            },
            telemetry: api.getSessionEvents().slice(-8)
        };
    }

    var harness = MinigameHarness.create({
        panelId: "blackmarket",
        title: "Black Market Anonymous Shadow QA",
        openPanel: function() { Panels.open("blackmarket", buildInit()); },
        runScenario: function(api) { return purchaseAndResell(api); },
        runSuite: runSuite,
        collectDump: collectDump
    });

    window.addEventListener("load", function() { harness.boot(); });
})();
</script>
</body>
</html>
