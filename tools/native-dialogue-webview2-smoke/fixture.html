<script>
var handlers = {};
var Bridge = {
  on: function(name, fn) { handlers[name] = fn; },
  task: function(task, payload) { chrome.webview.postMessage({ task: task, payload: payload }); }
};
chrome.webview.addEventListener('message', function(event) {
  var message = event.data;
  if (handlers[message.type]) handlers[message.type](message);
});
</script>
