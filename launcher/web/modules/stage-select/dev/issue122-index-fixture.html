<!doctype html>
<meta charset="utf-8">
<title>Issue 122 index-path fixture</title>
<style>
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;width:1024px;height:576px}
</style>
<script src="../stage-select-fallen-data.js"></script>
<script type="module">
const query=new URLSearchParams(location.search);
const cameraProfile=query.get('issue122Camera')||'current';
if(cameraProfile==='issue-time'){
  StageSelectFallenData.camera={
    gltfPosition:[-20.52314647300354,189.9752172455775,399.0858186660858],
    gltfTarget:[-11.240657892625123,22.526175937178454,14.021338389531051],
    horizontalSpan:262.9185290941067,
    maxSpan:600
  };
}else if(cameraProfile!=='current'){
  throw new Error('Invalid issue122Camera');
}
const state={ready:false,error:null,stats:null,cameraProfile};
window.Issue122Fixture=state;
try{
  const {createScene}=await import('../stage-select-fallen-scene.js');
  const scene=await createScene(StageSelectFallenData,()=>{},()=>{},()=>{},new AbortController().signal);
  document.body.appendChild(scene.canvas);
  scene.view.resize(1024,576);
  scene.view.overview(null,false);
  state.scene=scene;
  state.stats=()=>scene.stats();
  state.ready=true;
}catch(error){
  state.error=error&&error.stack||String(error);
  console.error(error);
}
</script>
