var PanelTooltip = {
  hide:function(){}, showAtMouse:function(){}, followMouse:function(){}, isVisible:function(){return false;},
  updateContent:function(){}, buildItemRichHtml:function(){return '';},
  // K-A：绑定记录版 mock——bindAsync 记录 {scope,node,opts,destroyed}，
  // releaseTree/dispose 走真实释放语义，供 tooltip 绑定与生命周期断言
  __records:[],
  releaseTree:function(root){
    var n=0;
    PanelTooltip.__records.forEach(function(r){
      if(!r.destroyed && r.node && (r.node===root || (root.contains && root.contains(r.node)))){ r.destroyed=true; n++; }
    });
    return n;
  },
  createScope:function(name){
    var scope={
      label:name, disposed:false, __records:[],
      isActive:function(){ return !this.disposed; },
      bindAsync:function(node, opts){
        if(scope.disposed) return {destroy:function(){ return false; }};
        var rec={scope:name, node:node, opts:opts||{}, destroyed:false};
        PanelTooltip.__records.push(rec);
        scope.__records.push(rec);
        return {destroy:function(){ rec.destroyed=true; return true; }};
      },
      bindAsyncHover:function(node, opts){ return scope.bindAsync(node, opts); },
      releaseTree:function(root){ return PanelTooltip.releaseTree(root); },
      dispose:function(){ scope.disposed=true; scope.__records.forEach(function(r){ r.destroyed=true; }); return true; }
    };
    return scope;
  },
  __bindingsFor:function(node){
    return PanelTooltip.__records.filter(function(r){ return r.node===node && !r.destroyed; });
  }
};

      if(this.dualBadge && resp.snapshot.pets.length>1) resp.snapshot.pets[1].stamina=0;

        {slotIndex:0,name:'佣兵甲',level:12,gender:'男',height:175,face:'男变装-基本脸型',hair:'发型-男式-黑韩式头',deployed:!this.mercDead[0]&&!!this.mercDeploy[0],dead:!!this.mercDead[0],equips:midnightEquips(),skills:skills(13),personality:personality()},

      if(this.manyMercs){
        mercList.push({slotIndex:3,name:'佣兵丁',level:44,gender:'女',height:168,face:'女变装-基本脸型',hair:'发型-女式-白长发',deployed:false,dead:false,equips:equips(),skills:skills(3),personality:personality()});
        mercList.push({slotIndex:4,name:'佣兵戊',level:51,gender:'男',height:177,face:'男变装-基本脸型',hair:'发型-男式-黑短发',deployed:false,dead:false,equips:equips(),skills:skills(2),personality:personality()});

    if(msg.panel === 'mercs' && msg.cmd === 'dismiss'){ this.lastDismiss=msg; resp.mercName='佣兵甲'; }
    if(msg.panel === 'mercs' && msg.cmd === 'hire'){
      this.lastHire=msg; resp.mercName='雇佣候选'; resp.goldRemaining=994999; resp.kpointRemaining=799;
    }
    if(msg.panel === 'mercs' && msg.cmd === 'hire_list'){
      this.lastHireList=msg;
      // minLevel 跳页请求单独记录：锚定滚动触发的触底续载会覆盖 lastHireList
      if(msg.minLevel>0) this.lastMinLevelJump=msg;
      // H2 QA：空池场景（emptyHirePool 标志位）——首包真返回空池
      if(this.emptyHirePool){
        resp.hireList={page:1,totalPages:1,totalCount:0,maxLevel:0,hireable:[]};
      }else{
      // 升序佣兵池 + minLevel 页跳转（与 AS2 handleHireList 同构）
      var perPage=6, page=msg.page||1;
      if(msg.minLevel>0){
        var j=HIRE_POOL.length;
        for(var hi=0;hi<HIRE_POOL.length;hi++){ if(HIRE_POOL[hi].level>=msg.minLevel){ j=hi; break; } }
        page=Math.floor(j/perPage)+1;
      }
      var totalPages=Math.max(1,Math.ceil(HIRE_POOL.length/perPage));
      if(page>totalPages)page=totalPages;
      resp.hireList={page:page,totalPages:totalPages,totalCount:HIRE_POOL.length,
        maxLevel:HIRE_POOL[HIRE_POOL.length-1].level,
        hireable:HIRE_POOL.slice((page-1)*perPage,page*perPage)};
      }
    }
    // 世界内雇佣确认：world_hire(panel=mercs)/world_adopt(panel=pets) → hired:true（镜像 AS2 handleWorldHire/Adopt）
    if(msg.cmd === 'world_hire' || msg.cmd === 'world_adopt'){
      this.lastWorldHire=msg; resp.hired=true;
      if(msg.cmd === 'world_adopt') resp.refreshDeferred=true;
    }
    if(msg.panel==='pets' && this.petUnknownResponseCmd===msg.cmd){
      this.petUnknownResponseCmd='';
      resp.success=false;
      resp.error=this.petUnknownResponseError||'delivery_unknown';
    }
    if(msg.panel==='pets' && this.petDropResponseCmd===msg.cmd){
      this.petDropResponseCmd='';
      this.lastDroppedPetResponse=resp;
      return true;
    }
    if(msg.panel==='pets' && msg.cmd==='snapshot' && this.holdPetSnapshotCount>0){
      this.holdPetSnapshotCount--;
      this.heldPetSnapshots.push(resp);
      return true;
    }
    if(msg.panel==='mercs' && this.mercDropResponseCmd===msg.cmd){
      this.mercDropResponseCmd='';
      this.lastDroppedMercResponse=resp;
      return true;
    }
    if(msg.panel==='mercs' && msg.cmd==='snapshot' && this.holdMercSnapshotCount>0){
      this.holdMercSnapshotCount--;
      this.heldMercSnapshots.push(resp);
      return true;
    }
    // pet_lib 首次请求刻意放慢：给 QA 留出「数据未就绪」的确定性断言窗口
    var delay=(msg.panel==='pets' && msg.cmd==='pet_lib')?60:5;
    setTimeout(function(){ emit('panel_resp',resp); },delay);
    return true;
  }
};

    function alphaOfColor(str){
      // 兼容 rgba(r,g,b,a) 与 color(srgb r g b / a) 两种 computed 序列化
      var m=String(str||'').match(/rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*,\s*([\d.]+)\s*\)/);
      if(m) return parseFloat(m[1]);
      var c=String(str||'').match(/color\(srgb\s+[\d.]+\s+[\d.]+\s+[\d.]+\s*\/\s*([\d.]+)\s*\)/);
      if(c) return parseFloat(c[1]);
      return 1;
    }
    function rgbOf(str){
      // 兼容 color(srgb r g b / a)（0..1 浮点）与 rgb()/rgba()（0..255）两种 computed 序列化
      var s=String(str||'');
      var c=s.match(/color\(srgb\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)/);
      if(c) return [parseFloat(c[1]),parseFloat(c[2]),parseFloat(c[3])];
      var m=s.match(/rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
      if(m) return [parseFloat(m[1])/255,parseFloat(m[2])/255,parseFloat(m[3])/255];
      return null;
    }
    function layerAlpha(bgImg, fromEnd){
      // background-image 首层（fromEnd=false）或末层（true）第一个颜色 stop 的 alpha
      var s=String(bgImg||'');
      var seg=s;
      if(fromEnd){
        var idx=Math.max(s.lastIndexOf('linear-gradient('),s.lastIndexOf('radial-gradient('));
        if(idx>=0) seg=s.slice(idx);
      }
      var m=seg.match(/rgba?\([^)]*\)|color\(srgb[^)]*\)/);
      return m?alphaOfColor(m[0]):1;
    }

      var before=MockHost.mercRequestCounts.deploy||0;
      document.querySelector('.team-merc-detail .team-merc-act-deploy').click();
      await waitFor(function(){ return !MercTeamController.isBusy() && mercReconcileActive() && MockHost.heldMercSnapshots.length===1; },2000);
      var after=MockHost.mercRequestCounts.deploy||0;
      document.querySelector('.team-merc-detail .team-merc-act-deploy').click(); await wait(20);
      var replayBlocked=(MockHost.mercRequestCounts.deploy||0)===after;
      MockHost.releaseMercSnapshot();
      await waitFor(function(){ return !mercReconcileActive(); },2000);
      assert(id,'Merc '+error+' 锁存后只读 fresh snapshot，不自动重放 toggle',
        after===before+1 && replayBlocked && !MercTeamController.isBusy() && !mercReconcileActive());
    }
    await exerciseMercHostUnknown('delivery_unknown','team-merc-reconcile-delivery');
    await exerciseMercHostUnknown('timeout','team-merc-reconcile-host-timeout');

    // success=true 仍不等于有效快照：缺 snapshot 与空对象都必须保持 latch，
    // 继续沿既有只读重试，直到 hiredMercs Array 的 fresh snapshot 到达。
    MockHost.mercResponseError='delivery_unknown';
    MockHost.mercMalformedSnapshotQueue=['missing','empty'];
    MockHost.holdMercSnapshotCount=3;
    var mercMalformedWriteBefore=MockHost.mercRequestCounts.deploy||0;
    document.querySelector('.team-merc-detail .team-merc-act-deploy').click();
    await waitFor(function(){ return mercReconcileActive() && MockHost.heldMercSnapshots.length===1; },2000);
    var mercMissingSnapshot=MockHost.releaseMercSnapshot();
    await wait(20);
    var mercMissingStayedLocked=mercReconcileActive();
    await waitFor(function(){ return MockHost.heldMercSnapshots.length===1; },2000);
    var mercEmptySnapshot=MockHost.releaseMercSnapshot();
    await wait(20);
    var mercEmptyStayedLocked=mercReconcileActive();
    await waitFor(function(){ return MockHost.heldMercSnapshots.length===1; },2000);
    var mercValidSnapshot=MockHost.releaseMercSnapshot();
    await waitFor(function(){ return !mercReconcileActive(); },2000);
    assert('team-merc-reconcile-malformed','Merc 对账拒绝 missing snapshot / 空对象；保持锁并只读重试至 hiredMercs Array 的 fresh snapshot',
      mercMissingSnapshot && mercMissingSnapshot.success===true &&
      !Object.prototype.hasOwnProperty.call(mercMissingSnapshot,'snapshot') &&
      mercEmptySnapshot && mercEmptySnapshot.success===true && mercEmptySnapshot.snapshot &&
      !Object.prototype.hasOwnProperty.call(mercEmptySnapshot.snapshot,'hiredMercs') &&
      mercValidSnapshot && mercValidSnapshot.snapshot && Array.isArray(mercValidSnapshot.snapshot.hiredMercs) &&
      mercMissingStayedLocked && mercEmptyStayedLocked && !mercReconcileActive() &&
      (MockHost.mercRequestCounts.deploy||0)===mercMalformedWriteBefore+1);

    // 对账 snapshot 若持续失败，锁只约束写入，不能复用 operation busy 把 close/tab 一并锁死。
    // close 后 latch 保留；replacement 自己的有效 snapshot 才能解开。
    MockHost.mercResponseError='delivery_unknown';
    MockHost.failMercSnapshot=true;
    var mercFailCloseWriteBefore=MockHost.mercRequestCounts.deploy||0;
    var mercFailCloseButton=document.querySelector('.team-merc-detail .team-merc-act-deploy');
    mercFailCloseButton.click();
    await waitFor(function(){
      return !MercTeamController.isBusy() && mercReconcileActive() &&
        !!document.querySelector('.team-merc-grid .workbench-empty-state[data-empty-kind="error"]');
    },2000);
    var mercFailCloseWriteAfter=MockHost.mercRequestCounts.deploy||0;
    mercFailCloseButton.click(); await wait(20);
    var mercFailCloseReplayBlocked=(MockHost.mercRequestCounts.deploy||0)===mercFailCloseWriteAfter;
    var mercFailCloseCountBefore=MockHost.closeCount;
    var mercFailCloseAccepted=TeamPanelHost.requestClose();
    await waitFor(function(){ return !Panels.isOpen(); },2000);
    var mercFailClosed=!Panels.isOpen() && MockHost.closeCount===mercFailCloseCountBefore+1;
    MockHost.failMercSnapshot=false;
    Panels.open('team',{initialTab:'mercenary',panelInstanceId:'panel.team.harness.merc-reconcile-c'});
    await waitFor(function(){
      return document.querySelectorAll('.team-merc-child .team-merc-card').length===3 &&
        !mercReconcileActive();
    },3000);
    assert('team-merc-reconcile-close','Merc 对账 snapshot 持续失败仍可 exact close；replacement fresh snapshot 解锁且不重放写',
      mercFailCloseWriteAfter===mercFailCloseWriteBefore+1 && mercFailCloseReplayBlocked &&
      mercFailCloseAccepted===true && mercFailClosed && !MercTeamController.isBusy() &&
      !mercReconcileActive(),
      'writeDelta='+(mercFailCloseWriteAfter-mercFailCloseWriteBefore)+
      ', closeDelta='+(MockHost.closeCount-mercFailCloseCountBefore));
    Panels.close(); await wait(20);

    // 未知世界雇佣完成 fresh 对账后，触发该 epoch 的候选在 controller 与 Team 外层都失效；
    // 切 tab 不得由 candidateFor() 再注入，也不得重放权威写。
    Panels.open('team',{view:'hire',kind:'merc',initialTab:'mercenary',
      panelInstanceId:'panel.team.harness.merc-world-reconcile',detail:{
        kind:'merc',slotIndex:-1,name:'待对账佣兵',level:14,gender:'男',height:175,
        face:'男变装-基本脸型',hair:'发型-男式-黑韩式头',equips:equips(),skills:skills(4),
        personality:personality(),goldPrice:8000,kPrice:0,levelGap:false}});
    await waitFor(function(){
      return !!document.querySelector('.team-merc-card-candidate') &&
        !!document.querySelector('.team-merc-detail .team-merc-act-recruit');
    },2000);
    var mercWorldWriteBefore=MockHost.mercRequestCounts.world_hire||0;
    MockHost.mercDropResponseCmd='world_hire';
    MockHost.holdMercSnapshotCount=1;
    document.querySelector('.team-merc-detail .team-merc-act-recruit').click();
    await waitFor(function(){ return !MercTeamController.isBusy() && mercReconcileActive() && MockHost.heldMercSnapshots.length===1; },2000);
    var mercWorldWriteAfter=MockHost.mercRequestCounts.world_hire||0;
    MockHost.releaseMercSnapshot();
    await waitFor(function(){ return !mercReconcileActive() && !document.querySelector('.team-merc-card-candidate'); },2000);
    var mercWorldControllerConsumed=!document.querySelector('.team-merc-card-candidate');
    click('partner');
    await waitFor(function(){ return !!document.querySelector('.team-pet-child .team-pet-card'); },2000);
    click('mercenary');
    await waitFor(function(){ return !!document.querySelector('.team-merc-child .team-merc-card'); },2000);
    var mercWorldOuterConsumed=!document.querySelector('.team-merc-card-candidate');
    assert('team-merc-world-reconcile-candidate','Merc unknown world_hire fresh 对账后 exact 消费 controller/Team 候选，切 tab 不复活且写只发一次',
      mercWorldWriteAfter===mercWorldWriteBefore+1 && mercWorldControllerConsumed &&
      mercWorldOuterConsumed && (MockHost.mercRequestCounts.world_hire||0)===mercWorldWriteAfter);
    Panels.close(); await wait(20);

    // Pet 使用同一 Team exact-reference helper；world_adopt 的旧候选也只在 fresh snapshot 后消费。
    Panels.open('team',{view:'hire',kind:'pet',initialTab:'partner',
      panelInstanceId:'panel.team.harness.pet-world-reconcile',detail:{
        kind:'pet',petId:1,name:'待对账战宠',level:8,goldPrice:3000}});
    await waitFor(function(){
      return !!document.querySelector('.team-pet-card-candidate') &&
        !!document.querySelector('.team-pet-detail .team-act-recruit');
    },2000);
    var petWorldWriteBefore=MockHost.petRequestCounts.world_adopt||0;
    MockHost.petDropResponseCmd='world_adopt';
    MockHost.holdPetSnapshotCount=1;
    document.querySelector('.team-pet-detail .team-act-recruit').click();
    await waitFor(function(){ return window.PetPanel.getState().reconcileRequired===true && MockHost.heldPetSnapshots.length===1; },2000);
    var petWorldWriteAfter=MockHost.petRequestCounts.world_adopt||0;
    MockHost.releasePetSnapshot();
    await waitFor(function(){
      return window.PetPanel.getState().reconcileRequired===false &&
        !document.querySelector('.team-pet-card-candidate');
    },2000);
    var petWorldControllerConsumed=!document.querySelector('.team-pet-card-candidate');
    click('mercenary');
    await waitFor(function(){ return !!document.querySelector('.team-merc-child .team-merc-card'); },2000);
    click('partner');
    await waitFor(function(){ return !!document.querySelector('.team-pet-child .team-pet-card'); },2000);
    var petWorldOuterConsumed=!document.querySelector('.team-pet-card-candidate');
    assert('team-pet-world-reconcile-candidate','Pet unknown world_adopt fresh 对账后复用 exact helper 清退外层候选，切 tab 不复活且写只发一次',
      petWorldWriteAfter===petWorldWriteBefore+1 && petWorldControllerConsumed &&
      petWorldOuterConsumed && (MockHost.petRequestCounts.world_adopt||0)===petWorldWriteAfter);
    Panels.close(); await wait(20);

    // exact close 已投递但 Host ack 丢失时不能永久锁死：短化生产 3s 门后恢复重试，
    // 第二次同实例 exact close 由 Host 确认；期间绝不本地关闭。
    Panels.open('team',{initialTab:'partner',panelInstanceId:'panel.team.harness.close-retry'});
    await wait(60);
    MockHost.dropNextTeamCloseAck=true;
    var closeBefore=MockHost.closeCount;
    var firstCloseAccepted=TeamPanelHost.requestClose();
    await wait(120);
    var remainedOpen=Panels.isOpen() && Panels.getActive()==='team';
    var retryUnlocked=toastHas('尚未确认关闭，可再次尝试');
    var secondCloseAccepted=TeamPanelHost.requestClose();
    await wait(40);
    assert('team-close-retry','Team exact close ack 丢失：超时只恢复可重试，第二次确认后关闭',
      firstCloseAccepted===true && remainedOpen && retryUnlocked && secondCloseAccepted===true &&
      MockHost.closeCount===closeBefore+2 && MockHost.lastTeamClose &&
      MockHost.lastTeamClose.panelInstanceId==='panel.team.harness.close-retry' && !Panels.isOpen(),
      'openAfterTimeout='+remainedOpen+', closeDelta='+(MockHost.closeCount-closeBefore));
    var failed=results.filter(function(x){return !x.pass;}).length;
    window.__qaResult={qa:{total:results.length,passed:results.length-failed,failed:failed,results:results}};
    document.getElementById('qa').textContent=(results.length-failed)+'/'+results.length+' passed';
  })();
})();
</script>
</body>
