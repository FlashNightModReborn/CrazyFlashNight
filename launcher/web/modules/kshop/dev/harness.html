<script>
(function() {
    'use strict';
    var listeners = {};
    window.Bridge = {
        on: function(type, callback) { (listeners[type] || (listeners[type] = [])).push(callback); },
        off: function(type, callback) {
            var list = listeners[type] || [];
            var index = list.indexOf(callback);
            if (index >= 0) list.splice(index, 1);
        },
        send: function(message) { window.KShopHarnessHost.handle(message); }
    };
    window.__emitBridge = function(type, data) {
        var list = (listeners[type] || []).slice();
        for (var i = 0; i < list.length; i++) list[i](data);
    };
})();

window.__KSHOP_RUNTIME_CONFIG__ = {
    sessionNonce: 'harness',
    requestTimeoutMs: 220,
    cartSaveDebounceMs: 45,
    dragTimeoutMs: 120
};
window.Notch = { reportRect: function() {} };
window.Toast = { messages: [], add: function(message) { this.messages.push(String(message)); } };
window.BootstrapAudio = {
    playSelect:function(){}, playConfirm:function(){}, playSuccess:function(){}, playError:function(){},
    playCancel:function(){}, playClick:function(){}, playModalOpen:function(){}
};
if (new URLSearchParams(location.search).get('visual') !== 'battlebox-real-icons') window.PanelTooltip = {
    visible:false,
    lastRichOptions:null,
    showAtMouse:function(){ this.visible=true; }, showAnchored:function(){ this.visible=true; }, followMouse:function(){}, hide:function(){ this.visible=false; },
    isVisible:function(){ return this.visible; }, updateContent:function(){}, inferLayoutType:function(){ return 'narrow'; },
    dynamicIconHtml:function(name){ return Icons.html(name,'tooltip-rich-icon'); },
    staticIconUrl:function(){ return null; },
    buildItemRichHtml:function(options){ this.lastRichOptions=options || {}; return '<div>'+(options && options.iconHtml || '')+'detail</div>'; },
    bindAsyncHover:function(node, options){
        var cache = options.cache || {};
        function resolveKey(e){
            if (typeof options.key === 'function') return String(options.key(e, node) || '');
            return String(options.key);
        }
        function onEnter(e){
            if (typeof options.isSuppressed === 'function' && options.isSuppressed(e)) return;
            var key = resolveKey(e);
            var item = options.item;
            var html = cache[key] && options.renderRich ? options.renderRich(item, cache[key]) : options.renderBasic(item);
            PanelTooltip.showAtMouse(html, e);
            if (cache[key] || typeof options.fetch !== 'function') return;
            options.fetch(item, function(response){
                if (!response || response.success !== true) return;
                cache[key] = response;
                if (PanelTooltip.isVisible()) PanelTooltip.updateContent(options.renderRich(item, response));
            });
        }
        function onMove(e){ PanelTooltip.followMouse(e); }
        function onLeave(){ PanelTooltip.hide(); }
        node.addEventListener('mouseenter', onEnter);
        node.addEventListener('mousemove', onMove);
        node.addEventListener('mouseleave', onLeave);
    }
};
if (new URLSearchParams(location.search).get('visual') !== 'battlebox-real-icons') window.Icons = {
    loaded:false,
    loadCalls:0,
    deferMs:0,
    load:function(callback){
        var self=this;
        this.loadCalls += 1;
        if (this.loaded) { if (callback) callback(); return; }
        var finish=function(){ self.loaded=true; if (callback) callback(); };
        if (this.deferMs > 0) setTimeout(finish,this.deferMs); else finish();
    },
    html:function(name, cls){
        if (!this.loaded) return '';
        return '<span class="'+(cls || 'kshop-icon')+'" data-icon="'+String(name)+'"></span>';
    }
};
if (window.Icons && typeof window.Icons.deferMs === 'number') window.Icons.deferMs = 35;
</script>

    function wait(ms) { return new Promise(function(resolve) { setTimeout(resolve, ms); }); }
    async function waitFor(predicate, timeout) {
        var started = Date.now();
        while (Date.now() - started < timeout) {
            if (predicate()) return true;
            await wait(10);
        }
        return !!predicate();
    }
    function countCmd(cmd) {
        return Host.sent.filter(function(message) { return message.cmd === cmd; }).length;

        click('#kshop-checkout');
        await waitFor(function(){
            var button=document.querySelector('[data-kshop-settlement-commit]');

        return click('[data-kshop-settlement-commit]');

    function dispatchPointer(target, type, pointerId, x, y) {
        var event = new PointerEvent(type, {
            bubbles:true, cancelable:true, pointerId:pointerId, pointerType:'mouse',
            isPrimary:true, button:type === 'pointerdown' ? 0 : -1, buttons:type === 'pointerup' ? 0 : 1,

    var BASE_CATALOG = [
        {idx:0,id:'w0',item:'测试手枪',type:'训练军备',price:30,displayname:'测试手枪',majorType:'武器',use:'手枪',weaponType:'手枪',subType:'手枪',setId:'training_weapon',setName:'训练武器套装',level:1,icon:'图标-测试手枪'},

            this.state = {

                cart: [],
                purchased: clone(BASE_PURCHASED),
                kpoints: 500,
                playerLevel: 20,
                reverseLevel: 0,
                purchasedToken: 'shop.harness.1',
                inventory: {背包:new Array(50),仓库:new Array(1200),战备箱:new Array(400)}
            };
            this.state.inventory.背包[0] = {name:'背包药剂',displayName:'背包药剂',icon:'背包药剂',majorType:'消耗品',use:'药剂',itemKind:'stack',quantity:2};
            this.state.inventory.背包[1] = {
                name:'吉他喷火器',displayName:'烈火吉他',icon:'吉他喷火器',majorType:'武器',use:'长枪',itemKind:'equipment',quantity:1,
                enhancementLevel:13,maxEnhancementLevel:13,isMaxEnhancement:true,
                tierSlotAvailable:true,tierSlotUsed:false,modSlotCapacity:3,modSlotUsed:2,
                modSlots:[
                    {name:'脉冲式惯性阻尼器',grade:'medium',gradeLabel:'中等',gradeColor:'#996600',role:'precision',roleLabel:'精准与操控',symbol:'triangle-outline'},
                    {name:'成长的勋章',grade:'special',gradeLabel:'特殊',gradeColor:'#FFFF00',role:'mechanism',roleLabel:'特殊机制',symbol:'star-solid'}
                ]
            };
            this.state.inventory.背包[2] = {name:'背包药剂',displayName:'背包药剂',icon:'背包药剂',majorType:'消耗品',use:'药剂',itemKind:'stack',quantity:3};
            this.state.inventory.背包[4] = {name:'大宗弹药',displayName:'大宗弹药',icon:'大宗弹药',majorType:'收集品',use:'材料',itemKind:'stack',quantity:84286};
            this.state.inventory.仓库[0] = {name:'背包药剂',displayName:'背包药剂',icon:'背包药剂',majorType:'消耗品',use:'药剂',itemKind:'stack',quantity:4};
            this.state.inventory.仓库[2] = {
                name:'仓库装备',displayName:'仓库装备',icon:'仓库装备',majorType:'防具',use:'上装装备',itemKind:'equipment',quantity:1,
                enhancementLevel:7,maxEnhancementLevel:13,isMaxEnhancement:false,
                tierSlotAvailable:true,tierSlotUsed:true,modSlotCapacity:3,modSlotUsed:2,
                modSlots:[
                    {name:'螺丝套件',grade:'low',gradeLabel:'低级',gradeColor:'#006600',role:'firepower',roleLabel:'火力',symbol:'triangle-solid'},
                    {name:'传动装置',grade:'high',gradeLabel:'高等',gradeColor:'#0099FF',role:'sustain',roleLabel:'续航',symbol:'circle-outline'}
                ]
            };
            this.state.inventory.仓库[50] = {name:'Zulu仓储件',displayName:'Zulu仓储件',icon:'Zulu仓储件',majorType:'防具',use:'头部装备',itemKind:'equipment',quantity:1};
            this.state.inventory.仓库[51] = {name:'Alpha仓储件',displayName:'Alpha仓储件',icon:'Alpha仓储件',majorType:'收集品',use:'材料',itemKind:'stack',quantity:9};
            this.state.inventory.仓库[1199] = {name:'末页校验件',displayName:'末页校验件',icon:'末页校验件',majorType:'武器',use:'刀',itemKind:'equipment',quantity:1};
            this.state.inventory.战备箱[0] = {name:'背包药剂',displayName:'背包药剂',icon:'背包药剂',majorType:'消耗品',use:'药剂',itemKind:'stack',quantity:4};
            this.state.inventory.战备箱[2] = {
                name:'镜之虎彻',displayName:'镜之虎彻',icon:'镜之虎彻',majorType:'武器',use:'刀',setId:'training_blades',setName:'训练刀具套装',itemKind:'equipment',quantity:1,
                enhancementLevel:13,maxEnhancementLevel:13,isMaxEnhancement:true,
                tierSlotAvailable:true,tierSlotUsed:true,modSlotCapacity:3,modSlotUsed:2,
                modSlots:[
                    {name:'螺丝套件',grade:'low',gradeLabel:'低级',gradeColor:'#006600',role:'firepower',roleLabel:'火力',symbol:'triangle-solid'},
                    {name:'传动装置',grade:'high',gradeLabel:'高等',gradeColor:'#0099FF',role:'sustain',roleLabel:'续航',symbol:'circle-outline'}
                ]
            };
            this.state.inventory.战备箱[40] = {name:'Zulu战备件',displayName:'Zulu战备件',icon:'Zulu战备件',majorType:'防具',use:'头部装备',itemKind:'equipment',quantity:1};
            this.state.inventory.战备箱[41] = {name:'Alpha战备件',displayName:'Alpha战备件',icon:'Alpha战备件',majorType:'收集品',use:'材料',itemKind:'stack',quantity:9};
            this.state.inventory.战备箱[120] = {name:'远页战备刀',displayName:'远页战备刀',icon:'远页战备刀',majorType:'武器',use:'长枪',setId:'training_blades',setName:'训练刀具套装',itemKind:'equipment',quantity:1};
            this.state.inventory.战备箱[239] = {name:'末页战备件',displayName:'末页战备件',icon:'末页战备件',majorType:'武器',use:'刀',itemKind:'equipment',quantity:1};
            this.state.inventory.战备箱[300] = {name:'锁定保留件',displayName:'锁定保留件',icon:'锁定保留件',majorType:'收集品',use:'材料',itemKind:'stack',quantity:7};
            Toast.messages = [];
        },

        rotatePurchasedToken: function() {
            var next = Number(this.state.purchasedToken.split('.').pop()) + 1;
            this.state.purchasedToken = 'shop.harness.' + next;
            return this.state.purchasedToken;
        },

        itemMatchesFilter: function(item, filterKey) {
            if (!item || filterKey === 'all') return !!item;
            var type = String(item.majorType || '');
            var use = String(item.use || '');
            if (filterKey === 'weapon') return type === '武器';
            if (filterKey === 'armor') return type === '防具';
            if (filterKey === 'consumable') return type === '消耗品';
            if (filterKey === 'material') return type === '材料' || (type === '收集品' && use === '材料');
            return type !== '武器' && type !== '防具' && type !== '消耗品'
                && type !== '材料' && !(type === '收集品' && use === '材料');
        },

        inventoryFacetTree: function(items, accessibleCapacity) {
            var occupied = [];
            for (var i=0; i<accessibleCapacity; i++) if (items[i]) occupied.push(items[i]);
            return ItemFilter.build(occupied, function(item){ return ItemFilter.catalogPath(item); });
        },

        inventorySetTree: function(items, accessibleCapacity) {
            var occupied = [];
            for (var i=0; i<accessibleCapacity; i++) if (items[i]) occupied.push(items[i]);
            return ItemFilter.buildSetTree(occupied);
        },

        itemMatchesFilterSpec: function(item, filterSpec) {
            if (!item || !filterSpec) return !!item;
            if (filterSpec.branch === 'set') return !!item.setId
                && (!filterSpec.setId || String(item.setId) === String(filterSpec.setId));
            var path = InventoryUI.filterPathFromSpec(filterSpec, 'all');
            return ItemFilter.matchesPath(item, path, function(entry){ return ItemFilter.catalogPath(entry); });
        },

        snapshotFor: function(request) {
            var containerId = String(request.containerId);
            var items = this.state.inventory[containerId];
            var offset = Number(request.offset);
            var limit = Number(request.limit);
            var filterKey = String(request.filterKey || 'all');
            var filterSpec = request.filterSpec ? clone(request.filterSpec) : null;
            var accessibleCapacity = containerId === '战备箱' ? this.battleboxAccessibleCapacity : items.length;
            var physicalSlots = [];
            if (filterSpec && filterSpec.major !== 'all') {
                for (var structuredPhysical=0; structuredPhysical<accessibleCapacity; structuredPhysical++) {
                    if (items[structuredPhysical] && this.itemMatchesFilterSpec(items[structuredPhysical],filterSpec)) physicalSlots.push(structuredPhysical);
                }
            } else if (filterKey === 'all') {
                for (var physical=0; physical<accessibleCapacity; physical++) physicalSlots.push(physical);
            } else {
                for (physical=0; physical<accessibleCapacity; physical++) {
                    if (items[physical] && this.itemMatchesFilter(items[physical],filterKey)) physicalSlots.push(physical);
                }
            }
            var facetTree = this.inventoryFacetTree(items, accessibleCapacity);
            var setTree = this.inventorySetTree(items, accessibleCapacity);
            var viewCapacity = physicalSlots.length;
            if (viewCapacity <= 0) offset = 0;
            else if (offset >= viewCapacity) offset = Math.floor((viewCapacity-1)/limit)*limit;
            var slots = [];
            for (var viewIndex=offset; viewIndex<Math.min(viewCapacity,offset+limit); viewIndex++) {
                var slot=physicalSlots[viewIndex];
                this.leaseSeq += 1;
                var token = 'invh.' + this.inventorySession + '.' + this.leaseSeq;
                var item = items[slot] || null;
                this.leases[containerId + ':' + slot] = {token:token,item:item,quantity:item ? item.quantity : 0};
                var entry = {physicalSlot:slot,occupied:!!item,slotLease:token};
                if (item) {
                    entry.item = clone(item);
                    entry.confirmProjection = {
                        itemKind:item.itemKind,displayName:item.displayName,quantity:item.quantity,
                        enhancementLevel:item.enhancementLevel || 0,rarity:item.rarity || ''
                    };
                }
                slots.push(entry);
            }
            this.inventorySnapshotSeq += 1;
            var snapshot = {containerId:containerId,capacity:items.length,accessibleCapacity:accessibleCapacity,
                viewCapacity:viewCapacity,filterKey:filterKey,
                filterFacets:facetTree.children,filterItemCount:facetTree.count,
                setFacets:setTree.children,setFilterItemCount:setTree.count,
                pageSizeHint:containerId === '战备箱' ? 40 : 50,locked:accessibleCapacity <= 0,
                snapshotSeq:this.inventorySnapshotSeq,containerEpoch:this.inventoryEpochs[containerId] || 1,
                offset:offset,limit:slots.length,slots:slots};
            if (filterSpec) snapshot.filterSpec = filterSpec;
            return snapshot;
        },

        inventorySnapshots: function(requests, rotate) {
            if (rotate) { this.inventorySession += 1; this.leases = {}; }
            return (requests || [
                {containerId:'背包',offset:0,limit:50},{containerId:'战备箱',offset:0,limit:40}
            ]).map(this.snapshotFor.bind(this));
        },

        open: async function() {
            if (Panels.getActive && Panels.getActive()) Panels.close();
            this.reset();
            Panels.open('kshop');
            await waitFor(function() {
                var loading = document.querySelector('#kshop-loading');
                return Host.sent.some(function(message){ return message.cmd === 'bulkQuery'; })
                    && loading && loading.style.display === 'none'
                    && document.querySelectorAll('.kshop-card').length >= 2
                    && KShop.debugState().inventory.ready;
            }, 1000);
        },

        openWorkbench: async function(accessibleCapacity, profile) {
            if (Panels.getActive && Panels.getActive()) Panels.close();
            this.reset();
            this.battleboxAccessibleCapacity = Number(accessibleCapacity);
            var normalizedProfile = profile === 'warehouse' ? 'warehouse' : 'battlebox';
            Panels.open('workbench', {
                mode:'runtime', profile:normalizedProfile, view:'storage',
                panelInstanceId:normalizedProfile === 'battlebox'
                    ? 'panel.harness.tuning-entry' : 'panel.harness.storage'
            });
            await waitFor(function() {
                return Panels.getActive() === 'workbench'
                    && InventoryWorkbench.debugState().coordinator.ready;
            }, 1000);
        },

        respond: function(request, response, delay) {
            response.type = 'panel_resp';
            response.callId = request.callId;
            if (request.domain) { response.domain = request.domain; response.cmd = request.cmd; }
            setTimeout(function() { window.__emitBridge('panel_resp', response); }, delay || 0);
        },

        handle: function(message) {
            this.sent.push(clone(message));
            if (message.cmd === 'close') { this.closeCount += 1; return; }
            var delay = Number(this.delays[message.cmd]) || 0;
            if (message.domain === 'inventory') {
                var payload = message.payload || {};
                if (message.cmd === 'snapshot') {
                    this.respond(message, {success:true,v:1,snapshots:this.inventorySnapshots(payload.requests,true)}, delay);
                    return;
                }
                if (message.cmd === 'tooltip') {
                    var tooltipSource = payload.source || {};
                    var tooltipLease = this.leases[tooltipSource.containerId + ':' + tooltipSource.slot];
                    if (!tooltipLease || tooltipLease.token !== tooltipSource.expectedLease || !tooltipLease.item) {
                        this.respond(message, {success:false,error:'stale_state'}, delay);
                    } else {
                        this.lastTooltipDescHTML = '<FONT COLOR="#FF00FF">库存实例注释</FONT>'.split('"').join("'");
                        this.respond(message, {
                            success:true,v:1,itemName:tooltipLease.item.name,
                            displayname:tooltipLease.item.displayName,iconName:tooltipLease.item.icon,
                            itemType:tooltipLease.item.majorType || tooltipLease.item.itemKind,
                            introHTML:'<b>' + tooltipLease.item.displayName + '</b>',
                            descHTML:this.lastTooltipDescHTML
                        }, delay);
                    }
                    return;
                }
                if (message.cmd === 'sortAndMerge') {
                    var container = payload.container || {};
                    var methodName = String(payload.methodName || '');
                    var allowed = {byType:1,byUse:1,byPrice:1,byLevel:1,byID:1,byName:1,byValue:1,byTime:1};
                    var sortContainerId = String(container.containerId || '');
                    if (!this.state.inventory[sortContainerId]) {
                        this.respond(message, {success:false,error:'sort_forbidden'}, delay);
                        return;
                    }
                    if (!allowed[methodName]) {
                        this.respond(message, {success:false,error:'unsupported_sort_method'}, delay);
                        return;
                    }
                    var inventory = this.state.inventory[sortContainerId];
                    var sortCapacity = sortContainerId === '战备箱' ? this.battleboxAccessibleCapacity : inventory.length;
                    if (sortCapacity <= 0) {

                    var stackIndex = {};
                    var merged = [];

                            else { stackIndex[item.name] = merged.length; merged.push(item); }
                        } else merged.push(item);
                    });
                    if (methodName === 'byName') merged.sort(function(a,b){ return String(a.displayName).localeCompare(String(b.displayName),'zh-CN'); });
                    else if (methodName === 'byValue') merged.sort(function(a,b){ return Number(b.quantity || 1)-Number(a.quantity || 1); });
                    for (var clearIndex=0; clearIndex<sortCapacity; clearIndex++) inventory[clearIndex] = null;
                    for (var mi=0; mi<merged.length; mi++) inventory[mi] = merged[mi];
                    Object.keys(this.leases).forEach(function(key){ if (key.indexOf(sortContainerId + ':') === 0) delete Host.leases[key]; });
                    this.inventoryEpochs[sortContainerId] += 1;

                        sortedCapacity:sortCapacity,snapshots:this.inventorySnapshots([{
                            containerId:sortContainerId,offset:Number(container.offset),limit:Number(container.limit),
                            filterKey:String(container.filterKey || 'all')
                        }],false)}, delay);

                            && (autoTargetContainerId === '仓库' || autoTargetContainerId === '战备箱'))
                        || (autoTargetContainerId === '背包'
                            && (autoSource.containerId === '仓库' || autoSource.containerId === '战备箱'));
                    if (!autoSourceLease || autoSourceLease.token !== autoSource.expectedLease || !autoSourceLease.item) {
                        this.respond(message, {success:false,error:'stale_state'}, delay);
                        return;
                    }

                        this.nextAutoTransferError = null;

                        return;
                    }

                        this.respond(message, {success:false,error:'transfer_forbidden'}, delay);
                        return;

                    var autoTargetItems = this.state.inventory[autoTargetContainerId];
                    var autoCapacity = autoTargetContainerId === '战备箱'

                        this.respond(message, {success:false,error:'slot_locked'}, delay);
                        return;

                    var autoFirstEmpty = -1;

                        } else if (autoSourceItem.itemKind === 'stack' && autoCandidate.itemKind === 'stack'

                            autoTargetSlot = autoSlot;
                            break;
                        }

                            this.respond(message, {success:false,error:'target_full'}, delay);
                            return;

                        autoTargetSlot = autoFirstEmpty;

                        destination:{containerId:autoTargetContainerId,slot:autoTargetSlot},
                        snapshots:this.inventorySnapshots(payload.windows,false)}, delay);
                    return;

                var targetKey = target.containerId + ':' + target.slot;

                    this.respond(message, {success:false,error:'same_slot'}, delay);
                    return;
                }

                var targetWindow = {containerId:target.containerId,offset:Math.floor(Number(target.slot)/targetPageSize)*targetPageSize,limit:targetPageSize};

                return;

        if (mode === 'modal' || mode === 'settlement') {
            click('#kshop-checkout');
            await waitFor(function(){ var button=document.querySelector('[data-kshop-settlement-commit]'); return button && !button.disabled; },500);
        }
        if (mode === 'inventory' || mode === 'inventory-pages' || mode === 'inventory-compact') {
            click('.workbench-mode-btn[data-mode="inventory"]');
            await wait(160);
            if (mode === 'inventory-compact') click('.item-grid-mode-option[data-layout-mode="compact"]');
            if (mode === 'inventory-pages') click('.inventory-page-jump');
        }
        window.__visualReady = true;
        document.getElementById('qa-status').style.display = 'none';
    }

    var visualMode = new URLSearchParams(location.search).get('visual');
    var execution = visualMode ? runVisualScenario(visualMode) : run();
    execution.catch(function(error) {
        window.__qaResult = {qa:{total:1,passed:0,failed:1,results:[{id:'fatal',title:'harness fatal',pass:false,detail:error && error.stack ? error.stack : String(error)}]}};
        document.getElementById('qa-status').textContent = 'fatal';
    });
})();
</script>
</body>
</html>
