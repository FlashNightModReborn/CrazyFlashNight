<script>
(function(nativeFetch) {
    'use strict';
    window.__characterBuild404Icon = '__qa_icon_404_fallback__';
    window.fetch = function(input, init) {
        return nativeFetch(input, init).then(function(response) {
            if (String(input).indexOf('icons/manifest.json') < 0) return response;
            return response.clone().json().then(function(manifest) {
                manifest[window.__characterBuild404Icon] = {
                    f1:'__qa_expected_asset_failure_icon_404__.png'
                };
                return new Response(JSON.stringify(manifest), {
                    status:200,
                    headers:{'Content-Type':'application/json'}
                });
            });
        });
    };
})(window.fetch.bind(window));

<script src="modules/character-build/dev/stats-fixture.js"></script>
<script>
(function() {
    'use strict';
    var handlers = {};
    var dressup = CharacterBuildDressupFixture;
    var absentIconName = window.__characterBuildAbsentIcon = '__qa_icon_absent_from_manifest__';
    var equipmentKeys = [
        '头部装备','上装装备','下装装备','手部装备','脚部装备','颈部装备',
        '长枪','手枪','手枪2','刀','手雷'
    ];
    var equipmentBySlot = {
        '头部装备':dressup.equipment.head,
        '上装装备':dressup.equipment.upper,
        '下装装备':dressup.equipment.lower,
        '手部装备':dressup.equipment.hands,
        '脚部装备':dressup.equipment.feet,
        '颈部装备':absentIconName,
        '长枪':dressup.equipment.longGun,
        '手枪':dressup.equipment.pistol,
        '手枪2':dressup.equipment.pistol,
        '刀':dressup.equipment.blade,
        '手雷':dressup.equipment.grenade
    };
    var enhancementBySlot = {};
    equipmentKeys.forEach(function(slotKey, index) {
        enhancementBySlot[slotKey] = slotKey === '手雷' ? 0 : index % 4 + 1;
    });
    var drugNames = ['普通hp药剂','普通mp药剂','抗生素',window.__characterBuild404Icon];
    var portraitGender = '男';
    window.__routeHarness = {
        sent:[],
        events:[],
        renderer:{created:0, active:0, maxActive:0, renders:0, destroyed:0, pixelRatios:[],
            lastMeta:null, lastBuild:null, failNextField:'', expectedAssetFailures:0},
        manifest:{attempts:0, firstRejected:false, retryResolved:false, toasts:[]},
        shots:{},
        storage:{activations:0, leaves:0, closes:0, active:false, view:'storage',
            externalBegins:0, externalCompletes:0, appliedSnapshots:0, busy:null},
        refuseNextCandidateSend:false,
        rejectNextCandidate:false,
        rejectNextSnapshot:false,
        rejectNextMutation:false,
        unknownNextMutation:false,
        holdNextSnapshot:false,
        heldSnapshot:null,
        holdNextReconcile:false,
        heldReconcile:null,
        pendingUnknownMutation:null,
        tuning:{
            rejectNextCommit:false,
            unknownNextCommit:false,
            holdNextReconcile:false,
            heldReconcile:null,
            rejectNextDetach:false,
            holdNextDetach:false,
            heldDetach:null,
            transaction:0
        },
        authority:{writeEpoch:0, loadoutRevision:5, liveRevision:5,
            drugRevision:3, liveRefreshDirty:false}
    };
    window.__routeHarness.setPortraitGender = function(gender) {
        portraitGender = gender === '女' ? '女' : '男';
    };
    window.__routeHarness.setEquipment = function(slotKey, itemName) {
        if (equipmentKeys.indexOf(slotKey) < 0) return false;
        equipmentBySlot[slotKey] = String(itemName || '');
        return true;
    };
    function emit(type, data) {
        (handlers[type] || []).slice().forEach(function(handler) { handler(data); });
    }
    function equipmentRows() {
        return equipmentKeys.map(function(slotKey, index) {
            var itemName = equipmentBySlot[slotKey];
            return {
                slotKey:slotKey,
                occupied:!!itemName,
                quantity:slotKey === '手雷' ? 3 : 1,
                disabled:false,
                item:itemName ? {
                    name:itemName,
                    displayName:itemName,
                    icon:itemName,
                    itemKind:slotKey === '手雷' ? 'stack' : 'equipment',
                    majorType:slotKey === '手雷' ? '消耗品'
                        : index < 6 ? '防具' : '武器',
                    use:slotKey === '手枪2' ? '手枪' : slotKey,
                    enhancementLevel:enhancementBySlot[slotKey],
                    quantity:slotKey === '手雷' ? 3 : 1,
                    tierSlotAvailable:slotKey === '长枪',
                    tierSlotUsed:slotKey === '长枪',
                    modSlotCapacity:slotKey === '长枪' ? 3 : 0,
                    modSlotUsed:slotKey === '长枪' ? 2 : 0,
                    modSlots:slotKey === '长枪' ? [
                        {name:'稳定导轨', grade:'high', gradeLabel:'高级',
                            gradeColor:'#0099FF', roleLabel:'结构与功能', symbol:'diamond-solid'},
                        {name:'战术镜片', grade:'special', gradeLabel:'特殊',
                            gradeColor:'#FFFF00', roleLabel:'瞄准辅助', symbol:'star-outline'}
                    ] : []
                } : null
            };
        });
    }
    function projection() {
        var portraitEquipment = {};
        equipmentKeys.forEach(function(key) { portraitEquipment[key] = equipmentBySlot[key]; });
        return {
            equipment:equipmentRows(),
            drugs:[0,1,2,3].map(function(slot) {
                return {
                    slot:slot,
                    occupied:!!drugNames[slot],
                    quantity:slot + 1,
                    disabled:false,
                    item:drugNames[slot] ? {
                        name:drugNames[slot],
                        displayName:drugNames[slot],
                        icon:drugNames[slot],
                        itemKind:'drug',
                        use:'药剂',
                        quantity:slot + 1
                    } : null
                };
            }),
            portrait:{
                gender:portraitGender,
                appearance:dressup.appearanceByGender[portraitGender],
                equipment:portraitEquipment
            },
            stateHealth:'ok',
            diagnostics:[]
        };
    }
    function fullBackpack(sequence) {
        return {
            containerId:'背包', capacity:50, accessibleCapacity:50, viewCapacity:50,
            filterKey:'all', pageSizeHint:50, locked:false,
            snapshotSeq:sequence, containerEpoch:4, containerVersion:sequence,
            offset:0, limit:50,
            slots:Array.from({length:50}, function(_, slot) {
                return {physicalSlot:slot, slotLease:'lease.after.' + sequence + '.' + slot,
                    occupied:false, item:null};
            })
        };
    }
    function applyMutation(message) {
        var authority = window.__routeHarness.authority;
        if (message.cmd === 'equipEquipment') {
            equipmentBySlot[message.payload.slotKey] =
                dressup.scenarios.candidate.candidateItem;
            authority.loadoutRevision++;
            authority.liveRefreshDirty = true;
        } else if (message.cmd === 'unequipEquipment') {
            equipmentBySlot[message.payload.slotKey] = '';
            authority.loadoutRevision++;
            authority.liveRefreshDirty = true;
        } else if (message.cmd === 'equipDrug') {
            drugNames[message.payload.drugSlot] = '普通hp药剂';
            authority.drugRevision++;
        } else if (message.cmd === 'unequipDrug') {
            drugNames[message.payload.drugSlot] = '';
            authority.drugRevision++;
        }
    }
    function responseBase(message) {
        var authority = window.__routeHarness.authority;
        return {
            type:'panel_resp',
            panel:'workbench',
            domain:'loadout',
            cmd:message.cmd,
            callId:message.callId,
            panelInstanceId:message.panelInstanceId,
            v:1,
            success:true,
            writeEpoch:authority.writeEpoch,
            sessionGeneration:17,
            loadoutRevision:authority.loadoutRevision,
            liveRevision:authority.liveRevision,
            drugRevision:authority.drugRevision,
            liveRefreshDirty:authority.liveRefreshDirty,
            active:message.cmd !== 'finalize'
        };
    }
    function loadoutResponse(message) {
        var harness = window.__routeHarness;
        var mutation = /^(equip|unequip)(Equipment|Drug)$/.test(message.cmd);
        if (mutation && harness.rejectNextMutation) {
            harness.rejectNextMutation = false;
            var rejected = responseBase(message);
            rejected.success = false;
            rejected.error = 'stale_source';
            return rejected;
        }
        if (mutation && harness.unknownNextMutation) {
            harness.unknownNextMutation = false;
            harness.authority.writeEpoch++;
            harness.pendingUnknownMutation = JSON.parse(JSON.stringify(message));
            var unknown = responseBase(message);
            unknown.success = false;
            unknown.error = 'delivery_unknown';
            unknown.requiresReconcile = true;
            unknown.reconcileAfterCallId = message.callId;
            return unknown;
        }
        if (mutation) {
            harness.authority.writeEpoch++;
            applyMutation(message);
        } else if (message.cmd === 'snapshot' && message.payload.reconcileAfterCallId
                && harness.pendingUnknownMutation) {
            applyMutation(harness.pendingUnknownMutation);
            harness.pendingUnknownMutation = null;
        } else if (message.cmd === 'flushLive' || message.cmd === 'finalize') {
            harness.authority.writeEpoch++;
            harness.authority.liveRevision = harness.authority.loadoutRevision;
            harness.authority.liveRefreshDirty = false;
        }
        var response = responseBase(message);
        if (message.cmd === 'snapshot' && window.__routeHarness.rejectNextSnapshot) {
            window.__routeHarness.rejectNextSnapshot = false;
            response.success = false;
            response.error = 'service_not_ready';
            response.active = false;
            response.sessionGeneration = 0;
            response.loadoutRevision = 0;
            response.liveRevision = 0;
            response.drugRevision = 0;
        } else if (message.cmd === 'snapshot') {
            response.payload = projection();
            if (message.payload.reconcileAfterCallId) {
                response.reconcileAfterCallId = message.payload.reconcileAfterCallId;
                response.inventorySnapshots = [
                    fullBackpack(20 + harness.authority.writeEpoch)
                ];
            }
        }
        else if (message.cmd === 'candidates') {
            if (window.__routeHarness.rejectNextCandidate) {
                window.__routeHarness.rejectNextCandidate = false;
                response.success = false;
                response.error = 'service_not_ready';
                return response;
            }
            var candidateName = message.payload.slotKey === '长枪'
                ? dressup.scenarios.candidate.candidateItem
                : equipmentBySlot[message.payload.slotKey] || drugNames[0];
            var stackGrenadeCandidate = message.payload.slotKey === '手雷';
            response.payload = {
                target:message.payload.slotKey
                    ? {kind:'equipment', slotKey:message.payload.slotKey}
                    : {kind:'drug', drugSlot:message.payload.drugSlot},
                candidates:[{
                    physicalSlot:9,
                    disabled:false,
                    source:{expectedLease:'lease.candidate.9'},
                    item:{
                        name:candidateName,
                        displayName:candidateName,
                        icon:candidateName,
                        itemKind:stackGrenadeCandidate ? 'stack' : 'equipment',
                        majorType:stackGrenadeCandidate ? '消耗品' : '武器',
                        use:message.payload.slotKey || '药剂',
                        enhancementLevel:stackGrenadeCandidate ? 0 : 1,
                        quantity:stackGrenadeCandidate ? 3 : 1,
                        tierSlotAvailable:true,
                        tierSlotUsed:false,
                        modSlotCapacity:2,
                        modSlotUsed:1,
                        modSlots:[{name:'候选稳定器', grade:'medium', gradeLabel:'中级',
                            gradeColor:'#996600', roleLabel:'结构与功能', symbol:'square-solid'}]
                    }
                }],
                backpackVersion:12,
                stateHealth:'ok',
                diagnostics:[]
            };
        } else if (message.cmd === 'statsSnapshot') {
            response.payload = CharacterBuildStatsFixture.create();
        } else if (mutation) {
            response.changed = true;
            response.operation = message.cmd;
            response.affectedBackpackSlot = message.payload.source
                ? message.payload.source.slot : 12;
            response.payload = projection();
            response.inventorySnapshots = [
                fullBackpack(20 + harness.authority.writeEpoch)
            ];
        } else if (message.cmd === 'flushLive') response.changed = true;
        else if (message.cmd === 'finalize') {
            response.closed = true;
            response.liveChanged = false;
            response.persistence = {success:true, changed:false};
        } else {
            response.success = false;
            response.error = 'unsupported_cmd';
        }
        return response;
    }
    function tuningResponseBase(message) {
        return {
            type:'panel_resp',
            panel:'workbench',
            domain:'equipment_tuning',
            cmd:message.cmd,
            callId:message.callId,
            panelInstanceId:message.panelInstanceId,
            viewSessionId:message.payload.viewSessionId,
            v:1,
            success:true,
            writeEpoch:window.__routeHarness.authority.writeEpoch
        };
    }
    function tuningSnapshot(source) {
        var slotKey = source.slotKey;
        var item = equipmentRows().filter(function(row) {
            return row.slotKey === slotKey;
        })[0].item;
        return {
            gender:'男',
            source:source,
            equipment:{
                name:item.name,
                displayName:item.displayName,
                icon:item.icon,
                type:'武器',
                use:item.use,
                level:item.enhancementLevel,
                tier:'',
                mods:[],
                lastUpdate:10,
                maxLevel:13,
                hardMaxLevel:13
            },
            enhance:{
                currentLevel:item.enhancementLevel,
                availableMaxLevel:13,
                hardMaxLevel:13
            },
            tierCandidates:[{
                candidateKey:'tier|测试进阶',
                itemName:'测试进阶',
                tierName:'一阶',
                owned:1,
                available:true
            }],
            modCandidates:[{
                candidateKey:'mod|测试导轨',
                itemName:'测试导轨',
                owned:2,
                available:true,
                grade:'low',
                gradeLabel:'低级',
                scope:'firearm',
                scopeLabel:'枪械',
                role:'utility',
                roleLabel:'结构与功能'
            }],
            materials:[{itemName:'强化石', count:20}]
        };
    }
    function applyTuning(source, targetLevel) {
        var harness = window.__routeHarness;
        enhancementBySlot[source.slotKey] = targetLevel;
        harness.authority.writeEpoch++;
        harness.authority.loadoutRevision++;
        harness.authority.liveRefreshDirty = true;
        harness.tuning.transaction++;
    }
    function equipmentTuningResponse(message) {
        var harness = window.__routeHarness;
        var response = tuningResponseBase(message);
        if (message.cmd === 'snapshot') {
            harness.tuning.lastSource = JSON.parse(JSON.stringify(message.payload.source));
            response.snapshot = tuningSnapshot(message.payload.source);
            if (message.payload.reconcileAfterCallId) {
                response.reconciled = true;
                response.reconcileAfterCallId = message.payload.reconcileAfterCallId;
            }
        } else if (message.cmd === 'preview') {
            harness.tuning.lastSource = JSON.parse(JSON.stringify(message.payload.source));
            var current = enhancementBySlot[message.payload.source.slotKey];
            var target = message.payload.operation === 'enhance'
                ? message.payload.targetLevel : current;
            response.operation = message.payload.operation;
            response.tuningToken = 'token.' + message.payload.operation + '.' + target;
            response.noOp = target === current;
            response.before = {source:{equipment:{level:current}}};
            response.after = {source:{equipment:{level:target}}};
            response.materials = target === current ? [] : [{
                itemName:'强化石',
                before:20,
                delta:-1,
                after:19
            }];
            response.removedMods = [];
        } else if (message.cmd === 'commit') {
            if (harness.tuning.rejectNextCommit) {
                harness.tuning.rejectNextCommit = false;
                response.success = false;
                response.error = 'transaction_rolled_back';
                return response;
            }
            var tokenParts = String(message.payload.expectedTuningToken || '').split('.');
            var targetLevel = Number(tokenParts[tokenParts.length - 1]);
            applyTuning(harness.tuning.lastSource, targetLevel);
            if (harness.tuning.unknownNextCommit) {
                harness.tuning.unknownNextCommit = false;
                response.success = false;
                response.error = 'delivery_unknown';
                response.requiresReconcile = true;
                response.reconcileAfterCallId = message.callId;
                return response;
            }
            response.operation = tokenParts[1] || 'enhance';
            response.transactionId = 'tuning.tx.' + harness.tuning.transaction;
            response.noOp = false;
            response.snapshot = tuningSnapshot(harness.tuning.lastSource);
            response.materials = [{itemName:'强化石', before:20, delta:-1, after:19}];
            response.inventorySnapshots = [];
        } else if (message.cmd === 'tooltip') {
            response.candidateKey = message.payload.candidateKey;
            response.text = '权威调制候选';
        } else if (message.cmd === 'detach') {
            if (harness.tuning.rejectNextDetach) {
                harness.tuning.rejectNextDetach = false;
                response.success = false;
                response.error = 'invalid_session';
            } else response.detached = true;
        } else {
            response.success = false;
            response.error = 'unsupported_cmd';
        }
        return response;
    }
    window.Bridge = {
        on:function(type, handler) {
            (handlers[type] || (handlers[type] = [])).push(handler);
        },
        off:function(type, handler) {
            var list = handlers[type] || [];
            var index = list.indexOf(handler);
            if (index >= 0) list.splice(index, 1);
        },
        send:function(message) {
            if (message.type === 'panel' && message.domain === 'loadout'
                    && message.cmd === 'candidates'
                    && window.__routeHarness.refuseNextCandidateSend) {
                window.__routeHarness.refuseNextCandidateSend = false;
                window.__routeHarness.events.push('candidates_send_refused');
                return false;
            }
            var captured = JSON.parse(JSON.stringify(message));
            window.__routeHarness.sent.push(captured);
            if (message.type === 'panel' && message.domain === 'loadout') {
                window.__routeHarness.events.push(message.cmd + '_request');
                setTimeout(function() {
                    if (message.cmd === 'finalize') window.__routeHarness.events.push('finalize_response');
                    var response = loadoutResponse(message);
                    if (message.cmd === 'snapshot' && message.payload.reconcileAfterCallId
                            && window.__routeHarness.holdNextReconcile) {
                        window.__routeHarness.holdNextReconcile = false;
                        window.__routeHarness.heldReconcile = response;
                        return;
                    }
                    if (message.cmd === 'snapshot' && !message.payload.reconcileAfterCallId
                            && window.__routeHarness.holdNextSnapshot) {
                        window.__routeHarness.holdNextSnapshot = false;
                        window.__routeHarness.heldSnapshot = response;
                        return;
                    }
                    emit('panel_resp', response);
                }, 0);
            } else if (message.type === 'panel' && message.domain === 'equipment_tuning') {
                window.__routeHarness.events.push('tuning_' + message.cmd + '_request');
                setTimeout(function() {
                    var response = equipmentTuningResponse(message);
                    window.__routeHarness.events.push('tuning_' + message.cmd + '_response');
                    if (message.cmd === 'snapshot' && message.payload.reconcileAfterCallId
                            && window.__routeHarness.tuning.holdNextReconcile) {
                        window.__routeHarness.tuning.holdNextReconcile = false;
                        window.__routeHarness.tuning.heldReconcile = response;
                        return;
                    }
                    if (message.cmd === 'detach'
                            && window.__routeHarness.tuning.holdNextDetach) {
                        window.__routeHarness.tuning.holdNextDetach = false;
                        window.__routeHarness.tuning.heldDetach = response;
                        return;
                    }
                    emit('panel_resp', response);
                }, 0);
            } else if (message.type === 'panel' && message.cmd === 'close') {
                window.__routeHarness.events.push('close_sent');
            }
            return true;
        },
        emit:emit
    };
    window.__routeHarness.releaseReconcile = function() {
        if (!this.heldReconcile) return false;
        var response = this.heldReconcile;
        this.heldReconcile = null;
        emit('panel_resp', response);
        return true;
    };
    window.__routeHarness.releaseSnapshot = function() {
        if (!this.heldSnapshot) return false;
        var response = this.heldSnapshot;
        this.heldSnapshot = null;
        emit('panel_resp', response);
        return true;
    };
    window.__routeHarness.releaseTuningReconcile = function() {
        if (!this.tuning.heldReconcile) return false;
        var response = this.tuning.heldReconcile;
        this.tuning.heldReconcile = null;
        emit('panel_resp', response);
        return true;
    };
    window.__routeHarness.releaseTuningDetach = function() {
        if (!this.tuning.heldDetach) return false;
        var response = this.tuning.heldDetach;
        this.tuning.heldDetach = null;
        emit('panel_resp', response);
        return true;
    };
    window.Toast = {messages:[], add:function(message) { this.messages.push(String(message)); }};
    window.Notch = {reportRect:function() {}};
    var rejectFirstManifest = null;
    var nativeLoadManifest = DressupDollRenderer.loadManifest;
    DressupDollRenderer.loadManifest = function(url) {
        var metrics = window.__routeHarness.manifest;
        metrics.attempts++;
        if (metrics.attempts === 1) {
            return new Promise(function(_, reject) { rejectFirstManifest = reject; });
        }
        return nativeLoadManifest(url).then(function(manifest) {
            metrics.retryResolved = true;
            return manifest;
        });
    };
    window.__routeHarness.rejectFirstManifest = function() {
        if (!rejectFirstManifest) return false;
        var reject = rejectFirstManifest;
        rejectFirstManifest = null;
        this.manifest.firstRejected = true;
        reject(new Error('qa_manifest_transient_failure'));
        return true;
    };
    function rewriteAssetUris(value, uri) {
        if (!value || typeof value !== 'object') return;
        Object.keys(value).forEach(function(key) {
            if (key === 'uri') value[key] = uri;
            else rewriteAssetUris(value[key], uri);
        });
    }
    var nativeBuildState = DressupDollRenderer.buildStateFromEquipment;
    DressupDollRenderer.buildStateFromEquipment = function(manifest, options) {
        var metrics = window.__routeHarness.renderer;
        metrics.lastBuild = {
            gender:options.gender,
            stateLabel:options.stateLabel,
            attackMode:options.attackMode,
            fitFields:(options.fitFields || []).slice(),
            drawFields:(options.drawFields || []).slice(),
            zoom:options.zoom,
            margin:options.margin
        };
        var state = nativeBuildState(manifest, options);
        var failureField = metrics.failNextField;
        if (failureField && state.keyMap[failureField]
                && manifest.skinKeys[state.keyMap[failureField]]) {
            metrics.failNextField = '';
            metrics.expectedAssetFailures++;
            var failureKey = '__qa_expected_asset_failure_'
                + metrics.expectedAssetFailures;
            var broken = JSON.parse(JSON.stringify(
                manifest.skinKeys[state.keyMap[failureField]]));
            rewriteAssetUris(broken, 'skins/' + failureKey + '.png');
            manifest.skinKeys[failureKey] = broken;
            state.keyMap[failureField] = failureKey;
        }
        return state;
    };

        document.querySelector('.equipment-tuning-commit').click();
        check('known barrier pins the original generation and slot until loadout proof arrives',
            await until(function() {

        window.__routeHarness.releaseSnapshot();
        check('known tuning commit adopts a fresh full loadout before releasing the global lock',
            await until(function() {

        var knownEvents = window.__routeHarness.events.slice(knownEventBase);
        check('known barrier order is tuning response then ordinary loadout snapshot',

            && window.__routeHarness.storage.appliedSnapshots === tuningBackpackBase
            && tuningMessages('commit')[tuningCommitBase + 1].payload.source === undefined
            && Object.keys(tuningMessages('commit')[tuningCommitBase + 1].payload)

            knownEvents.join('|'));

        document.querySelector('[data-build-tuning-return]').click();
        check('return from tuning restores the original slot, candidates and stable-key focus',
            await until(function() {
                var state = InventoryWorkbench.debugState().build;
                return state.tuning && !state.tuning.active
                    && state.view.selectedSlotKey === longGunKey
                    && state.view.candidateCount === 1
                    && document.activeElement
                    && document.activeElement.getAttribute('data-roving-key') === longGunKey;
            }));
        check('return from tuning moves the same density control back without losing preference',
            densityToggleIdentity === document.querySelector(
                '.character-build-pane-tools [data-build-density-mount] .item-grid-mode-switch')
            && densityToggleIdentity.getAttribute('data-layout-mode') === 'full'
            && document.querySelectorAll('.item-grid-mode-switch').length === 1);

        document.querySelector('[data-build-action="tune"]').click();
        check('second tuning entry settles for unknown-outcome coverage',
            await until(function() {
                var state = InventoryWorkbench.debugState().build;
                return state.tuning && state.tuning.active
                    && state.tuning.tuning.hasPreview;
            }));
        var unknownCommitBase = tuningMessages('commit').length;
        var unknownLoadoutBase = commandCount('snapshot');
        var unknownEventBase = window.__routeHarness.events.length;
        window.__routeHarness.tuning.unknownNextCommit = true;
        window.__routeHarness.tuning.holdNextReconcile = true;
        document.querySelector('.equipment-tuning-commit').click();
        check('unknown tuning first adopts loadout, then holds a watermarked tuning reconcile under lock',
            await until(function() {
                var state = InventoryWorkbench.debugState().build;
                var barrier = state.tuning.tuning.loadoutBarrier;
                return window.__routeHarness.tuning.heldReconcile
                    && state.session.loadoutRevision === 9
                    && state.tuning.writePending
                    && state.tuning.tuning.needsReconcile
                    && barrier && barrier.kind === 'unknown'
                    && barrier.sessionGeneration === 17
                    && barrier.slotKey === '长枪'
                    && document.querySelector('[data-header-action="storage"]')
                        .getAttribute('aria-disabled') === 'true';
            }));
        var unknownCommit = tuningMessages('commit')[unknownCommitBase];
        var unknownReconcile = tuningMessages('snapshot').filter(function(message) {
            return message.payload.reconcileAfterCallId === unknownCommit.callId;
        })[0];
        check('unknown reconcile uses the post-intent revision and never replays token or refreshes backpack',
            !!unknownReconcile
            && unknownReconcile.payload.source.expectedLoadoutRevision === 9
            && unknownReconcile.payload.reconcileAfterCallId === unknownCommit.callId
            && tuningMessages('commit').length === unknownCommitBase + 1
            && commandCount('snapshot') === unknownLoadoutBase + 1
            && window.__routeHarness.storage.appliedSnapshots === tuningBackpackBase,
            JSON.stringify(unknownReconcile && unknownReconcile.payload));
        var unknownEvents = window.__routeHarness.events.slice(unknownEventBase);
        check('unknown barrier order is commit response, loadout snapshot, then tuning watermark',
            unknownEvents.indexOf('tuning_commit_response')
                < unknownEvents.indexOf('snapshot_request')
            && unknownEvents.indexOf('snapshot_request')
                < unknownEvents.indexOf('tuning_snapshot_request'),
            unknownEvents.join('|'));
        window.__routeHarness.tuning.heldReconcile.success = false;
        window.__routeHarness.tuning.heldReconcile.error = 'snapshot_failed';
        delete window.__routeHarness.tuning.heldReconcile.snapshot;
        delete window.__routeHarness.tuning.heldReconcile.reconciled;
        window.__routeHarness.releaseTuningReconcile();
        check('failed tuning watermark keeps the write handle and barrier locked',
            await until(function() {
                var state = InventoryWorkbench.debugState().build;
                return state.tuning.writePending
                    && state.tuning.tuning.needsReconcile
                    && state.tuning.tuning.loadoutBarrier
                    && !state.tuning.tuning.readPending;
            }));
        var tuningRetryBase = tuningMessages('snapshot').length;
        document.querySelector('.equipment-tuning-retry').click();
        check('tuning watermark retry reuses the adopted revision and exact identity',
            await until(function() {
                return tuningMessages('snapshot').length === tuningRetryBase + 1;
            })
            && JSON.stringify(tuningMessages('snapshot')[tuningRetryBase].payload.source)
                === JSON.stringify({
                    sourceKind:'loadout',
                    sessionGeneration:17,
                    slotKey:'长枪',
                    expectedLoadoutRevision:9
                })
            && tuningMessages('snapshot')[tuningRetryBase].payload.reconcileAfterCallId
                === unknownCommit.callId);
        check('two-proof unknown convergence unlocks without replay',
            await until(function() {
                var state = InventoryWorkbench.debugState().build;
                return !state.tuning.writePending
                    && !state.tuning.tuning.needsReconcile
                    && !state.tuning.tuning.loadoutBarrier
                    && document.querySelector('[data-header-action="storage"]')

            && tuningMessages('commit').length === unknownCommitBase + 1);

        window.__routeHarness.tuning.holdNextDetach = true;
        grenadeSlot.click();
        var pendingTransitionSettled = await until(function() {

        document.querySelector('[data-header-action="storage"]').click();
        check('third storage switch settles', await until(function() {
            return InventoryWorkbench.debugState().view === 'storage';
        }));
        document.querySelector('[data-header-action="close"]').click();
        check('close in storage waits for finalize then exact close', await until(function() {
            return window.__routeHarness.events.indexOf('close_sent') >= 0;
        }));
        var finalMessages = loadoutMessages();
        var finalize = finalMessages.filter(function(message) {

            return message.type === 'panel' && message.cmd === 'close'

        check('finalize carries same generation and revision',

                '{"v":1,"sessionGeneration":17,"expectedLoadoutRevision":9}');
        check('exact close is emitted once with no extra fields',
            !!close && JSON.stringify(Object.keys(close).sort()) === JSON.stringify(
                ['cmd','panel','panelInstanceId','type'])
            && close.panelInstanceId === 'panel.workbench.route-harness');
        check('finalize proof precedes close emission',
            window.__routeHarness.events.indexOf('finalize_response')
                < window.__routeHarness.events.indexOf('close_sent'));
        check('panel is fully closed after proven finalize',
            Panels.isOpen() === false && window.__routeHarness.renderer.active === 0);

        window.__routeHarness.rejectNextSnapshot = true;
        Bridge.emit('panel_cmd', {
            cmd:'open',
            panel:'workbench',
            initData:{
                profile:'battlebox',
                view:'build',
                panelInstanceId:'panel.workbench.rejected-harness'
            }
        });
        check('definitive asynchronous open rejection tears down exact workbench',
            await until(function() {
                return window.__routeHarness.sent.some(function(message) {
                    return message.type === 'panel' && message.cmd === 'close'
                        && message.reason === 'mount_failed'
                        && message.panelInstanceId === 'panel.workbench.rejected-harness';
                }) && Panels.isOpen() === false
                    && window.__routeHarness.renderer.active === 0;
            }));

        Bridge.emit('panel_cmd', {
            cmd:'open',
            panel:'workbench',
            initData:{
                profile:'battlebox',
                view:'build',
                panelInstanceId:'panel.workbench.skills-navigation'
            }
        });
        check('skills navigation probe opens a fresh authoritative build',
            await until(function() {
                var state = InventoryWorkbench.debugState();
                return state.build && state.build.session.state === 'idle'
                    && state.panelInstanceId === 'panel.workbench.skills-navigation';
            }));
        var navigationFinalizeBase = commandCount('finalize');
        var navigationCloseBase = window.__routeHarness.sent.filter(function(message) {
            return message.type === 'panel' && message.cmd === 'close'
                && message.reason === 'navigate_skills';
        }).length;
        document.querySelector('[data-header-action="skills"]').click();
        check('skills header action finalizes then emits one exact navigation close',
            await until(function() {
                return commandCount('finalize') === navigationFinalizeBase + 1
                    && window.__routeHarness.sent.filter(function(message) {
                        return message.type === 'panel' && message.cmd === 'close'
                            && message.reason === 'navigate_skills'
                            && message.panelInstanceId
                                === 'panel.workbench.skills-navigation';
                    }).length === navigationCloseBase + 1
                    && Panels.isOpen() === false;
            }));
        var navigationClose = window.__routeHarness.sent.filter(function(message) {
            return message.type === 'panel' && message.cmd === 'close'
                && message.reason === 'navigate_skills';
        }).slice(-1)[0];
        check('Web navigation stays a strict five-key close and never opens Skills directly',
            JSON.stringify(Object.keys(navigationClose).sort()) === JSON.stringify(
                ['cmd','panel','panelInstanceId','reason','type'])
            && !window.__routeHarness.sent.some(function(message) {
                return message.type === 'panel_cmd' && message.cmd === 'open'
                    && message.panel === 'skills';
            }));
    } catch (error) {
        checks.push({name:'harness execution', ok:false, detail:error.stack || String(error)});
    }
    window.__qaReport = {
        checks:checks,
        sent:window.__routeHarness.sent,
        events:window.__routeHarness.events,
        renderer:window.__routeHarness.renderer,
        manifest:window.__routeHarness.manifest,
        storage:window.__routeHarness.storage,
        visual:visual,
        shotNames:Object.keys(window.__routeHarness.shots).sort(),
        boundary:{controller:'production', storage:'facade_stub', host:'fake_bridge'}
    };
    document.getElementById('qa-output').textContent = JSON.stringify(window.__qaReport, null, 2);
    window.__qaReady = true;
})();
