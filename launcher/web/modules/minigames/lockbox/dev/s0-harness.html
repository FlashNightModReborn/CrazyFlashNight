    --intel-font-body: Arial, "Microsoft YaHei", sans-serif;
    --intel-font-title: Arial, "Microsoft YaHei", sans-serif;

<div id="panel-container" data-panel="lockbox">
    <div id="panel-backdrop"></div>
    <div id="panel-content"></div>
</div>

<script>
window.__minigameOverlayRoot = "";
(function installBrowserWebViewTransport() {
    "use strict";
    if (window.chrome && window.chrome.webview) {
        throw new Error("S0 Browser harness refuses to replace a real WebView2 transport");
    }
    var listeners = [];
    var queuedPosts = [];
    var hostReceiver = null;
    var webview = {
        addEventListener: function(type, handler) {
            if (type === "message" && typeof handler === "function") listeners.push(handler);
        },
        removeEventListener: function(type, handler) {
            if (type !== "message") return;
            for (var i = listeners.length - 1; i >= 0; i -= 1) {
                if (listeners[i] === handler) listeners.splice(i, 1);
            }
        },
        postMessage: function(message) {
            var copy = JSON.parse(JSON.stringify(message));
            if (hostReceiver) hostReceiver(copy);
            else queuedPosts.push(copy);
        }
    };
    window.chrome = window.chrome || {};
    window.chrome.webview = webview;
    window.__lockboxS0BrowserTransport = {
        kind: "browser-host-shim",
        installHost: function(receiver) {
            if (typeof receiver !== "function") throw new Error("browser host receiver is required");
            if (hostReceiver) throw new Error("browser host receiver already installed");
            hostReceiver = receiver;
            var queued = queuedPosts.slice();
            queuedPosts = [];
            for (var i = 0; i < queued.length; i += 1) hostReceiver(queued[i]);
        },
        dispatchToWeb: function(message) {
            var event = { data: JSON.parse(JSON.stringify(message)) };
            var snapshot = listeners.slice();
            for (var i = 0; i < snapshot.length; i += 1) snapshot[i](event);
        }
    };
})();
</script>
