<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><base href="/launcher/web/"><link rel="icon" href="data:,">
<title>漫画节拍运镜 · 界面验证</title><link rel="stylesheet" href="css/panels.css">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c110e}
#comic-dev-tools{position:fixed;top:8px;right:8px;z-index:99999;background:#111;color:#fff;font:13px "Microsoft YaHei",sans-serif;padding:8px 10px;border:1px solid #444;border-radius:3px}
#comic-dev-tools button{font:13px "Microsoft YaHei",sans-serif;margin-right:6px;padding:4px 10px;cursor:pointer}
#comic-dev-tools .hint{display:block;margin-top:6px;color:#9a9;font:12px monospace}
#request-trace{position:fixed;bottom:0;left:0;z-index:99999;background:#111;color:#fff;font:12px monospace;padding:4px}</style></head><body>
<div id="panel-container" data-panel="book-comic"><div id="panel-content"></div></div>
<div id="comic-dev-tools"><div><button data-page="prologue">序章</button><button data-page="boss">Boss</button><button id="replay">重播</button></div><span class="hint" id="mode-hint"></span></div>
<details id="request-trace" hidden><summary>操作记录（仅界面验证）</summary><pre id="request-log"></pre></details>
<script>
var params=new URLSearchParams(location.search);
var handlers={},requests=[],spec=null,comicRoot=null,opens=0;
if(params.get('reduced')==='1')window.CF7_LOW_EFFECTS=true;
document.getElementById('request-trace').hidden=!params.has('trace');
window.Panels={register:function(id,s){if(id==='book-comic')spec=s}};
window.Bridge={on:function(t,f){(handlers[t]||(handlers[t]=[])).push(f)},off:function(t,f){handlers[t]=(handlers[t]||[]).filter(function(x){return x!==f})},
send:function(m){requests.push(m);var log=document.getElementById('request-log');if(log)log.textContent=requests.map(function(r){return r.cmd+' '+(r.payload&&r.payload.pageId||'')}).join('\n');
if(m.cmd==='close')return true;setTimeout(function(){(handlers.panel_resp||[]).forEach(function(f){f({type:'panel_resp',panel:'book-comic',domain:'book-comic',cmd:m.cmd,callId:m.callId,panelInstanceId:m.panelInstanceId,presentationId:m.payload&&m.payload.presentationId,success:true})})},8);return true}};
function openComic(pageId){if(!comicRoot){comicRoot=spec.create();document.getElementById('panel-content').append(comicRoot)}else spec.onClose();
spec.onOpen(comicRoot,{v:1,presentationId:'bookcomic:dev.'+(++opens),slot:'dev_preview',sceneId:'dev_preview',pageId:pageId,panelInstanceId:'book-comic.dev.1'})}
document.querySelectorAll('#comic-dev-tools [data-page]').forEach(function(b){b.addEventListener('click',function(){openComic(b.getAttribute('data-page'))})});
document.getElementById('replay').addEventListener('click',function(){openComic(params.get('page')||'prologue')});
</script>
<script src="modules/panel-scale.js"></script>
<script>
var sourceJson=params.get('source')==='json';
document.getElementById('mode-hint').textContent=(sourceJson?'?source=json 直读 data/books/repair-campus-comic.json，改完刷新即看':'派生产物 modules/book-comic-content.js（生产路径）')+(window.CF7_LOW_EFFECTS?' · reduced-motion':'');
function loadPanelThenOpen(){var s=document.createElement('script');s.src='modules/book-comic-panel.js';s.onload=function(){openComic(params.get('page')||'prologue')};document.body.append(s)}
if(sourceJson)fetch('/data/books/repair-campus-comic.json').then(function(r){return r.json()}).then(function(j){window.BOOK_COMIC_CONTENT=j;loadPanelThenOpen()});
else{var s=document.createElement('script');s.src='modules/book-comic-content.js';s.onload=loadPanelThenOpen;document.body.append(s)}
</script>
</body></html>
